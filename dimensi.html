      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      <input id="dm-login-user" placeholder="Username" autocomplete="username">
    </div>
    <div class="lp-field">
      <svg viewBox="0 0 24 24"><path d="M17 9V7c0-2.8-2.2-5-5-5S7 4.2 7 7v2c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2zM9 7c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V7z"/></svg>
      <input id="dm-login-pass" type="password" placeholder="Password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')dmLogin()">
    </div>
    <button class="lp-btn" onclick="dmLogin()">LOGIN</button>
    <div id="dm-lerr" class="lp-err"></div>
  </div>

<script>
var USER={nama:"-"};
var LP_LOCAL_USERS={};
function dmSetUser(n){ USER={nama:n}; var t=document.getElementById("uname-tx"); if(t) t.textContent=n; }
function lpLocalOk(u,p){ return LP_LOCAL_USERS && Object.prototype.hasOwnProperty.call(LP_LOCAL_USERS,u) && LP_LOCAL_USERS[u]===p; }
function lpSuccess(nama){
  localStorage.setItem("EUP_USER",nama);
  localStorage.setItem("EUP_LOGGED","1");
  dmSetUser(nama);
  document.getElementById("dm-login").classList.add("hidden");
  dmStartMenu();
}
function dmLogin(){
  var u=(document.getElementById("dm-login-user").value||"").trim().toUpperCase();
  var p=(document.getElementById("dm-login-pass").value||"");
  var err=document.getElementById("dm-lerr"); err.textContent="";
  if(!u||!p){ err.textContent="Isi username dan password."; return; }
  if(lpLocalOk(u,p)){ lpSuccess(u); return; }
  fetch(DM_API,{method:"POST",body:JSON.stringify({action:"login",user:u,pass:p})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok===true){
        var nama=(res.data&&(res.data.nama||res.data.user))||(typeof res.data==="string"?res.data:"")||u;
        lpSuccess(String(nama).toUpperCase());
      } else if(res && res.ok===false){ err.textContent=res.msg||"Login gagal."; }
      else { err.textContent="Login gagal."; }
    })
    .catch(function(){ err.textContent="Koneksi gagal. Coba lagi."; });
}
function lpToggleSide(){
  var s=document.getElementById("lp-side"), m=document.getElementById("lp-side-mask");
  var open=s.classList.toggle("open");
  m.style.display=open?"block":"none";
}
function lpLogout(){
  localStorage.removeItem("EUP_LOGGED");
  localStorage.removeItem("EUP_USER");
  location.reload();
}
function dmStartMenu(){ if(window.init_Dimensi) window.init_Dimensi(); }
(function(){
  var logged=localStorage.getItem("EUP_LOGGED")==="1";
  var n=localStorage.getItem("EUP_USER")||"";
  if(logged && n){ dmSetUser(n); document.getElementById("dm-login").classList.add("hidden"); window.__DM_AUTO_START=true; }
  else { window.__DM_AUTO_START=false; }
})();
</script>

<script>
var dmMESIN=null, dmKEY=null, dmSTRUCT=null, dmG=[[],[],[]], dmEDIT=null, dmCARDS=[], dmLAST=null, dmSAVING=false, dmCACHE={};
var dmBACK_VIEW="detail";
var dmSCAN_Y=0;
var DM_API=(typeof API_URL!=="undefined"&&API_URL)?API_URL:"https://script.google.com/macros/s/AKfycbwcKOfb6y5USg7k5oh8oI9jE4T91R8TjBjv6wyuzarEQwk-l95j_RPp9uHsBaD2TbWnbw/exec";
function dmIsGas(){ return !!(window.google && google.script && google.script.run); }
function dmUserNama(){ return (typeof USER!=="undefined" && USER && USER.nama)? USER.nama : "-"; }
function dmEl(id){ return document.getElementById(id); }
function dmEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function dmF2(v){ if(v===""||v==null) return ""; var n=Number(v); return isNaN(n)? "" : n.toFixed(2); }
function dmTrim(v){ if(v===""||v==null) return ""; var n=Number(v); if(isNaN(n)) return ""; return String(Math.round(n*100)/100); }
function dmFootFmt(i,v){ if(i===0) return dmF2(v); if(i===4){ if(v===""||v==null) return ""; return String(v); } return dmTrim(v); }
function dmNumOnly(el){ el.value=el.value.replace(/[^0-9\.]/g,""); }
function dmResetSaveBtn(){ dmSAVING=false; var b=dmEl("dm-simpan"); if(b){ b.textContent="SIMPAN"; b.classList.remove("dm-busy"); } }
function dmToday(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function dmFmtD(iso){ var p=String(iso||"").split("-"); return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):String(iso||""); }
function dmUpdateCalLabel(){
  var el=dmEl("dm-cal-label"); if(!el) return;
  var inDetail=!dmEl("dm-view-detail").classList.contains("hidden");
  el.textContent = inDetail ? dmFmtD(dmKEY||dmToday()) : "PILIH TANGGAL";
}

var DM_LS="EUP_DM_";
function dmLsSet(k,v){ try{ localStorage.setItem(DM_LS+k, JSON.stringify({t:Date.now(),v:v})); }catch(e){} }
function dmLsGet(k){ try{ var r=localStorage.getItem(DM_LS+k); if(!r) return null; var o=JSON.parse(r); return o?o.v:null; }catch(e){ return null; } }
function dmLsDel(k){ try{ localStorage.removeItem(DM_LS+k); }catch(e){} }
function dmCacheGet(k){
  var c=dmCACHE[k];
  if(c && (Date.now()-c.t)<=300000) return c.v;
  var p=dmLsGet(k);
  if(p){ dmCACHE[k]={t:Date.now(), v:p}; return p; }
  if(c) delete dmCACHE[k];
  return null;
}
function dmCacheIsFresh(k, maxAge){
  maxAge = maxAge || 60000;
  var c=dmCACHE[k];
  if(!c || !c.t) return false;
  return (Date.now() - c.t) < maxAge;
}
function dmCacheSet(k,v){ dmCACHE[k]={t:Date.now(),v:v}; dmLsSet(k,v); }
function dmCacheDel(k){ delete dmCACHE[k]; dmLsDel(k); }
function dmCacheClearMachine(m){
  for(var k in dmCACHE){ if(k.indexOf("tgl:"+m)===0 || k.indexOf("det:"+m+":")===0 || k.indexOf("struct:"+m)===0){ delete dmCACHE[k]; } }
  for(var dk in dmDLCACHE){ if(dk.indexOf(m+"|")===0) delete dmDLCACHE[dk]; }
  try{
    var kill=[];
    for(var i=0;i<localStorage.length;i++){ var key=localStorage.key(i); if(!key) continue;
      if(key.indexOf(DM_LS+"tgl:"+m)===0 || key.indexOf(DM_LS+"det:"+m+":")===0) kill.push(key); }
    for(var j=0;j<kill.length;j++){ try{ localStorage.removeItem(kill[j]); }catch(e2){} }
  }catch(e){}
}

var dmToastTimer=null;
function dmToast(msg,type){
  var t=dmEl("dm-toast"); if(!t) return;
  t.textContent=msg;
  t.className="dm-toast "+(type==="err"?"dm-toast-err":"dm-toast-ok");
  if(dmToastTimer){ clearTimeout(dmToastTimer); dmToastTimer=null; }
  dmToastTimer=setTimeout(function(){ t.className="dm-toast hidden"; dmToastTimer=null; }, type==="err"?4000:2200);
}

function dmShowErr(m){
  dmEl("dm-errtxt").textContent=m; dmEl("dm-errbar").classList.remove("hidden");
  if(dmSAVING){ dmResetSaveBtn(); dmCheck(); }
}
function dmHideErr(){ dmEl("dm-errbar").classList.add("hidden"); }
function dmRetry(){ dmHideErr(); if(dmLAST){ dmRun(dmLAST.fn,dmLAST.arg,dmLAST.cb); } }
function dmBackup(){ window.open(DM_API,"_blank"); }

function dmHandle(res, cb){
  if(res && res.ok===false){ dmShowErr(res.msg||"Gagal memproses."); return; }
  if(res && res.ok===true && res.data!==undefined){ cb(res.data); return; }
  cb(res);
}
function dmRun(fn, arg, cb, _retry){
  dmLAST={fn:fn,arg:arg,cb:cb};
  if(dmIsGas()){
    google.script.run
      .withSuccessHandler(function(res){ dmHandle(res, cb); })
      .withFailureHandler(function(e){ dmShowErr("Gagal: "+e.message); })[fn].apply(null,arg);
    return;
  }
  var params={action:fn};
  if(fn==="getProduk"){ params.tipe=arg[0]; }
  if(fn==="dimGetStruct"){ params.mesin=arg[0]; }
  if(fn==="dimGetFormInit"){ params.mesin=arg[0]; params.iso=arg[1]; }
  if(fn==="dimGetNextNo"){ params.mesin=arg[0]; params.iso=arg[1]; }
  if(fn==="dimGetListTanggal"){ params.mesin=arg[0]; params.userNama=arg[1]; }
  if(fn==="dimGetDetail"){ params.mesin=arg[0]; params.key=arg[1]; params.userNama=arg[2]; }
  if(fn==="dimSimpanPaket"){ params.p=arg[0]; params.userNama=arg[1]; }
  if(fn==="dimUpdatePaket"){ params.p=arg[0]; params.key=arg[1]; params.no=arg[2]; params.userNama=arg[3]; }
  if(fn==="dimApprove"){ params.mesin=arg[0]; params.key=arg[1]; params.no=arg[2]; params.userNama=arg[3]; }
  fetch(DM_API,{method:"POST",body:JSON.stringify(params)})
    .then(function(r){ return r.json(); })
    .then(function(res){ dmHandle(res, cb); })
    .catch(function(e){
      if(!_retry){ setTimeout(function(){ dmRun(fn,arg,cb,true); },700); return; }
      dmShowErr("Sambungan data terputus. Coba lagi atau buka cadangan.");
    });
}

function dmShow(v){
  ["dm-view-mesin","dm-view-tanggal","dm-view-form","dm-view-detail"].forEach(function(x){ dmEl(x).classList.add("hidden"); });
  dmEl(v).classList.remove("hidden");
  var btn=dmEl("dm-btn-pilih-tgl");
  if(btn) btn.style.display = (v==="dm-view-detail" && dmMESIN) ? "" : "none";
  dmUpdateCalLabel();
  dmPlaceFab();
}
function dmBack(){
  if(!dmEl("dm-view-mesin").classList.contains("hidden")) return;
  if(!dmEl("dm-view-detail").classList.contains("hidden")) dmGoMesin();
  else if(!dmEl("dm-view-form").classList.contains("hidden")){
    if(dmBACK_VIEW==="tanggal") dmGoTanggal();
    else if(dmKEY) dmOpenDetail(dmKEY);
    else dmGoHariIni();
  }
  else if(!dmEl("dm-view-tanggal").classList.contains("hidden")) dmGoMesin();
  else dmGoMesin();
}
window.init_Dimensi=function(){ dmGoMesin(); dmPlaceFab(); setTimeout(dmPlaceFab,200); };
window.init_dimensi=function(){ dmGoMesin(); dmPlaceFab(); setTimeout(dmPlaceFab,200); };

function dmShellFooterHeight(){
  var tags=["div","footer","span","p","header"];
  for(var t=0;t<tags.length;t++){
    var nodes=document.getElementsByTagName(tags[t]);
    for(var i=0;i<nodes.length;i++){
      var el=nodes[i];
      if(el.children.length) continue;
      var txt=(el.textContent||"").replace(/\s+/g," ").trim();
      if(txt!=="EUP GUDANG TAIPA") continue;
      var r=el.getBoundingClientRect();
      if(r.height<=0) continue;
      if(r.top < window.innerHeight*0.5) continue;
      var bar=el;
      while(bar && bar!==document.documentElement){
        var cs=window.getComputedStyle(bar);
        if(cs.position==="fixed"||cs.position==="sticky") break;
        bar=bar.parentElement;
      }
      var br=(bar && bar!==document.documentElement)?bar.getBoundingClientRect():r;
      return Math.max(0, Math.round(window.innerHeight - br.top));
    }
  }
  return 0;
}
function dmPlaceFab(){
  var fabs=document.querySelectorAll(".dm-fab");
  if(!fabs.length) return;
  var footH=dmShellFooterHeight();
  var rightIn=16;
  var cr=document.querySelector(".dm-crumb");
  if(cr){
    var rr=cr.getBoundingClientRect();
    if(rr.width>0){ rightIn=Math.max(8, Math.round(window.innerWidth - rr.right)); }
  }
  for(var i=0;i<fabs.length;i++){
    fabs[i].style.bottom=(footH>0?footH:56)+"px";
    fabs[i].style.right=rightIn+"px";
  }
}
window.addEventListener("resize", dmPlaceFab);
window.addEventListener("orientationchange", dmPlaceFab);

function dmRenderMesin(list){
  if(!list || !list.length){ dmEl("dm-mesin-grid").innerHTML='<div class="dm-card">Master mesin kosong.</div>'; return; }
  dmEl("dm-mesin-grid").innerHTML=list.map(function(m){
    return '<div class="dm-mesin-card" onclick="dmOpenMesin(\''+m+'\')">'+m+'</div>';
  }).join("");
}
function dmGoMesin(){
  dmMESIN=null; dmEl("dm-crumb").textContent="PILIH MESIN"; dmShow("dm-view-mesin");
  var c=dmCacheGet("mesin");
  if(c) dmRenderMesin(c);
  dmRun("getMesin",[],function(list){ dmCacheSet("mesin",list); dmRenderMesin(list); });
}
function dmOpenMesin(m){
  dmMESIN=m;
  var ck="tgl:"+m;
  if(!dmCacheGet(ck)){
    dmRun("dimGetListTanggal",[m,dmUserNama()],function(list){ dmCacheSet(ck,list); });
  }
  dmGoHariIni();
}

function dmRenderTanggal(list){
  var arr=(list||[]).slice().sort(function(a,b){ return a.key>b.key?-1:(a.key<b.key?1:0); });
  var html="", bl="";
  arr.forEach(function(x){
    if(x.bulan!==bl){ bl=x.bulan; html+='<div class="dm-bulan">'+bl+'</div>'; }
    html+='<div class="dm-tgl-row" onclick="dmOpenDetail(\''+x.key+'\')"><span class="t">'+x.tgl+
          '</span><span class="tot">'+x.count+' data</span><span class="chev">&#10095;</span></div>';
  });
  dmEl("dm-tgl-list").innerHTML=html||'<div class="dm-card">Belum ada data dimensi.</div>';
  arr.forEach(function(x){
    var dk="det:"+dmMESIN+":"+x.key;
    if(!dmCacheGet(dk)){
      dmRun("dimGetDetail",[dmMESIN,x.key,dmUserNama()],function(d){ dmCacheSet(dk,d); });
    }
  });
}
function dmGoTanggal(){
  dmEl("dm-crumb").textContent="PILIH TANGGAL · "+dmMESIN; dmShow("dm-view-tanggal");
  var ck="tgl:"+dmMESIN;
  var c=dmCacheGet(ck);
  if(c){ dmRenderTanggal(c); if(dmCacheIsFresh(ck,60000)) return; }
  dmRun("dimGetListTanggal",[dmMESIN, dmUserNama()],function(list){ dmCacheSet(ck,list); dmRenderTanggal(list); });
}

function dmGoHariIni(){
  var ck="tgl:"+dmMESIN;
  var go=function(list){
    var today=dmToday(); var match=null;
    (list||[]).forEach(function(x){ if(x.key===today) match=x; });
    if(match){ dmOpenDetail(match.key); }
    else { dmRenderEmptyToday(); }
  };
  var c=dmCacheGet(ck);
  if(c){ go(c); if(dmCacheIsFresh(ck,60000)) return; }
  dmRun("dimGetListTanggal",[dmMESIN, dmUserNama()],function(list){ dmCacheSet(ck,list); go(list); });
}
function dmRenderEmptyToday(){
  dmKEY=dmToday(); dmCARDS=[];
  dmShow("dm-view-detail");
  dmEl("dm-crumb").textContent="DATA DIMENSI "+dmMESIN+" · "+dmFmtD(dmToday());
  dmEl("dm-detail-box").innerHTML='<div class="dm-card" style="text-align:center;color:#888;padding:30px">BELUM ADA DATA</div>';
}

function dmCalClick(e){
  var el=e.target;
  try{ if(el && typeof el.showPicker==="function"){ el.showPicker(); } }catch(err){}
}
function dmCalPick(v){
  if(!v) return;
  dmOpenDetail(v);
}

function dmLabels(count){
  if(count===6) return ["Tinggi Profil","Lebar Atas","Lebar Sayap","Lebar Sayap","Lips","Lips"];
  if(count===5) return ["Tinggi Profil","Lebar Atas","Lebar Sayap","Lebar Sayap","Lips"];
  var out=[]; for(var i=0;i<count;i++){ out.push("Ukuran "+(i+1)); } return out;
}

function dmProdTipe(){ return (dmMESIN && String(dmMESIN).indexOf("RENG")>=0) ? "RENG" : "TRUSS"; }
function dmRenderProduk(list, sel){
  var el=dmEl("dm-produk"); if(!el) return;
  var h='<option value="">Pilih Produk</option>';
  (list||[]).forEach(function(p){
    h+='<option'+(sel && String(p)===String(sel)?' selected':'')+'>'+dmEsc(p)+'</option>';
  });
  el.innerHTML=h;
}
function dmLoadProduk(sel){
  var t=dmProdTipe(), ck="prod:"+t;
  var c=dmCacheGet(ck);
  if(c) dmRenderProduk(c, sel);
  dmRun("getProduk",[t],function(list){ dmCacheSet(ck,list); dmRenderProduk(list, sel); });
}
function dmEnsureStruct(cb){
  var ck="struct:"+dmMESIN;
  var c=dmCacheGet(ck);
  if(c){ dmSTRUCT=c; dmBuildBadges(); if(cb) cb(); return; }
  dmRun("dimGetStruct",[dmMESIN],function(st){ dmSTRUCT=st; dmCacheSet(ck,st); dmBuildBadges(); if(cb) cb(); });
}

function dmOpenForm(){
  dmEDIT=null; dmResetSaveBtn();
  var fromTanggal = !dmEl("dm-view-tanggal").classList.contains("hidden");
  dmBACK_VIEW = fromTanggal ? "tanggal" : "detail";
  dmEl("dm-crumb").textContent="DATA DIMENSI "+dmMESIN;
  dmShow("dm-view-form");
  dmEl("dm-op").value=dmUserNama();
  dmEl("dm-mesin").value=dmMESIN;
  dmEl("dm-tgl").value=dmToday();
  dmEl("dm-produk").innerHTML='<option value="">Pilih Produk</option>';
  dmEl("dm-kpc").value=""; dmEl("dm-panjang").value="";
  dmEl("dm-lb").value=""; dmEl("dm-bow").value=""; dmEl("dm-cember").value=""; dmEl("dm-twist").value=""; dmEl("dm-berat").value="";
  dmG=[[],[],[]];
  dmEl("dm-badges").innerHTML="";
  dmLoadProduk(null);
  dmEnsureStruct(function(){ dmCheck(); });
  dmRefreshNo();
  dmCheck();
}
function dmBuildBadges(){
  var count=dmSTRUCT.count, h="";
  h+='<div class="dm-ftbl-wrap"><table class="dm-ftbl"><tr>';
  for(var i=0;i<count;i++){ h+='<th>'+dmSTRUCT.ukur[i].name+' \u00b1 1</th>'; }
  h+='</tr>';
  for(var g=0; g<3; g++){
    h+='<tr>';
    for(var i=0;i<count;i++){
      h+='<td><input inputmode="numeric" id="dm-b-'+g+'-'+i+'" onfocus="this.select()" oninput="dmNumOnly(this);dmCheck()" onblur="dmBlurBadge(this,'+g+','+i+')"></td>';
    }
    h+='</tr>';
  }
  h+='</table></div>';
  dmEl("dm-badges").innerHTML=h;
}
function dmRefreshNo(){
  dmRun("dimGetNextNo",[dmMESIN,dmEl("dm-tgl").value],function(n){ dmEl("dm-no").value=("00"+n).slice(-3); });
}

function dmBlurBadge(el,g,i){
  var raw=el.value.trim();
  if(raw===""){ dmG[g][i]=""; dmCheck(); return; }
  var std=Number(dmSTRUCT.ukur[i].name)||0;
  var val;
  if(raw.indexOf(".")>=0){ val=Number(raw); }
  else{
    var d=raw.replace(/[^0-9]/g,"");
    if(d.length<=2){ val=std+Number(d)/100; }
    else{ val=Number(d)/100; }
  }
  el.value=dmF2(val); dmG[g][i]=dmF2(val); dmCheck();
}
function dmBlurPlain(el){
  var raw=el.value.trim();
  if(raw===""){ dmCheck(); return; }
  var val;
  if(raw.indexOf(".")>=0){ val=Number(raw); }
  else{ val=Number(raw.replace(/[^0-9]/g,""))/100; }
  el.value=dmF2(val); dmCheck();
}
function dmCheck(){
  if(dmSAVING) return;
  var ok=!!dmEl("dm-produk").value && dmEl("dm-kpc").value.trim()!=="" && dmEl("dm-panjang").value.trim()!=="";
  if(ok && dmSTRUCT && dmSTRUCT.count){
    for(var g=0;g<3 && ok;g++){ for(var i=0;i<dmSTRUCT.count;i++){ if(!dmG[g][i]){ ok=false; break; } } }
  } else if(ok && (!dmSTRUCT || !dmSTRUCT.count)){ ok=false; }
  if(ok){ ["dm-lb","dm-bow","dm-cember","dm-twist","dm-berat"].forEach(function(id){ if(dmEl(id).value.trim()==="") ok=false; }); }

}

function dmMakeQr(text,px){
  if(typeof qrcode==="undefined") return null;
  try{
    var qr=qrcode(0,"M"); qr.addData(text); qr.make();
    var n=qr.getModuleCount(), q=2, tot=n+q*2;
    var sc=Math.max(1,Math.floor(px/tot));
    var cv=document.createElement("canvas"); cv.width=tot*sc; cv.height=tot*sc;
    var x=cv.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height);
    x.fillStyle="#000";
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)) x.fillRect((c+q)*sc,(r+q)*sc,sc,sc); } }
    return cv;
  }catch(e){ return null; }
}
function dmQrData(text,px){
  var cv=dmMakeQr(text,px);
  if(cv) return cv.toDataURL();
  return "https://api.qrserver.com/v1/create-qr-code/?size=86x86&data="+encodeURIComponent(text);
}

var dmScanStream=null, dmScanTimer=null, dmScanSent=false, dmTorchOn=false, dmScanCv=null;
var dmScanListenerAdded=false;
function dmLoadJsQR(cb){
  if(typeof jsQR!=="undefined"){ cb(); return; }
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
  s.onload=cb;
  s.onerror=function(){ alert("Gagal memuat mesin QR. Cek internet."); };
  document.head.appendChild(s);
}
function dmStopStream(){
  if(dmScanTimer){ clearInterval(dmScanTimer); dmScanTimer=null; }
  if(dmScanStream){ dmScanStream.getTracks().forEach(function(t){ t.stop(); }); dmScanStream=null; }
  var v=dmEl("dm-scan-video"); if(v){ v.srcObject=null; }
  dmTorchOn=false;
}
function dmAddScanListener(){
  if(dmScanListenerAdded) return;
  dmScanListenerAdded=true;
  window.addEventListener("DMS_KPC_SCAN", function(ev){
    if(ev && ev.detail && ev.detail.text){ dmApplyKpc(ev.detail.text); }
  });
}
function dmOpenScan(){
  if(window.__SCANNER__ && window.__SCANNER__.start){
    dmAddScanListener();
    window.__SCANNER__.start();
    return;
  }
  dmSCAN_Y = window.scrollY || window.pageYOffset || 0;
  document.body.style.overflow="hidden";
  dmEl("dm-scan-modal").classList.remove("hidden");
  dmLoadJsQR(function(){ dmStartLive(); });
}
function dmCloseScan(){
  dmStopStream();
  dmEl("dm-scan-modal").classList.add("hidden");
  document.body.style.overflow="";
  try{ window.scrollTo(0, dmSCAN_Y); }catch(e){}
}
function dmStartLive(deviceId){
  dmStopStream();
  dmScanSent=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Browser tidak mendukung kamera."); return; }
  var vid={width:{ideal:1920},height:{ideal:1080}};
  if(deviceId){ vid.deviceId={exact:deviceId}; } else { vid.facingMode="environment"; }
  navigator.mediaDevices.getUserMedia({video:vid,audio:false})
    .then(function(stream){
      dmScanStream=stream;
      var v=dmEl("dm-scan-video");
      v.srcObject=stream; v.play();
      dmScanCv=document.createElement("canvas");
      dmListCams(deviceId||null);
      dmScanTimer=setInterval(dmScanTick,300);
    })
    .catch(function(e){ alert("Kamera tidak bisa dibuka: "+e.message); dmCloseScan(); });
}
function dmScanTick(){
  if(dmScanSent||!dmScanStream||typeof jsQR==="undefined") return;
  var v=dmEl("dm-scan-video");
  if(!v||!v.videoWidth||v.readyState!==4) return;
  dmScanCv.width=v.videoWidth; dmScanCv.height=v.videoHeight;
  var cx=dmScanCv.getContext("2d");
  cx.drawImage(v,0,0);
  var img=cx.getImageData(0,0,dmScanCv.width,dmScanCv.height);
  var code=null;
  try{ code=jsQR(img.data,dmScanCv.width,dmScanCv.height,{inversionAttempts:"attemptBoth"}); }catch(e){}
  if(code&&code.data){
    dmScanSent=true;
    var txt=code.data;
    setTimeout(function(){ dmApplyKpc(txt); },120);
  }
}
function dmListCams(activeId){
  if(!navigator.mediaDevices.enumerateDevices) return;
  navigator.mediaDevices.enumerateDevices().then(function(devs){
    var cams=devs.filter(function(d){ return d.kind==="videoinput"; });
    var sel=dmEl("dm-scan-cams"), cnt=dmEl("dm-scan-camcount");
    if(cnt) cnt.textContent=cams.length;
    sel.innerHTML="";
    cams.forEach(function(c,i){
      var o=document.createElement("option");
      o.value=c.deviceId;
      o.textContent=(c.label||("camera "+(i+1)));
      if(activeId===c.deviceId) o.selected=true;
      sel.appendChild(o);
    });
  }).catch(function(){});
}
function dmCamChange(){ dmStartLive(dmEl("dm-scan-cams").value); }
function dmZoomChange(el){
  var lbl=dmEl("dm-scan-zoomlbl");
  if(lbl) lbl.textContent=Number(el.value).toFixed(1).replace(/\.0$/,"")+"x zoom";
  if(!dmScanStream) return;
  var t=dmScanStream.getVideoTracks()[0];
  if(!t||!t.getCapabilities) return;
  var cap=t.getCapabilities();
  if(cap&&cap.zoom){
    var z=Math.min(Math.max(Number(el.value),cap.zoom.min||1),cap.zoom.max||1);
    try{ t.applyConstraints({advanced:[{zoom:z}]}); }catch(e){}
  }
}
function dmToggleTorch(){
  if(!dmScanStream) return;
  var t=dmScanStream.getVideoTracks()[0];
  if(!t||!t.getCapabilities) return;
  var cap=t.getCapabilities();
  if(!cap||!cap.torch){ alert("Lampu senter tidak didukung perangkat ini."); return; }
  dmTorchOn=!dmTorchOn;
  try{ t.applyConstraints({advanced:[{torch:dmTorchOn}]}); }catch(e){}
}
function dmApplyKpc(t){ dmCloseScan(); dmEl("dm-kpc").value=String(t||"").trim(); dmCheck(); }

var dmDLCACHE={};
var dmDLBusy=false;
function dmDlKey(c){ return dmMESIN+"|"+dmKEY+"|"+c.no; }
function dmDownload(idx){
  var c=dmCARDS[idx]; if(!c) return;
  var key=dmDlKey(c);
  var cached=dmDLCACHE[key];
  if(cached){ dmTriggerDl(cached, dmMESIN+" ("+c.no+").png"); return; }
  if(dmDLBusy) return;
  var card=document.querySelector('[data-dm-card="'+String(idx)+'"]');
  var btn=card?card.querySelectorAll('.dm-icobtn')[1]:null;
  var restore=function(){
    dmDLBusy=false;
    if(btn){ btn.disabled=false; btn.style.opacity=''; btn.style.pointerEvents=''; btn.title='Download'; }
  };
  dmDLBusy=true;
  if(btn){ btn.disabled=true; btn.style.opacity='.4'; btn.style.pointerEvents='none'; btn.title='Menyiapkan gambar...'; }
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    try{
      var url=dmBuildDlCard(c);
      if(!url){ alert("Gagal membuat gambar."); restore(); return; }
      dmDLCACHE[key]=url;
      dmTriggerDl(url, dmMESIN+" ("+c.no+").png");
      restore();
    }catch(e){ restore(); }
  }); });
}
function dmTriggerDl(url,name){
  try{
    var a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener"; a.style.display="none";
    document.body.appendChild(a);
    setTimeout(function(){
      try{ a.click(); }catch(e){}
      setTimeout(function(){ try{ a.remove(); }catch(e){} },2000);
    },60);
  }catch(e){}
}
function dmBuildDlCard(c){
  var count=dmSTRUCT.count;
  var F=55;
  var k=F/24;
  var S=2;
  var M=Math.round(50*k);
  var W=Math.round(1200*k);
  var CW=W-M*2;
  var yTitle=Math.round(50*k);
  var yLineBlue=Math.round(75*k);
  var yNo=Math.round(110*k);
  var yQrTop=Math.round(140*k);
  var qrSize=Math.round(160*k);
  var yInfoStart=yQrTop+qrSize+Math.round(40*k);
  var lineH=Math.round(38*k);
  var infoLines=5;
  var yTableHead=yInfoStart+(infoLines*lineH)+Math.round(25*k);
  var headH=Math.round(44*k);
  var rowH=Math.round(44*k);
  var labH=Math.round(36*k);
  var valH=Math.round(40*k);
  var tableBodyH = (3 * rowH);
  var tableFootH = labH + valH;
  var tableTotalH = headH + tableBodyH + tableFootH;
  var yTableBottom = yTableHead + tableTotalH;
  var yFooterLine = yTableBottom + Math.round(30*k);
  var H = yFooterLine + Math.round(50*k);
  var cv=document.createElement("canvas");
  cv.width=W*S; cv.height=H*S;
  var x=cv.getContext("2d");
  x.scale(S,S);
  x.fillStyle="#f7fafc"; x.fillRect(0,0,W,H);
  x.textBaseline="middle";
  x.fillStyle="#112233"; 
  x.font="bold "+F+"px Arial, sans-serif"; 
  x.textAlign="center";
  x.fillText("DATA DIMENSI "+String(c.mesin).toUpperCase(), W/2, yTitle);
  x.fillStyle="#1155cc"; 
  x.fillRect(M, yLineBlue, CW, Math.round(8*k));
  x.fillStyle="#112233"; 
  x.font="bold "+F+"px Arial, sans-serif"; 
  x.textAlign="center";
  x.fillText("[NO "+c.no+"]", W/2, yNo);
  var q=dmMakeQr(c.kpc||"-", qrSize*2); 
  if(q){ 
    try{ 
      x.drawImage(q, M, yQrTop, qrSize, qrSize); 
    }catch(e){} 
  }
  x.textAlign="left"; 
  x.fillStyle="#112233"; 
  x.font="bold "+F+"px Arial, sans-serif";
  x.fillText(c.kpc||"-", M+qrSize+Math.round(25*k), yQrTop+qrSize/2);
  var inf=[
    ["Tanggal", c.tanggal.split("-").reverse().join("/")],
    ["Operator", c.operator],
    ["Mesin", c.mesin],
    ["Produk", c.produk],
    ["Panjang Produk", String(c.panjang)]
  ];
  x.textAlign="left";
  inf.forEach(function(row,i){
    var yPos = yInfoStart + i*lineH + lineH/2;
    x.fillStyle="#334455"; 
    x.font="bold "+F+"px Arial, sans-serif";
    x.fillText(row[0], M, yPos);
    x.fillStyle="#112233"; 
    x.font="bold "+F+"px Arial, sans-serif";
    x.fillText(": "+row[1], M+Math.round(250*k), yPos); 
  });
  x.fillStyle="#1155cc"; 
  x.fillRect(M, yTableHead, CW, headH);
  x.fillStyle="#fff"; 
  x.font="bold "+F+"px Arial, sans-serif"; 
  x.textAlign="center";
  var colW=CW/count;
  dmSTRUCT.ukur.forEach(function(u,i){ 
    x.fillText(u.name+" \u00B1 1", M+colW*i+colW/2, yTableHead+headH/2); 
  });
  x.fillStyle="#fff"; 
  x.fillRect(M, yTableHead+headH, CW, tableBodyH + tableFootH);
  x.strokeStyle="#cfd6e0"; 
  x.lineWidth=1;
  var ys=[
    yTableHead,
    yTableHead+headH,
    yTableHead+headH+rowH,
    yTableHead+headH+2*rowH,
    yTableHead+headH+3*rowH,
    yTableHead+headH+3*rowH+labH,
    yTableHead+headH+3*rowH+labH+valH
  ];
  for(var r=0;r<ys.length;r++){ 
    x.beginPath(); 
    x.moveTo(M, ys[r]); 
    x.lineTo(M+CW, ys[r]); 
    x.stroke(); 
  }
  for(var i2=0;i2<=count;i2++){ 
    var xx=M+colW*i2; 
    x.beginPath(); 
    x.moveTo(xx, yTableHead); 
    x.lineTo(xx, ys[ys.length-1]); 
    x.stroke(); 
  }
  x.strokeRect(M, yTableHead, CW, tableTotalH);
  x.fillStyle="#112233"; 
  x.font="bold "+F+"px Arial, sans-serif"; 
  x.textAlign="center";
  for(var g=0;g<3;g++){
    var row2=c.groups[g]||[];
    var cy = yTableHead + headH + (g*rowH) + rowH/2;
    for(var u2=0;u2<count;u2++){ 
      x.fillText(dmF2(row2[u2])||"", M+colW*u2+colW/2, cy);
    }
  }
  var labs2=["L.B","BOW","CEMBER","TWIST","BERAT"];
  var vals2=[c.lb,c.bow,c.cember,c.twist,c.berat];
  while(labs2.length<count){ labs2.push(""); }
  while(vals2.length<count){ vals2.push(""); }
  x.fillStyle="#555555"; 
  x.font="bold "+F+"px Arial, sans-serif";
  labs2.forEach(function(l,i){ 
    if(l) x.fillText(l, M+colW*i+colW/2, yTableHead+headH+3*rowH+labH/2); 
  });
  x.fillStyle="#112233"; 
  x.font="bold "+F+"px Arial, sans-serif";
  vals2.forEach(function(v,i){ 
    if(v!=="") x.fillText(dmFootFmt(i,v), M+colW*i+colW/2, yTableHead+headH+3*rowH+labH+valH/2);
  });
  x.strokeStyle="#99aabb"; 
  x.beginPath(); 
  x.moveTo(M, yFooterLine); 
  x.lineTo(W-M, yFooterLine); 
  x.stroke();
