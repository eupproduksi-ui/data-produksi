<style>
.db-card{background:#fff;border:1px solid #e3e7ee;border-radius:8px;padding:14px;margin-bottom:14px}
.db-title{color:#1155cc;border-left:5px solid #1155cc;padding-left:10px;margin-bottom:14px}
.db-jam{color:#1155cc;font-weight:bold;font-size:22px;letter-spacing:2px}
</style>

<h2 class="db-title">DASHBOARD</h2>
<div class="db-card">
  <div id="db-tanggal" style="font-weight:bold"></div>
  <div id="db-jam" class="db-jam"></div>
</div>
<div class="db-card" style="min-height:160px;color:#888">Ringkasan produksi per mesin — tahap berikutnya.</div>

<script>
var dbTimer=null;
function dbTick(){
  var e=document.getElementById('db-jam');
  if(!e){ clearInterval(dbTimer); return; }
  var d=new Date();
  var hari=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var bul=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  document.getElementById('db-tanggal').textContent=hari[d.getDay()]+', '+d.getDate()+' '+bul[d.getMonth()]+' '+d.getFullYear();
  e.textContent=d.toTimeString().slice(0,8);
}
window.init_dashboard=function(){
  dbTick();
  if(dbTimer) clearInterval(dbTimer);
  dbTimer=setInterval(dbTick,1000);
};
</script>
