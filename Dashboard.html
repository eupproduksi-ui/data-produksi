<style>
.db-card{background:#fff;border:1px solid #e3e7ee;border-radius:8px;padding:14px;margin-bottom:14px}
.db-title{color:#1155cc;border-left:5px solid #1155cc;padding-left:10px;margin-bottom:14px}
.db-tgl{font-weight:bold;font-size:17px;color:#112233}
.db-jam{color:#1155cc;font-weight:bold;font-size:17px;letter-spacing:1px}
.db-head-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.db-mes-title{color:#1155cc;font-weight:bold;font-size:16px;letter-spacing:.5px}
.db-sbtn{background:#e8eefb;color:#1155cc;border:1px solid #1155cc;border-radius:6px;padding:6px 12px;font-weight:bold;font-size:12px;cursor:pointer}
.db-sbtn:active{background:#1155cc;color:#fff}
.db-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #e3e7ee;border-radius:8px}
table.db-table{border-collapse:collapse;font-size:13px;white-space:nowrap;width:100%}
.db-table th{background:#1155cc;color:#fff;padding:8px 10px;border:1px solid #0d3f92;text-align:center;font-size:12px;font-weight:bold}
.db-table td{padding:8px 10px;border:1px solid #e3e7ee;text-align:center;font-weight:bold;color:#112233}
.db-empty{color:#888;font-size:14px}
</style>

<h2 class="db-title">DASHBOARD</h2>
<div class="db-card">
  <div id="db-tanggal" class="db-tgl"></div>
  <div id="db-jam" class="db-jam"></div>
</div>
<div id="db-dim-area"></div>

<script>
var dbTimer=null, dbDimTimer=null;
var DB_API=(typeof API_URL!=="undefined"&&API_URL)?API_URL:"https://script.google.com/macros/s/AKfycbwcKOfb6y5USg7k5oh8oI9jE4T91R8TjBjv6wyuzarEQwk-l95j_RPp9uHsBaD2TbWnbw/exec";
function dbIsGas(){ return !!(window.google && google.script && google.script.run); }
function dbF2(v){ if(v===""||v==null) return ""; var n=Number(v); return isNaN(n)? "" : n.toFixed(2); }
function dbTrim(v){ if(v===""||v==null) return ""; var n=Number(v); if(isNaN(n)) return ""; return String(Math.round(n*100)/100); }
function dbScroll(id, dx){
  var el=document.getElementById(id);
  if(!el) return;
  try{ el.scrollBy({left:dx, behavior:"smooth"}); }catch(e){ el.scrollLeft+=dx; }
}
function dbTick(){
  var e=document.getElementById('db-jam');
  if(!e){ clearInterval(dbTimer); return; }
  var d=new Date();
  var hari=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var bul=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  document.getElementById('db-tanggal').textContent=hari[d.getDay()]+', '+d.getDate()+' '+bul[d.getMonth()]+' '+d.getFullYear();
  e.textContent=d.toTimeString().slice(0,8);
}
function dbHandle(res, cb){
  if(res && res.ok===true && res.data!==undefined){ cb(res.data); return; }
  if(res && res.ok===false){ cb({machines:[]}); return; }
  cb(res||{machines:[]});
}
function dbLoadDimensi(){
  var box=document.getElementById('db-dim-area');
  if(!box) return;
  if(dbIsGas()){
    google.script.run
      .withSuccessHandler(function(res){ dbHandle(res, dbRenderDimensi); })
      .withFailureHandler(function(){ dbRenderDimensi({machines:[]}); })
      .dimGetHariIni();
    return;
  }
  fetch(DB_API,{method:"POST",body:JSON.stringify({action:"dimGetHariIni"})})
    .then(function(r){ return r.json(); })
    .then(function(res){ dbHandle(res, dbRenderDimensi); })
    .catch(function(){ dbRenderDimensi({machines:[]}); });
}
/* ===== RENDER: TANPA KOLOM ID, TANPA KOLOM STATUS ===== */
function dbRenderDimensi(d){
  var box=document.getElementById('db-dim-area');
  if(!box) return;
  var ms=(d && d.machines)? d.machines : [];
  if(!ms.length){
    box.innerHTML='<div class="db-card"><div class="db-head-row"><div class="db-mes-title">DATA DIMENSI HARI INI</div></div><div class="db-empty">Belum ada data dimensi hari ini.</div></div>';
    return;
  }
  box.innerHTML=ms.map(function(m, idx){
    var count=m.ukur.length;
    var head='<tr><th>NO</th><th>TANGGAL</th><th>OPERATOR</th><th>MESIN</th><th>NAMA PRODUK</th><th>KPC</th><th>PANJANG</th>';
    for(var g=0; g<3; g++){
      for(var u=0; u<count; u++){ head+='<th>'+m.ukur[u]+' &#177; 1</th>'; }
    }
    head+='<th>LEBAR BAWAH</th><th>BOW</th><th>CEMBER</th><th>TWIST</th><th>BERAT</th></tr>';
    var body=m.rows.map(function(r){
      var tgl=r.tanggal.split("-").reverse().join("/");
      var row='<td>'+("00"+(r.nor||r.no)).slice(-3)+'</td><td>'+tgl+'</td><td>'+r.operator+'</td><td>'+r.mesin+'</td><td>'+r.produk+'</td><td>'+r.kpc+'</td><td>'+r.panjang+'</td>';
      for(var g=0; g<3; g++){
        var grp=r.groups[g]||[];
        for(var u=0; u<count; u++){ row+='<td>'+(dbF2(grp[u])||"")+'</td>'; }
      }
      row+='<td>'+dbTrim(r.lb)+'</td><td>'+dbTrim(r.bow)+'</td><td>'+dbTrim(r.cember)+'</td><td>'+dbTrim(r.twist)+'</td><td>'+dbTrim(r.berat)+'</td>';
      return '<tr>'+row+'</tr>';
    }).join("");
    return '<div class="db-card">'+
           '<div class="db-head-row">'+
             '<div class="db-mes-title">DATA DIMENSI HARI INI</div>'+
             '<button type="button" class="db-sbtn" onclick="dbScroll(\'db-wrap-'+idx+'\',-400)">&#9664; GESER</button>'+
             '<button type="button" class="db-sbtn" onclick="dbScroll(\'db-wrap-'+idx+'\',400)">GESER &#9654;</button>'+
           '</div>'+
           '<div class="db-table-wrap" id="db-wrap-'+idx+'"><table class="db-table">'+head+body+'</table></div></div>';
  }).join("");
}
window.init_dashboard=function(){
  dbTick();
  if(dbTimer) clearInterval(dbTimer);
  dbTimer=setInterval(dbTick,1000);
  dbLoadDimensi();
  if(dbDimTimer) clearInterval(dbDimTimer);
  dbDimTimer=setInterval(dbLoadDimensi,60000);
};
</script>
