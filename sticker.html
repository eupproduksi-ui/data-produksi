<script>
var USER={nama:"-"};
var LP_LOCAL_USERS={};
function spSetUser(n){ USER={nama:n}; var t=document.getElementById("uname-tx"); if(t) t.textContent=n; }
function lpLocalOk(u,p){ return LP_LOCAL_USERS && Object.prototype.hasOwnProperty.call(LP_LOCAL_USERS,u) && LP_LOCAL_USERS[u]===p; }
function lpSuccess(nama){
  localStorage.setItem("EUP_USER",nama);
  localStorage.setItem("EUP_LOGGED","1");
  spSetUser(nama);
  document.getElementById("sp-login").classList.add("hidden");
  spStartMenu();
}
function spLogin(){
  var u=(document.getElementById("sp-login-user").value||"").trim().toUpperCase();
  var p=(document.getElementById("sp-login-pass").value||"");
  var err=document.getElementById("sp-lerr"); err.textContent="";
  if(!u||!p){ err.textContent="Isi username dan password."; return; }
  if(lpLocalOk(u,p)){ lpSuccess(u); return; }
  fetch(SP_API,{method:"POST",body:JSON.stringify({action:"login",user:u,pass:p})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok===true){
        var nama=(res.data&&(res.data.nama||res.data.user))||(typeof res.data==="string"?res.data:"")||u;
        lpSuccess(String(nama).toUpperCase());
      } else if(res && res.ok===false){ err.textContent=res.msg||"Login gagal."; }
      else { err.textContent="Login gagal."; }
    })
    .catch(function(){ err.textContent="Koneksi gagal. Coba lagi."; });
}
function lpToggleSide(){
  var s=document.getElementById("lp-side"), m=document.getElementById("lp-side-mask");
  var open=s.classList.toggle("open");
  m.style.display=open?"block":"none";
}
function lpLogout(){
  localStorage.removeItem("EUP_LOGGED");
  localStorage.removeItem("EUP_USER");
  location.reload();
}
function spStartMenu(){ if(window.init_StickerPaking) window.init_StickerPaking(); }
(function(){
  var logged=localStorage.getItem("EUP_LOGGED")==="1";
  var n=localStorage.getItem("EUP_USER")||"";
  if(logged && n){ spSetUser(n); document.getElementById("sp-login").classList.add("hidden"); window.__SP_AUTO_START=true; }
  else { window.__SP_AUTO_START=false; }
})();

/* SCANNER GLOBAL v5.1 (persis index/buku/dimensi) */
var scanStream=null, scanTimer=null, scanSent=false, scanCv=null;
var SCAN_OUT=700, SCAN_CROP=0.74, SCAN_MS=250;
function scEl(id){ return document.getElementById(id); }
function startScanner(deviceId){
  stopScanner(true); scanSent=false;
  if(!navigator.mediaDevices){ alert("Kamera tidak didukung."); return; }
  var vid={width:{ideal:1280},height:{ideal:720}};
  if(deviceId) vid.deviceId={exact:deviceId}; else vid.facingMode="environment";
  navigator.mediaDevices.getUserMedia({video:vid,audio:false}).then(function(stream){
    scanStream=stream; var v=scEl("sc-video"); v.srcObject=stream; v.play();
    if(!scanCv) scanCv=document.createElement("canvas");
    scEl("sc-modal").classList.add("show");
    scanTimer=setInterval(scanTick,SCAN_MS);
  }).catch(function(e){ alert("Gagal buka kamera: "+e.message); });
}
function stopScanner(keepModal){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  if(scanStream){ scanStream.getTracks().forEach(function(t){ t.stop(); }); scanStream=null; }
  var v=scEl("sc-video"); if(v) v.srcObject=null;
  if(!keepModal) scEl("sc-modal").classList.remove("show");
}
function scanTick(){
  if(scanSent||!scanStream||typeof jsQR==="undefined") return;
  var v=scEl("sc-video"); if(!v.videoWidth||v.readyState<2) return;
  var side=Math.floor(Math.min(v.videoWidth,v.videoHeight)*SCAN_CROP);
  var ox=Math.floor((v.videoWidth-side)/2), oy=Math.floor((v.videoHeight-side)/2);
  scanCv.width=SCAN_OUT; scanCv.height=SCAN_OUT;
  var cx=scanCv.getContext("2d",{willReadFrequently:true});
  cx.drawImage(v, ox,oy,side,side, 0,0,SCAN_OUT,SCAN_OUT);
  var code=jsQR(cx.getImageData(0,0,SCAN_OUT,SCAN_OUT).data,SCAN_OUT,SCAN_OUT);
  if(code&&code.data){ scanSent=true; window.dispatchEvent(new CustomEvent("DMS_KPC_SCAN",{detail:{text:code.data}})); setTimeout(stopScanner,300); }
}
window.__SCANNER__={ start:startScanner, stop:stopScanner };
</script>

<script>
var SP_API=(typeof API_URL!=="undefined"&&API_URL)?API_URL:"https://script.google.com/macros/s/AKfycbwcKOfb6y5USg7k5oh8oI9jE4T91R8TjBjv6wyuzarEQwk-l95j_RPp9uHsBaD2TbWnbw/exec";
var spMESIN=null, spLIST=[], spBUF=[], spPROD_LIST=[], spDEL_ID=null, spTOAST_T=null;
var spTAHAP=null, spBULAN=null, spTANGGAL=null, spBULAN_LIST=[], spTGL_LIST=[];
var spMODE='bikin', spEDIT_PAK=null, spEDIT_TRACKED=false, spEDIT_RETRO=false, spEDIT_RINCI=false, spBACK_FN=null;
var spROWEDIT=-1;
var spACTIVE_BUF=null, spACTIVE_RENDER=null;
var spCACHE={mesin:null,bulan:{},tanggal:{},data:{},produk:{},batang:{},sticker:{}};
var spSC_STREAM=null, spSC_TIMER=null, spSC_SENT=false, spSC_CV=null, spSC_LSN=false;
var SP_PANDUAN="PDF tersimpan di Download. Buka app Print Label -> Import / PDF -> pilih file -> atur ukuran label -> CETAK.";
var SP_LS="EUP_SP_";

function spEl(id){ return document.getElementById(id); }
function spEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function spAtt(s){ return spEsc(s).replace(/'/g,"&#39;"); }
function spFmtD(iso){ var p=String(iso||"").split("-"); return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):String(iso||""); }
function spToday(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function spTarget(m){ var s=String(m||"").toUpperCase(); if(s.indexOf("RENG")>=0) return 300; if(s.indexOf("TRUSS")>=0) return 160; return 0; }
function spProdTipe(m){ return (String(m||"").toUpperCase().indexOf("RENG")>=0)?"RENG":"TRUSS"; }
function spUserNama(){ return (typeof USER!=="undefined"&&USER&&USER.nama)?USER.nama:"-"; }
function spHariJs(iso){ var N=["MINGGU","SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU"]; var p=String(iso||"").split("-"); if(p.length<3) return ""; var dt=new Date(+p[0],(+p[1])-1,+p[2]); return N[dt.getDay()]||""; }
function spBulanNow(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2); }
function spBulanLabel(b){ var MON=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"]; var p=String(b||"").split("-"); if(p.length<2) return String(b||""); return (MON[(+p[1])-1]||p[1])+" "+p[0]; }
function spNoop(){}
function spArr(res){ return Array.isArray(res)?res:((res&&res.data)||[]); }
function spIsRinci(){ return (spMODE==='edit' && spEDIT_RINCI); }
function spLsSet(k,v){ try{ localStorage.setItem(SP_LS+k, JSON.stringify(v)); }catch(e){} }
function spLsGet(k){ try{ var r=localStorage.getItem(SP_LS+k); if(!r) return null; return JSON.parse(r); }catch(e){ return null; } }

function spRun(fn,args,cb){
  args=args||[];
  if(typeof google!=="undefined"&&google.script&&google.script.run){
    try{ google.script.run.withSuccessHandler(function(r){cb(r);}).withFailureHandler(function(e){cb({__err:"Gagal server: "+(e&&e.message?e.message:e)});})[fn].apply(null,args); return; }
    catch(e){ cb({__err:"Gagal panggil: "+(e&&e.message?e.message:e)}); return; }
  }
  fetch(SP_API,{method:"POST",body:JSON.stringify({action:fn,args:args,__direct:1})})
    .then(function(r){return r.json();})
    .then(function(res){ if(res&&res.ok===true&&res.data!==undefined){cb(res.data);} else {cb(res);} })
    .catch(function(e){ cb({__err:"Gagal koneksi: "+e.message}); });
}
function spToast(msg,type){
  var t=spEl("sp-toast"); if(!t) return;
  t.textContent=msg; t.className="sp-toast "+(type==="err"?"sp-toast-err":"sp-toast-ok");
  if(spTOAST_T){ clearTimeout(spTOAST_T); spTOAST_T=null; }
  spTOAST_T=setTimeout(function(){ t.className="sp-toast hidden"; spTOAST_T=null; }, type==="err"?4000:2400);
}
function spGetMesinCached(cb){
  if(spCACHE.mesin){ cb(spCACHE.mesin); return; }
  var p=spLsGet("mesin");
  if(p){ spCACHE.mesin=p; cb(p); return; }
  spRun("getMesin",[],function(res){
    var a=spArr(res);
    spCACHE.mesin=a;
    spLsSet("mesin",a);
    cb(a);
  });
}
function spGetBulanCached(mesin,cb){ var k=mesin; if(spCACHE.bulan[k]){ cb(spCACHE.bulan[k]); return; } spRun("spGetBulanPacking",[mesin],function(res){ var a=spArr(res); spCACHE.bulan[k]=a; cb(a); }); }
function spGetTanggalCached(mesin,bulan,cb){ var k=mesin+"|"+bulan; if(spCACHE.tanggal[k]){ cb(spCACHE.tanggal[k]); return; } spRun("spGetTanggalPacking",[mesin,bulan],function(res){ var a=spArr(res); spCACHE.tanggal[k]=a; cb(a); }); }
function spGetDataCached(mesin,tanggal,cb){ var k=mesin+"|"+tanggal; if(spCACHE.data[k]){ cb(spCACHE.data[k]); return; } spRun("spGetListPacking",[mesin,tanggal],function(res){ var a=spArr(res); spCACHE.data[k]=a; cb(a); }); }
function spGetProdukCached(tipe,cb){ var k=tipe; if(spCACHE.produk[k]){ cb(spCACHE.produk[k]); return; } spRun("getProduk",[tipe],function(res){ var a=spArr(res); spCACHE.produk[k]=a; cb(a); }); }
function spResolveBatangCached(mesin,idPak,cb){
  var k=mesin+"|"+idPak;
  if(spCACHE.batang[k]){ cb(spCACHE.batang[k]); return; }
  spRun("spGetBatangPak",[mesin,idPak],function(res){
    if(res && res.tracked && res.baris && res.baris.length){
      var o={mode:"tracked",baris:res.baris}; spCACHE.batang[k]=o; cb(o); return;
    }
    if(res && res.perkiraan && res.baris && res.baris.length){
      var o2={mode:"retro",baris:res.baris}; spCACHE.batang[k]=o2; cb(o2); return;
    }
    spRun("spGetBatangRetro",[mesin,idPak],function(res2){
      var rr=(res2&&res2.rows)||[]; var uniq=!!(res2&&res2.unique);
      var o3=(uniq&&rr.length)?{mode:"retro",baris:rr}:{mode:"rinci",baris:[]};
      spCACHE.batang[k]=o3; cb(o3);
    });
  });
}
function spInvalidateMesin(mesin){
  delete spCACHE.bulan[mesin];
  var k;
  for(k in spCACHE.tanggal){ if(k.indexOf(mesin+"|")===0) delete spCACHE.tanggal[k]; }
  for(k in spCACHE.data){ if(k.indexOf(mesin+"|")===0) delete spCACHE.data[k]; }
  for(k in spCACHE.batang){ if(k.indexOf(mesin+"|")===0) delete spCACHE.batang[k]; }
  for(k in spCACHE.sticker){ if(k.indexOf(mesin+"|")===0) delete spCACHE.sticker[k]; }
}
function spMakeQr(text,px){
  if(typeof qrcode==="undefined"||!text) return null;
  try{
    var qr=qrcode(0,"M"); qr.addData(String(text)); qr.make();
    var n=qr.getModuleCount(),q=2,tot=n+q*2,sc=Math.max(1,Math.floor(px/tot));
    var cv=document.createElement("canvas"); cv.width=tot*sc; cv.height=tot*sc;
    var x=cv.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height); x.fillStyle="#000";
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)) x.fillRect((c+q)*sc,(r+q)*sc,sc,sc); } }
    return cv;
  }catch(e){ return null; }
}
function spQrSrc(text,px){
  var cv=spMakeQr(text,px);
  if(cv){ try{ return cv.toDataURL(); }catch(e){} }
  return "https://api.qrserver.com/v1/create-qr-code/?size="+px+"x"+px+"&data="+encodeURIComponent(String(text||""));
}
function spShow(v){
  ["sp-view-mesin","sp-view-list","sp-view-form"].forEach(function(x){ spEl(x).style.display="none"; });
  spEl(v).style.display="block";
}
function spBoot(){
  spEl("sp-msg").innerHTML="";
  spEl("sp-mesin-grid").innerHTML='<div class="sp-card" style="text-align:center;color:#888;padding:20px">Memuat daftar mesin…</div>';
  spGetMesinCached(function(list){ spRenderMesin(list); });
}
window.init_StickerPaking=spBoot;
function spRenderMesin(list){
  if(!list||!list.length){ spEl("sp-mesin-grid").innerHTML='<div class="sp-card">Master mesin kosong.</div>'; return; }
  spEl("sp-mesin-grid").innerHTML=list.map(function(m){
    return '<div class="sp-mesin-card" onclick="spOpenList(\''+spAtt(m)+'\')">'+spEsc(m)+'</div>';
  }).join("");
}

function spOpenList(m){
  spMESIN=m; spBULAN=spBulanNow(); spTANGGAL=spToday(); spBULAN_LIST=[]; spTGL_LIST=[]; spLIST=[];
  spGetProdukCached(spProdTipe(m), spNoop);
  spGetBulanCached(m, spNoop);
  spGoData();
}
function spGoMesin(){ spMESIN=null; spTAHAP=null; spBULAN=null; spTANGGAL=null; spBULAN_LIST=[]; spTGL_LIST=[]; spLIST=[]; spShow("sp-view-mesin"); spBoot(); }
function spCrumbBack(){ if(spTAHAP==="data"){ spGoMesin(); } else if(spTAHAP==="tanggal"){ spGoBulan(); } else { spGoMesin(); } }
function spCrumb(txt){ return '<div class="sp-crumb"><button onclick="spCrumbBack()">&#9664;</button><span class="ttl">'+txt+'</span></div>'; }
function spGoBulan(){
  spTAHAP="bulan"; spShow("sp-view-list");
  var box=spEl("sp-list-box");
  box.innerHTML='<div class="sp-crumb"><button onclick="spCrumbBack()">&#9664;</button><span class="ttl">STICKER PACKING · '+spEsc(spMESIN)+'</span></div><div class="sp-card">Memuat bulan…</div>';
  spGetBulanCached(spMESIN,function(arr){ spBULAN_LIST=arr; spRenderBulan(); });
}
function spRenderBulan(){
  var box=spEl("sp-list-box");
  var crumb='<div class="sp-crumb"><button onclick="spCrumbBack()">&#9664;</button><span class="ttl">STICKER PACKING · '+spEsc(spMESIN)+'</span><button class="sp-btn-md sp-btn-primary-md" onclick="spOpenForm()">+ADD</button></div>';
  if(!spBULAN_LIST.length){ box.innerHTML=crumb+'<div class="sp-card" style="text-align:center;color:#888">Belum ada packing di mesin ini.<br>Pencet <b>+ADD</b> untuk mulai, atau <b>‹</b> untuk ganti mesin.</div>'; return; }
  var rows=spBULAN_LIST.map(function(b){
    return '<div class="sp-month-row" onclick="spPickBulan(\''+spAtt(b.bulan)+'\')">'+spEsc(spBulanLabel(b.bulan))+'</div>';
  }).join("");
  box.innerHTML=crumb+rows;
  spBULAN_LIST.slice(0,6).forEach(function(b){ spGetTanggalCached(spMESIN,b.bulan,spNoop); });
}
function spPickBulan(b){ spBULAN=b; spTANGGAL=null; spTGL_LIST=[]; spLIST=[]; spGoTanggal(); }
function spGoTanggal(){
  spTAHAP="tanggal"; spShow("sp-view-list");
  var box=spEl("sp-list-box");
  box.innerHTML='<div class="sp-crumb"><button onclick="spCrumbBack()">&#9664;</button><span class="ttl">'+spEsc(spMESIN)+' · PILIH TANGGAL</span></div><div class="sp-card">Memuat tanggal…</div>';
  spGetTanggalCached(spMESIN,spBULAN,function(arr){ spTGL_LIST=arr; spRenderTanggal(); });
}
function spRenderTanggal(){
  var box=spEl("sp-list-box");
  var crumb='<div class="sp-crumb"><button onclick="spCrumbBack()">&#9664;</button><span class="ttl">'+spEsc(spMESIN)+' · '+spEsc(spBulanLabel(spBULAN))+'</span><button class="sp-btn-md sp-btn-primary-md" onclick="spOpenForm()">+ADD</button></div>';
  if(!spTGL_LIST.length){ box.innerHTML=crumb+'<div class="sp-card" style="text-align:center;color:#888">Belum ada packing di '+spEsc(spBulanLabel(spBULAN))+'.<br>Pencet <b>+ADD</b> untuk mulai.</div>'; return; }
  var rows=spTGL_LIST.map(function(t){
    return '<div class="sp-date-row" onclick="spPickTanggal(\''+spAtt(t.tanggal)+'\')">'+
      '<span class="d">'+spEsc(spFmtD(t.tanggal))+'</span>'+
      '<span class="sp-date-badge">Total: '+spEsc((t.totalBatang||0).toLocaleString("id-ID"))+'</span>'+
      '<span class="chev"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#1155cc" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg></span>'+
    '</div>';
  }).join("");
  box.innerHTML=crumb+rows;
  spTGL_LIST.slice(0,12).forEach(function(t){ spGetDataCached(spMESIN,t.tanggal,spNoop); });
}
function spPickTanggal(t){ spBULAN=String(t).slice(0,7); spTANGGAL=t; spLIST=[]; spGoData(); }
function spCalClick(e){
  var el=e.target;
  try{ if(el && typeof el.showPicker==="function"){ el.showPicker(); } }catch(err){}
}
function spCalPick(v){
  if(!v) return;
  spPickTanggal(v);
}
function spGoData(){
  spTAHAP="data"; spShow("sp-view-list");
  var box=spEl("sp-list-box");
  box.innerHTML='<div class="sp-crumb"><button onclick="spCrumbBack()">&#9664;</button><span class="ttl">'+spEsc(spMESIN)+'</span></div><div class="sp-card">Memuat data…</div>';
  spGetDataCached(spMESIN,spTANGGAL,function(arr){ spLIST=arr; spRenderData(); });
}
function spRenderData(){
  var box=spEl("sp-list-box");
  var tot=0; for(var i=0;i<spLIST.length;i++){ tot+=(parseInt(spLIST[i].jumlah,10)||0); }

function spFetchNextNor(tanggal, cb){

function spOpenForm(){
  spMODE='bikin'; spEDIT_PAK=null; spEDIT_TRACKED=false; spEDIT_RETRO=false; spEDIT_RINCI=false; spROWEDIT=-1;
  spBUF=[]; spACTIVE_BUF=spBUF; spACTIVE_RENDER=spRenderBuf;
  if(spTAHAP==="data") spBACK_FN=spGoData;
  else if(spTAHAP==="tanggal") spBACK_FN=spGoTanggal;
  else spBACK_FN=spGoBulan;
  spShow("sp-view-form");
  spGetProdukCached(spProdTipe(spMESIN),function(list){ spPROD_LIST=list; spRenderForm(); });
}
function spOpenEdit(idx){
  var p=spLIST[idx]; if(!p){ spToast("Data tidak ada","err"); return; }
  spMODE='edit'; spEDIT_PAK=p; spEDIT_TRACKED=false; spEDIT_RETRO=false; spEDIT_RINCI=false; spROWEDIT=-1;
  spBUF=[]; spACTIVE_BUF=spBUF; spACTIVE_RENDER=spRenderBuf; spBACK_FN=spGoData;
  spShow("sp-view-form");
  var box=spEl("sp-form-box"); box.innerHTML='<div class="sp-card">Memuat data pak…</div>';
  spGetProdukCached(spProdTipe(spMESIN),function(list){
    spPROD_LIST=list;
    spResolveBatangCached(spMESIN,p.id,function(o){
      if(o.mode==="tracked"){
        spEDIT_TRACKED=true; spEDIT_RETRO=false; spEDIT_RINCI=false;
        spBUF=o.baris.map(function(x){ return {kpc:String(x.kpc||""), jumlah:(parseInt(x.jumlah,10)||0)}; });
      } else if(o.mode==="retro"){
        spEDIT_TRACKED=false; spEDIT_RETRO=true; spEDIT_RINCI=false;
        spBUF=o.baris.map(function(x){ return {kpc:String(x.kpc||""), jumlah:(parseInt(x.jumlah,10)||0)}; });
      } else {
        spEDIT_TRACKED=false; spEDIT_RETRO=false; spEDIT_RINCI=true;
        var T=(parseInt(p.jumlah,10)||0);
        spBUF = T>0 ? [{kpc:"", jumlah:T}] : [];
      }
      spACTIVE_BUF=spBUF; spRenderForm();
    });
  });
}

  var crumb='<div class="sp-crumb"><button onclick="spBackToList()">&#9664;</button><span class="ttl">'+(edit?('EDIT PAK · '+spEsc(spMESIN)+' · pack-'+spEsc(p.nor)):spEsc(spMESIN))+'</span></div>';

    tglField+
    '<div class="sp-frow"><label>OPERATOR</label><input readonly value="'+opVal+'"></div>'+
    '<div class="sp-frow"><label>MESIN</label><input readonly value="'+spAtt(msVal)+'"></div>'+
    '<div class="sp-frow"><label>PRODUK</label><select id="sp-prod">'+opts+'</select></div>'+
    '</div>';
  var hint='';
  if(rinci) hint='<div class="sp-hint-retro"><b>ISI KPC PAK INI.</b> JUMLAH sudah terisi otomatis (= total pak '+spEsc(p.jumlah)+') — kamu <b>tidak perlu ketik angka</b>. Klik <b>pensil</b> atau <b>+ADD</b> untuk isi nomor KPC (scan). TOTAL harus = target (hijau) baru bisa SIMPAN. Mau ubah produk saja? hapus semua baris lalu SIMPAN.</div>';
  else if(edit && spEDIT_RETRO) hint='<div class="sp-hint-retro">KPC diambil dari log INPUT tanggal ini (pak tunggal). Menyimpan akan <b>mengunci penanda</b> (pak jadi terinci permanen).</div>';
  var bufCard='<div class="sp-card">'+
    '<div class="sp-buf-hd" style="border:none;padding:0 0 8px"><span>INPUT DATA</span></div>'+
    '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table class="sp-scan-tbl"><thead><tr><th>NO</th><th>KPC</th><th>JUMLAH</th><th>TOTAL</th><th>AKSI</th></tr></thead><tbody id="sp-scan-body"></tbody></table></div>'+
    '</div>';
  var foot='<div class="sp-foot"><button class="sp-outline" onclick="spBackToList()">CANCEL</button><button class="sp-primary" id="sp-simpan" onclick="spSimpan()">'+(edit?'SIMPAN UBAH':'SIMPAN')+'</button><button class="sp-outline" id="sp-tambah" onclick="spScModalOpen()">+ADD</button></div>';
  box.innerHTML=crumb+hint+header+bufCard+foot;
  spRenderBuf();
  if(!edit){
    spFetchNextNor(iso, function(nor){
      var el = spEl("sp-nor");
      if(el) el.value = nor;
    });

}
function spNormDateJs(iso){ var p=String(iso||"").split("-"); if(p.length<3) return spToday(); return iso; }
function spRefreshHari(){
  var v=spEl("sp-tgl").value;
  spEl("sp-hari").value=spHariJs(v);
  if(spMODE==='bikin'){
    spFetchNextNor(v, function(nor){
      var el = spEl("sp-nor");
      if(el) el.value = nor;
    });
  }
}
function spBackToList(){ if(spBACK_FN) spBACK_FN(); else spGoTanggal(); }
function spBufTotal(){ var t=0; for(var i=0;i<spBUF.length;i++){ t+=(parseInt(spBUF[i].jumlah,10)||0); } return t; }
function spRinciTarget(){ return spIsRinci()? (parseInt((spEDIT_PAK&&spEDIT_PAK.jumlah),10)||0) : 0; }
function spRinciReady(){
  if(!spIsRinci()) return true;
  if(spBUF.length===0) return true;
  var tgt=spRinciTarget();
  for(var i=0;i<spBUF.length;i++){ if(String(spBUF[i].kpc||"").trim()==="") return false; }
  return spBufTotal()===tgt;
}
function spRenderBuf(){
  var tb=spEl("sp-scan-body"); if(!tb) return;
  var tgt=spRinciTarget();
  if(!spBUF.length){
    var emptyMsg = spIsRinci()
      ? ('Belum ada baris. <b>TARGET pak ini = '+tgt+' batang.</b> Pencet <b>+ADD</b> untuk isi KPC+jumlah (total harus = '+tgt+'). <span style="color:#888">Kosong = hanya ubah produk.</span>')
      : 'Belum ada scan. Pencet tombol +ADD di bawah.';
    tb.innerHTML='<tr><td colspan="5" style="padding:14px;text-align:center;color:#888">'+emptyMsg+'</td></tr>';
  } else {
    var n=spBUF.length, total=spBufTotal(), h="";
    for(var i=0;i<n;i++){
      var emptyKpc = String(spBUF[i].kpc||"").trim()==="";
      h+='<tr>';
      h+='<td>'+(i+1)+'</td>';
      if(emptyKpc){ h+='<td class="k ph">(kosong — klik pensil / scan)</td>'; }
      else { h+='<td class="k">'+spEsc(spBUF[i].kpc)+'</td>'; }
      h+='<td>'+spEsc(spBUF[i].jumlah)+'</td>';
      if(i===0){
        var cellTxt = tgt>0 ? (total+' / '+tgt) : total.toLocaleString("id-ID");
        var cls = tgt>0 ? (total===tgt?"tot ok":"tot warn") : "tot";
        h+='<td class="'+cls+'" id="sp-scan-tot" rowspan="'+n+'">'+cellTxt+'</td>';
      }
      h+='<td><span class="sp-row-act">'+
        '<button class="sp-row-btn" title="Edit baris (modal scan)" onclick="spOpenRowEdit('+i+')"><svg viewBox="0 0 24 24"><path fill="#0F9488" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>'+
        '<button class="sp-row-btn" title="Hapus baris" onclick="spBufDel('+i+')"><svg viewBox="0 0 24 24"><path fill="#d32f2f" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>'+
      '</span></td>';
      h+='</tr>';
    }
    tb.innerHTML=h;
  }
  spUpdateCounter();
}
function spUpdateCounter(){
  var btn=spEl("sp-simpan");
  if(!btn) return;
  if(spIsRinci()){ btn.disabled = !spRinciReady(); }
  else { btn.disabled = (spBufTotal()<=0); }
}
function spRecalcTot(){ var el=spEl("sp-scan-tot"); if(el){ var tgt=spRinciTarget(); var t=spBufTotal(); el.textContent = tgt>0 ? (t+' / '+tgt) : t.toLocaleString("id-ID"); el.className = tgt>0 ? (t===tgt?"tot ok":"tot warn") : "tot"; } spUpdateCounter(); }
function spBufDel(i){ spBUF.splice(i,1); spRenderBuf(); }
function spOpenRowEdit(i){
  if(!spACTIVE_BUF || !spACTIVE_BUF[i]) return;
  spROWEDIT=i;
  spEl("sp-m-kpc").value=spACTIVE_BUF[i].kpc||"";
  spEl("sp-m-jml").value=spACTIVE_BUF[i].jumlah||"";
  spEl("sp-scan-hd").textContent="UBAH KPC · BARIS "+(i+1);
  spEl("sp-scan-ok").textContent="SIMPAN";
  spEl("sp-scan-modal").classList.remove("hidden");
  setTimeout(function(){ spEl("sp-m-kpc").focus(); },60);
}
function spScModalOpen(){
  spROWEDIT=-1;
  spEl("sp-m-kpc").value=""; spEl("sp-m-jml").value="";
  spEl("sp-scan-hd").textContent="ADD KPC";
  spEl("sp-scan-ok").textContent="+ADD";
  spEl("sp-scan-modal").classList.remove("hidden");
  setTimeout(function(){ spEl("sp-m-kpc").focus(); },60);
}
function spScModalClose(){ spEl("sp-scan-modal").classList.add("hidden"); spROWEDIT=-1; }
function spScModalConfirm(){
  var kpc=(spEl("sp-m-kpc").value||"").trim();
  var jml=parseInt(spEl("sp-m-jml").value,10)||0;
  if(!kpc){ spToast("Scan / ketik KPC batang dulu","err"); return; }
  if(jml<=0){ spToast("Isi jumlah batang (>0)","err"); return; }
  if(!spACTIVE_BUF){ spToast("Tidak ada form aktif","err"); return; }
  if(spROWEDIT>=0 && spACTIVE_BUF[spROWEDIT]){ spACTIVE_BUF[spROWEDIT]={kpc:kpc,jumlah:jml}; }
  else { spACTIVE_BUF.push({kpc:kpc,jumlah:jml}); }
  spScModalClose();
  if(spACTIVE_RENDER) spACTIVE_RENDER();
}
function spSimpan(){
  var edit=(spMODE==='edit'), prod=spEl("sp-prod").value||"";
  var btn=spEl("sp-simpan");
  if(edit){
    if(spIsRinci()){
      if(btn){ btn.disabled=true; btn.textContent="MENYIMPAN…"; }
      if(spBUF.length===0){
        spRun("spUpdatePak",[spMESIN,spEDIT_PAK.id,{produk:prod,batang:[]}],function(res){
          if(btn){ btn.disabled=false; btn.textContent="SIMPAN UBAH"; }
          if(res&&res.ok){ spInvalidateMesin(spMESIN); spToast("DATA TERSIMPAN","ok");
            spMODE='bikin'; spEDIT_PAK=null; spEDIT_TRACKED=false; spEDIT_RETRO=false; spEDIT_RINCI=false; spBUF=[];
            setTimeout(spGoData,700);
          } else { spToast("Gagal ubah: "+((res&&(res.msg||res.__err||res.__directErr))||"?"),"err"); }
        });
        return;
      }
      var tgt=spRinciTarget();
      for(var ci=0;ci<spBUF.length;ci++){ if(String(spBUF[ci].kpc||"").trim()===""){ if(btn){btn.disabled=false;btn.textContent="SIMPAN UBAH";} spToast("Isi KPC semua baris dulu (klik pensil/scan)","err"); return; } }
      if(spBufTotal()!==tgt){ if(btn){btn.disabled=false;btn.textContent="SIMPAN UBAH";} spToast("TOTAL harus = "+tgt+" (target pak). Sesuaikan jumlah baris.","err"); return; }
      spRun("spRinciManualPak",[spMESIN,spEDIT_PAK.id,{produk:prod,batang:spBUF}],function(res){
        if(btn){ btn.disabled=false; btn.textContent="SIMPAN UBAH"; }
        if(res&&res.ok){ spInvalidateMesin(spMESIN); spToast("DATA TERSIMPAN","ok");
          spMODE='bikin'; spEDIT_PAK=null; spEDIT_TRACKED=false; spEDIT_RETRO=false; spEDIT_RINCI=false; spBUF=[];
          setTimeout(spGoData,700);
        } else { spToast("Gagal simpan KPC: "+((res&&(res.msg||res.__err||res.__directErr))||"?"),"err"); }
      });
      return;
    }
    var tot=spBufTotal(); if(tot<=0){ spToast("Semua batang terhapus — kalau mau kosong, hapus pak dari list","err"); return; }
    if(btn){ btn.disabled=true; btn.textContent="MENYIMPAN…"; }
    if(spEDIT_RETRO){
      spRun("spUpdatePakRetro",[spMESIN,spEDIT_PAK.id,{produk:prod,batang:spBUF}],function(res){
        if(btn){ btn.disabled=false; btn.textContent="SIMPAN UBAH"; }
        if(res&&res.ok){ spInvalidateMesin(spMESIN); spToast("DATA TERSIMPAN","ok");
          spMODE='bikin'; spEDIT_PAK=null; spEDIT_TRACKED=false; spEDIT_RETRO=false; spEDIT_RINCI=false; spBUF=[];
          setTimeout(spGoData,700);
        } else { spToast("Gagal ubah: "+((res&&(res.msg||res.__err||res.__directErr))||"?"),"err"); }
      });
    } else {
      var payload={produk:prod, batang:spBUF};
      spRun("spUpdatePak",[spMESIN,spEDIT_PAK.id,payload],function(res){
        if(btn){ btn.disabled=false; btn.textContent="SIMPAN UBAH"; }
        if(res&&res.ok){
          spInvalidateMesin(spMESIN);
          spToast("DATA TERSIMPAN","ok");
          spMODE='bikin'; spEDIT_PAK=null; spEDIT_TRACKED=false; spEDIT_RETRO=false; spEDIT_RINCI=false; spBUF=[];
          setTimeout(spGoData,700);
        }else{ spToast("Gagal ubah: "+((res&&(res.msg||res.__err||res.__directErr))||"?"),"err"); }
      });
    }
  } else {
    var tot2=spBufTotal(); if(tot2<=0){ spToast("Belum ada scan","err"); return; }
    var tgl=spEl("sp-tgl").value||spToday();
    if(btn){ btn.disabled=true; btn.textContent="MENYIMPAN…"; }
    spRun("spSimpanPaket",[spMESIN,{tanggal:tgl,produk:prod,operator:spUserNama(),mesin:spMESIN,batang:spBUF}],function(res){
      if(res&&res.ok){
        spInvalidateMesin(spMESIN);
        spToast("DATA TERSIMPAN","ok");
        spBUF=[]; spBULAN=String(tgl).slice(0,7); spTANGGAL=tgl;
        setTimeout(spGoData,900);
      }else{
        if(btn){ btn.disabled=false; btn.textContent="SIMPAN"; }
        spUpdateCounter();
        spToast("Gagal: "+((res&&(res.msg||res.__err||res.__directErr))||"?"),"err");
      }
    });
  }
}

function spHapus(id,nor){
  spDEL_ID=id;
  spEl("sp-del-txt").innerHTML="Hapus <b>1 pak</b> <b>pack-"+spEsc(nor)+"</b>?<br><br>Baris di sheet <b>PACKING</b> hilang permanen. Log scan di sheet <b>INPUT</b> <b>tetap</b> tersimpan (jejak audit).";
  var ok=spEl("sp-del-ok"); ok.disabled=false; ok.textContent="HAPUS";
  spEl("sp-del-modal").classList.remove("hidden");
}
function spCloseHapus(){ spEl("sp-del-modal").classList.add("hidden"); spDEL_ID=null; }
function spDoHapus(){
  var ok=spEl("sp-del-ok"); if(ok.disabled||!spDEL_ID) return;
  ok.disabled=true; ok.textContent="MENGHAPUS…";
  var id=spDEL_ID;
  spRun("spHapusPak",[spMESIN,id],function(res){
    spCloseHapus();
    if(res&&res.ok){ spInvalidateMesin(spMESIN); spToast("PAK DIHAPUS.","ok"); spGoData(); }
    else{ spToast("Gagal hapus: "+((res&&(res.msg||res.__err||res.__directErr))||"?"),"err"); }
  });
}

function spPngToPdf(pngURL, wpx, hpx){
  if(!(window.jspdf && window.jspdf.jsPDF)) return null;
  try{
    var orient=(hpx>=wpx)?'p':'l';
    var pdf=new window.jspdf.jsPDF({ orientation:orient, unit:'px', format:[wpx,hpx], compress:true });
    pdf.addImage(pngURL, 'PNG', 0, 0, wpx, hpx);
    return pdf.output('dataurlstring');
  }catch(e){ return null; }
}

function spDownload(idx){
  var p=spLIST[idx]; if(!p){ spToast("Data tidak ada","err"); return; }
  var key=spMESIN+"|"+p.id;
  var st=spCACHE.sticker[key];
  if(st && st.pdf){ spTriggerDownload(st.pdf, st.name); return; }
  if(st && st.png){
    var pdf=spPngToPdf(st.png, st.w, st.h);
    if(pdf){ st.pdf=pdf; spTriggerDownload(pdf, st.name); return; }
    spTriggerDownload(st.png, String(st.name).replace(/\.pdf$/i,'.png')); spToast("Gagal bikin PDF (jsPDF belum siap?) — PNG diunduh sebagai cadangan.","err"); return;
  }
  var o=spCACHE.batang[key];
  if(o && o.baris){ spBuildAndCache(p,o.baris); return; }
  spResolveBatangCached(spMESIN,p.id,function(o2){ spBuildAndCache(p,(o2&&o2.baris)?o2.baris:[]); });
}
function spBuildAndCache(p, baris){
  var rincian=(baris||[]).map(function(x){ return {kpc:String(x.kpc||""), jumlah:(parseInt(x.jumlah,10)||0)}; })
                          .filter(function(x){ return x.kpc; });
  var cv;
  try{ cv=spDrawSticker(p,rincian); }catch(e){ spToast("Gagal gambar: "+((e&&e.message)||e),"err"); return; }
  var png;
  try{ png=cv.toDataURL("image/png"); }catch(e){ spToast("Gagal encode PNG","err"); return; }
  var wpx=cv.width, hpx=cv.height;
  var pdf=spPngToPdf(png,wpx,hpx);
  var name=(p.kpc && String(p.kpc).trim()) ? String(p.kpc).trim()+".pdf" : ((spMESIN||"PAK")+"_pack-"+(p.nor||"")+".pdf");
  spCACHE.sticker[spMESIN+"|"+p.id]={png:png,pdf:pdf,w:wpx,h:hpx,name:name};
  if(pdf){ spTriggerDownload(pdf,name); }
  else { spTriggerDownload(png, String(name).replace(/\.pdf$/i,'.png')); spToast("Gagal bikin PDF (jsPDF belum siap?) — PNG diunduh sebagai cadangan.","err"); }
}
function spTriggerDownload(url,name){
  try{
    var a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener"; a.style.display="none";
    document.body.appendChild(a);
    setTimeout(function(){
      try{ a.click(); }catch(e){}
      setTimeout(function(){ try{ a.remove(); }catch(e){} },2000);
    },60);
  }catch(e){ spToast("Gagal unduh","err"); }
}
function spEnsureSticker(p, baris){
  var key=spMESIN+"|"+p.id;
  var st=spCACHE.sticker[key]; if(st) return st;
  var rincian=(baris||[]).map(function(x){ return {kpc:String(x.kpc||""), jumlah:(parseInt(x.jumlah,10)||0)}; })
                          .filter(function(x){ return x.kpc; });
  var cv;
  try{ cv=spDrawSticker(p,rincian); }catch(e){ spToast("Gagal gambar: "+((e&&e.message)||e),"err"); return null; }
  var png;
  try{ png=cv.toDataURL("image/png"); }catch(e){ spToast("Gagal encode PNG","err"); return null; }
  var wpx=cv.width, hpx=cv.height;
  var pdf=spPngToPdf(png,wpx,hpx);
  var name=(p.kpc && String(p.kpc).trim()) ? String(p.kpc).trim()+".pdf" : ((spMESIN||"PAK")+"_pack-"+(p.nor||"")+".pdf");
  var obj={png:png,pdf:pdf,w:wpx,h:hpx,name:name}; spCACHE.sticker[key]=obj; return obj;
}
function spShareStiker(idx){
  var p=spLIST[idx]; if(!p){ spToast("Data tidak ada","err"); return; }
  var key=spMESIN+"|"+p.id;
  var st=spCACHE.sticker[key];
  if(st){ spShareReady(st); return; }
  var o=spCACHE.batang[key];
  if(o && o.baris){ var s=spEnsureSticker(p,o.baris); if(s) spShareReady(s); return; }
  spToast("Menyiapkan stiker PDF…","ok");
  spResolveBatangCached(spMESIN,p.id,function(o2){ var s=spEnsureSticker(p,(o2&&o2.baris)?o2.baris:[]); if(s) spShareReady(s); });
}
function spShareReady(st){
  if(!st) return;
  if(st.pdf){ spDoShare(st.pdf, st.name, "application/pdf"); return; }
  if(st.png){
    var pdf=spPngToPdf(st.png, st.w, st.h);
    if(pdf){ st.pdf=pdf; spDoShare(pdf, st.name, "application/pdf"); return; }
    spTriggerDownload(st.png, String(st.name).replace(/\.pdf$/i,'.png')); spToast("Gagal bikin PDF — PNG diunduh sebagai cadangan.","err"); return;
  }
}
function spDataUrlToFile(url,name,mime){
  try{
    var parts=String(url).split(","); if(parts.length<2) return null;
    var hdr=parts[0], semi=hdr.indexOf(";");
    var derived=(semi>0)? hdr.slice(5,semi) : hdr.slice(5); if(!derived) derived="application/pdf";
    var useMime=(mime && String(mime).indexOf("/")>0)? mime : derived;
    var bin=atob(parts[1]); var len=bin.length, arr=new Uint8Array(len);
    for(var i=0;i<len;i++){ arr[i]=bin.charCodeAt(i); }
    var blob=new Blob([arr],{type:useMime});
    return new File([blob],name,{type:useMime});
  }catch(e){ return null; }
}
function spDoShare(url,name,mime){
  if(!(navigator.share && navigator.canShare)){
    spTriggerDownload(url,name);
    spToast("Bagikan tidak didukung browser ini — PDF diunduh. Buka app Print Label -> Import/PDF -> pilih file.","ok"); return;
  }
  var file=spDataUrlToFile(url,name,mime||"application/pdf");
  if(!file){ spTriggerDownload(url,name); spToast("Gagal siapkan file — diunduh saja.","err"); return; }
  if(!navigator.canShare({files:[file]})){
    spTriggerDownload(url,name);
    spToast("Browser tidak bisa bagikan PDF ke app — PDF diunduh. Buka app Print Label -> Import/PDF -> pilih file.","ok"); return;
  }
  navigator.share({files:[file], title:name, text:"Stiker packing "+name}).then(function(){
  }).catch(function(err){
    if(err && err.name==="AbortError"){
      spToast("Batal? Kalau Print Label tidak muncul di daftar, pastikan app-nya set terima PDF. Pakai tombol UNDUH (PDF), lalu buka Print Label -> Import/PDF -> pilih file -> cetak.","ok");
      return;
    }
    spTriggerDownload(url,name); spToast("Bagikan gagal — PDF diunduh sebagai cadangan.","err");
  });
}

var SP_PRODUK_CODE_RENG={
  "TASO (MX) R32.45":"T28050L15009",
  "KASO (KXO) R32.40":"T28040L15007",
  "KASO (KXO) R32.45":"T28040L15006"
};
var SP_PRODUK_CODE_TRUSS={};
function spNormProd(s){ return String(s==null?"":s).toUpperCase().replace(/\s+/g," ").trim(); }
function spCodeForProduk(s,mesin){ var tipe=spProdTipe(mesin); var peta=(tipe==="TRUSS")?SP_PRODUK_CODE_TRUSS:SP_PRODUK_CODE_RENG; return peta[spNormProd(s)]||""; }
function spHeaderSuffix(mesin,produk){
  if(String(mesin||"").toUpperCase().indexOf("RENG")>=0) return " MX";
  var m=String(produk==null?"":produk).match(/\(([^)]+)\)/);
  return m?(" "+String(m[1]).trim()):"";
}

function spDrawSticker(p, rincian){
  rincian = rincian || [];
  var MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  function monDate(iso){ var q=String(iso||"").split("-"); if(q.length<3) return String(iso||""); return q[2]+" "+(MON[(+q[1])-1]||q[1])+" "+q[0]; }
  var W=760, M=30, CW=W-M*2, S=2;
  var fHead=30, fProd=26, fRinci=24, fQC=28, fName=24, fPlu=28;
  var rowH=38, pad=12, qrSize=260;
  var gapHP=46, gapBox=14, gapQC=42, gapQR=30, lineProd=fProd+6;
  var cv=document.createElement("canvas");
  var ctx=cv.getContext("2d");
  function wrap(text,font,maxW){
    ctx.font=font;
    var words=String(text==null?"":text).split(" "), lines=[], cur="";
    for(var i=0;i<words.length;i++){
      var t=cur?cur+" "+words[i]:words[i];
      if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=words[i]; }
      else cur=t;
    }
    if(cur) lines.push(cur);
    return lines.length?lines:[""];
  }
  var _code=spCodeForProduk(p.produk, String(p.mesin||spMESIN||""));
  var _prodFull=String(p.produk||"")+(_code?(" X 6000 MM ("+_code+")"):"");
  var prodLines=wrap(_prodFull,"bold "+fProd+"px Arial",CW);
  var yHeader=M+fHead;
  var yProdStart=yHeader+gapHP;
  var yAfterProd=yProdStart+(prodLines.length-1)*lineProd;
  var boxTop=yAfterProd+gapBox;
  var boxH=Math.max(rincian.length,1)*rowH + pad*2;
  var yQC=boxTop+boxH+gapQC;
  var qrTop=yQC+gapQR;
  var H=Math.max(qrTop+qrSize, qrTop+fName+10+fPlu+14) + M;
  cv.width=W*S; cv.height=H*S;
  ctx.setTransform(S,0,0,S,0,0);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.textBaseline="alphabetic";
  ctx.fillStyle="#000"; ctx.font="bold "+fHead+"px Arial"; ctx.textAlign="left";
  ctx.fillText(String(p.mesin||"")+spHeaderSuffix(p.mesin,p.produk)+" (pack-"+String(p.nor||"")+")", M, yHeader);
  ctx.textAlign="right";
  ctx.fillText(monDate(p.tanggal), W-M, yHeader);
  ctx.textAlign="left"; ctx.font="bold "+fProd+"px Arial";
  for(var q=0;q<prodLines.length;q++){ ctx.fillText(prodLines[q], M, yProdStart + q*lineProd); }
  ctx.strokeStyle="#000"; ctx.lineWidth=3; ctx.strokeRect(M, boxTop, CW, boxH);
  ctx.font="bold "+fRinci+"px Arial"; ctx.fillStyle="#000"; ctx.textAlign="left";
  var padL=14, padR=14, numRight=M+CW-padR;
  var spaceW=ctx.measureText(" ").width, eqW=ctx.measureText("=").width, maxNumW=0;
  for(var rr=0;rr<rincian.length;rr++){ var nw=ctx.measureText(String(rincian[rr].jumlah)).width; if(nw>maxNumW) maxNumW=nw; }
  var eqX=numRight-maxNumW-spaceW-eqW;
  for(var r=0;r<rincian.length;r++){
    var ry=boxTop+pad+fRinci + r*rowH;
    ctx.fillText(rincian[r].kpc, M+padL, ry);
    ctx.fillText("=", eqX, ry);
    var numStr=String(rincian[r].jumlah);
    ctx.fillText(numStr, numRight-ctx.measureText(numStr).width, ry);
  }
  ctx.font="bold "+fQC+"px Arial";
  ctx.fillStyle="#1b7e43"; ctx.textAlign="left";  ctx.fillText("QC Passed", M+10, yQC);
  ctx.fillStyle="#000";     ctx.textAlign="right"; ctx.fillText("Total: "+String(p.jumlah||0), W-M, yQC);
  var qrImg=spMakeQr(p.kpc, qrSize*S);
  if(qrImg){ try{ ctx.drawImage(qrImg, M+10, qrTop, qrSize, qrSize); }catch(e){} }
  else { ctx.strokeStyle="#999"; ctx.lineWidth=2; ctx.strokeRect(M+10,qrTop,qrSize,qrSize); ctx.fillStyle="#999"; ctx.font="bold 18px Arial"; ctx.textAlign="center"; ctx.fillText("QR", M+10+qrSize/2, qrTop+qrSize/2); }
  ctx.fillStyle="#000";
  ctx.font="bold "+fName+"px Arial"; ctx.textAlign="right";
  ctx.fillText(String(p.operator||"-")+" / "+String(p.operator||"-"), W-M, qrTop+fName+10);
  ctx.font="bold "+fPlu+"px Arial";
  ctx.fillText(String(p.kpc||"-"), W-M, qrTop+fName+10+fPlu+14);
  return cv;
}

function spScApply(text){ var f=spEl("sp-m-kpc"); if(f){ f.value=String(text||"").trim(); spEl("sp-m-jml").focus(); } }
function spScListener(){
  if(spSC_LSN) return; spSC_LSN=true;
  window.addEventListener("DMS_KPC_SCAN", function(ev){ if(ev&&ev.detail&&ev.detail.text){ spScApply(ev.detail.text); } });
}
function spScOpen(){
  if(window.__SCANNER__&&window.__SCANNER__.start){ spScListener(); window.__SCANNER__.start(); return; }
  spScStart();
}
function spScStart(deviceId){
  spScStop(true); spSC_SENT=false;
  if(!navigator.mediaDevices){ spToast("Kamera tidak didukung","err"); return; }
  spEl("sp-sc").classList.add("show");
  spLoadJsQR(function(){
    var vid={width:{ideal:1280},height:{ideal:720}};
    if(deviceId) vid.deviceId={exact:deviceId}; else vid.facingMode="environment";
    navigator.mediaDevices.getUserMedia({video:vid,audio:false}).then(function(stream){
      spSC_STREAM=stream; var v=spEl("sp-sc-v"); v.srcObject=stream; v.play();
      if(!spSC_CV) spSC_CV=document.createElement("canvas");
      spScCams(deviceId); spSC_TIMER=setInterval(spScTick,300);
    }).catch(function(e){ spToast("Kamera gagal: "+e.message,"err"); spScClose(); });
  });
}
function spScStop(keep){
  if(spSC_TIMER){ clearInterval(spSC_TIMER); spSC_TIMER=null; }
  if(spSC_STREAM){ spSC_STREAM.getTracks().forEach(function(t){t.stop();}); spSC_STREAM=null; }
  var v=spEl("sp-sc-v"); if(v) v.srcObject=null;
  if(!keep) spEl("sp-sc").classList.remove("show");
}
function spScClose(){ spScStop(false); }
function spScTick(){
  if(spSC_SENT||!spSC_STREAM||typeof jsQR==="undefined") return;
  var v=spEl("sp-sc-v"); if(!v.videoWidth||v.readyState<2) return;
  var side=Math.floor(Math.min(v.videoWidth,v.videoHeight)*0.74);
  var ox=Math.floor((v.videoWidth-side)/2), oy=Math.floor((v.videoHeight-side)/2);
  spSC_CV.width=700; spSC_CV.height=700;
  var cx=spSC_CV.getContext("2d",{willReadFrequently:true});
  cx.drawImage(v,ox,oy,side,side,0,0,700,700);
  var code=jsQR(cx.getImageData(0,0,700,700).data,700,700);
  if(code&&code.data){ spSC_SENT=true; var t=code.data; spScClose(); setTimeout(function(){ spScApply(t); },150); }
}
function spScCams(activeId){
  navigator.mediaDevices.enumerateDevices().then(function(devs){
    var sel=spEl("sp-sc-cams"); sel.innerHTML="";
    devs.filter(function(d){return d.kind==="videoinput";}).forEach(function(c,i){
      var o=document.createElement("option"); o.value=c.deviceId; o.textContent=c.label||("Cam "+(i+1));
      if(activeId===c.deviceId) o.selected=true; sel.appendChild(o);
    });
  }).catch(function(){});
}
function spScCam(){ spScStart(spEl("sp-sc-cams").value); }
function spLoadJsQR(cb){
  if(typeof jsQR!=="undefined"){ cb(); return; }
  var s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
  s.onload=cb; s.onerror=function(){ spToast("Gagal muat QR lib","err"); }; document.head.appendChild(s);
}
</script>
