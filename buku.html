<div id="fp-login" class="lp-login">
  <div class="lp-box">
    <div class="lp-title">EUP GUDANG TAIPA</div>
    <div class="lp-field">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      <input id="fp-login-user" placeholder="Username" autocomplete="username">
    </div>
    <div class="lp-field">
      <svg viewBox="0 0 24 24"><path d="M17 9V7c0-2.8-2.2-5-5-5S7 4.2 7 7v2c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2zM9 7c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V7z"/></svg>
      <input id="fp-login-pass" type="password" placeholder="Password" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')fpLogin()">
    </div>
    <button class="lp-btn" onclick="fpLogin()">LOGIN</button>
    <div id="lp-err" class="lp-err"></div>
  </div>
</div>

<script>
/* Identity hanya dari login (localStorage), BUKAN dari URL. */
var USER={nama:"-"};
/* OPSIONAL: kalau server TIDAK punya action "login", isi daftar ini utk login client-side.
   Format: {"USERNAME":"password"}  contoh: {"DEDI":"1234"} . Kosongkan {} kalau mau murni server. */
var LP_LOCAL_USERS={};
function fpSetUser(n){
  USER={nama:n};
  var t=document.getElementById("uname-tx"); if(t) t.textContent=n;
}
function lpLocalOk(u,p){ return LP_LOCAL_USERS && Object.prototype.hasOwnProperty.call(LP_LOCAL_USERS,u) && LP_LOCAL_USERS[u]===p; }
function lpSuccess(nama){
  localStorage.setItem("EUP_USER",nama);
  localStorage.setItem("EUP_LOGGED","1");
  fpSetUser(nama);
  document.getElementById("fp-login").classList.add("hidden");
  fpStartMenu();
}
function fpLogin(){
  var u=(document.getElementById("fp-login-user").value||"").trim().toUpperCase();
  var p=(document.getElementById("fp-login-pass").value||"");
  var err=document.getElementById("lp-err"); err.textContent="";
  if(!u||!p){ err.textContent="Isi username dan password."; return; }
  if(lpLocalOk(u,p)){ lpSuccess(u); return; }
  fetch(FP_API,{method:"POST",body:JSON.stringify({action:"login",user:u,pass:p})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok===true){
        var nama=(res.data&&(res.data.nama||res.data.user))||(typeof res.data==="string"?res.data:"")||u;
        lpSuccess(String(nama).toUpperCase());
      } else if(res && res.ok===false){ err.textContent=res.msg||"Login gagal."; }
      else { err.textContent="Login gagal."; }
    })
    .catch(function(){ err.textContent="Koneksi gagal. Coba lagi."; });
}
function lpToggleSide(){
  var s=document.getElementById("lp-side"), m=document.getElementById("lp-side-mask");
  var open=s.classList.toggle("open");
  m.style.display=open?"block":"none";
}
function lpLogout(){
  localStorage.removeItem("EUP_LOGGED");
  localStorage.removeItem("EUP_USER");
  location.reload();
}
function fpStartMenu(){ if(window.init_FormProduksi) window.init_FormProduksi(); }
(function(){
  var logged=localStorage.getItem("EUP_LOGGED")==="1";
  var n=localStorage.getItem("EUP_USER")||"";
  if(logged && n){ fpSetUser(n); document.getElementById("fp-login").classList.add("hidden"); window.__RP_AUTO_START=true; }
  else { window.__RP_AUTO_START=false; }
})();
</script>

<script>
var fpMESIN=null, fpKEY=null, fpROWS=[], fpSTRUCT=null, fpDATA={}, fpCOIL="";
var fpCARDS=[], fpEDIT=null, fpPRINTCARD=null, fpPRINTCOLS={};
var fpCACHE={}, fpLAST=null;
var fpGEN=0;
var fpDLCACHE={};
var fpDLBusy=false;
var FP_LS="EUP_FP_";
var FP_API=(typeof API_URL!=="undefined"&&API_URL)?API_URL:"https://script.google.com/macros/s/AKfycbwcKOfb6y5USg7k5oh8oI9jE4T91R8TjBjv6wyuzarEQwk-l95j_RPp9uHsBaD2TbWnbw/exec";
function fpIsGas(){ return !!(window.google && google.script && google.script.run); }
function fpUserNama(){ return (typeof USER!=="undefined" && USER && USER.nama)? USER.nama : "-"; }
function fpFmt(n){ return Number(n||0).toLocaleString("id-ID"); }
function fpEl(id){ return document.getElementById(id); }
function fpDispDate(key){ return String(key).split("-").reverse().join("/"); }
function fpEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fpToday(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function fpCrumbDetail(key, tot){
  var base="DATA PRODUKSI "+fpEsc(fpMESIN)+" <span class=\"fp-crumb-date\">"+fpEsc(fpDispDate(key))+"</span>";
  var has=(tot!==null && tot!==undefined);
  fpEl("fp-crumb").innerHTML = base + (has?' <span class="fp-tot-inline">· '+fpFmt(tot)+'</span>':'');
  var b=fpEl("fp-crumb-total");
  if(b){ b.style.display=""; b.textContent=fpFmt(has?tot:0); }
  fpUpdateCalLabel();
}
function fpHideTotalBadge(){ var b=fpEl("fp-crumb-total"); if(b){ b.style.display="none"; b.textContent=""; } }
function fpUpdateCalLabel(){
  var el=fpEl("fp-cal-label"); if(!el) return;
  var inDetail=!fpEl("fp-view-detail").classList.contains("hidden");
  el.textContent = inDetail ? fpDispDate(fpKEY||fpToday()) : "PILIH TANGGAL";
}

var fpToastTimer=null;
function fpToast(msg,type){
  var t=fpEl("fp-toast"); if(!t) return;
  t.textContent=msg;
  t.className="fp-toast "+(type==="err"?"fp-toast-err":"fp-toast-ok");
  if(fpToastTimer){ clearTimeout(fpToastTimer); fpToastTimer=null; }
  fpToastTimer=setTimeout(function(){ t.className="fp-toast hidden"; fpToastTimer=null; }, type==="err"?4000:2200);
}

function fpLsSet(k,v){ try{ localStorage.setItem(FP_LS+k, JSON.stringify({t:Date.now(),v:v})); }catch(e){} }
function fpLsGet(k){ try{ var r=localStorage.getItem(FP_LS+k); if(!r) return null; var o=JSON.parse(r); return o?o.v:null; }catch(e){ return null; } }
function fpLsClearMachine(m){
  try{
    var kill=[];
    for(var i=0;i<localStorage.length;i++){ var key=localStorage.key(i); if(!key) continue;
      if(key.indexOf(FP_LS+"tgl:"+m)===0 || key.indexOf(FP_LS+"det:"+m+":")===0) kill.push(key); }
    for(var j=0;j<kill.length;j++){ try{ localStorage.removeItem(kill[j]); }catch(e2){} }
  }catch(e){}
}
function fpCacheGet(k){
  var c=fpCACHE[k];
  if(c && (Date.now()-c.t)<=300000) return c.v;
  var p=fpLsGet(k);
  if(p){ fpCACHE[k]={t:Date.now(), v:p}; return p; }
  if(c) delete fpCACHE[k];
  return null;
}
function fpCacheIsFresh(k, maxAge){
  maxAge = maxAge || 60000;
  var c=fpCACHE[k];
  if(!c || !c.t) return false;
  return (Date.now() - c.t) < maxAge;
}
function fpCacheSet(k,v){ fpCACHE[k]={t:Date.now(),v:v}; fpLsSet(k,v); }
function fpCacheClearMachine(m){
  for(var k in fpCACHE){ if(k.indexOf("tgl:"+m)===0 || k.indexOf("det:"+m+":")===0){ delete fpCACHE[k]; } }
  for(var dk in fpDLCACHE){ if(dk.indexOf(m+"|")===0) delete fpDLCACHE[dk]; }
  fpLsClearMachine(m);
}

function fpShowErr(msg){ fpEl("fp-errtxt").textContent=msg; fpEl("fp-errbar").classList.remove("hidden"); }
function fpHideErr(){ fpEl("fp-errbar").classList.add("hidden"); }
function fpRetry(){ fpHideErr(); if(fpLAST){ fpRun(fpLAST.fn, fpLAST.arg, fpLAST.cb); } }
function fpBackup(){ window.open(FP_API, "_blank"); }

function fpRun(fn, arg, cb, _retry){
  fpLAST={fn:fn,arg:arg,cb:cb};
  if(fpIsGas()){
    google.script.run.withSuccessHandler(cb).withFailureHandler(function(e){ fpShowErr("Gagal: "+e.message); })[fn].apply(null,arg);
    return;
  }
  var params={action:fn};
  if(fn==="getProduk"){ params.tipe=arg[0]; }
  if(fn==="getNextNo"){ params.mesin=arg[0]; params.iso=arg[1]; }
  if(fn==="getListTanggal"){ params.mesin=arg[0]; params.userNama=arg[1]; }
  if(fn==="getDetail"){ params.mesin=arg[0]; params.key=arg[1]; params.userNama=arg[2]; }
  if(fn==="simpanPaket"){ params.p=arg[0]; params.userNama=arg[1]; }
  if(fn==="updatePaket"){ params.p=arg[0]; params.key=arg[1]; params.no=arg[2]; params.userNama=arg[3]; }
  if(fn==="hapusPaket"){ params.mesin=arg[0]; params.key=arg[1]; params.no=arg[2]; params.userNama=arg[3]; }
  fetch(FP_API,{method:"POST",body:JSON.stringify(params)})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok===false){ fpShowErr(res.msg||"Gagal memproses."); return; }
      if(res && res.ok===true && res.data!==undefined){ cb(res.data); return; }
      cb(res);
    })
    .catch(function(e){
      if(!_retry){ setTimeout(function(){ fpRun(fn,arg,cb,true); },700); return; }
      fpShowErr("Sambungan data terputus. Coba lagi atau buka cadangan.");
    });
}

function fpMakeQr(text, px){
  if(typeof qrcode==="undefined") return null;
  try{
    var qr=qrcode(0,"M"); qr.addData(text); qr.make();
    var n=qr.getModuleCount(), quiet=2, total=n+quiet*2;
    var scale=Math.max(1, Math.floor(px/total));
    var cv=document.createElement("canvas"); cv.width=total*scale; cv.height=total*scale;
    var x=cv.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height);
    x.fillStyle="#000";
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)) x.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale); } }
    return cv;
  }catch(e){ return null; }
}
function fpQrDrawable(c, px, cb){
  if(c._qrcv){ cb(c._qrcv); return; }
  var cv=fpMakeQr(c.kpc, px);
  if(cv){ c._qrcv=cv; cb(cv); return; }
  var im=new Image(); im.crossOrigin="anonymous";
  im.onload=function(){ cb(im); }; im.onerror=function(){ cb(null); };
  im.src="https://api.qrserver.com/v1/create-qr-code/?size="+px+"x"+px+"&data="+encodeURIComponent(c.kpc);
}

function fpShow(v){
  ["fp-view-mesin","fp-view-tanggal","fp-view-form","fp-view-detail"].forEach(function(x){ fpEl(x).classList.add("hidden"); });
  fpEl(v).classList.remove("hidden");
  var showBtn=((v==="fp-view-detail"||v==="fp-view-tanggal") && fpMESIN);
  var b1=fpEl("fp-btn-pilih-tgl"); if(b1) b1.style.display=showBtn?"":"none";
  var b2=fpEl("fp-btn-add"); if(b2) b2.style.display=showBtn?"":"none";
  var cb=document.querySelector(".fp-crumb");
  if(cb){ if(showBtn) cb.classList.add("fp-2row"); else cb.classList.remove("fp-2row"); }
  fpUpdateCalLabel();
}
function fpBack(){
  if(!fpEl("fp-view-mesin").classList.contains("hidden")) return;
  if(!fpEl("fp-view-detail").classList.contains("hidden")) fpGoMesin();
  else if(!fpEl("fp-view-form").classList.contains("hidden")){ if(fpKEY) fpOpenDetail(fpKEY); else fpGoHariIni(); }
  else if(!fpEl("fp-view-tanggal").classList.contains("hidden")) fpGoMesin();
  else fpGoMesin();
}
window.init_formproduksi=function(){ fpGoMesin(); };
window.init_FormProduksi=function(){ fpGoMesin(); };

function fpSetNum(el,col,i){ el.value=el.value.replace(/[^0-9]/g,""); fpDATA[col][i]=el.value; }
function fpSetNum1(el,k){ el.value=el.value.replace(/[^0-9]/g,""); if(k==="coil"){ fpCOIL=el.value; } else { fpDATA[k]=el.value; } }

function fpGoMesin(){
  var myGen=++fpGEN;
  fpMESIN=null; fpEl("fp-crumb").textContent="PILIH MESIN"; fpHideTotalBadge(); fpShow("fp-view-mesin");
  var c=fpCacheGet("mesin");
  if(c) fpRenderMesin(c);
  fpRun("getMesin",[],function(list){ fpCacheSet("mesin",list); if(myGen===fpGEN) fpRenderMesin(list); });
}
function fpRenderMesin(list){
  if(!list || !list.length){ fpEl("fp-mesin-grid").innerHTML='<div class="fp-card">Master mesin kosong - isi sheet MASTER_MESIN.</div>'; return; }
  fpEl("fp-mesin-grid").innerHTML=list.map(function(m){
    return '<div class="fp-mesin-card" onclick="fpOpenMesin(\''+m+'\')">'+m+'</div>';
  }).join("");
}
function fpOpenMesin(m){ 
  fpMESIN=m; 
  var todayKey="det:"+m+":"+fpToday();
  if(!fpCacheGet(todayKey)){
    fpRun("getDetail",[m,fpToday(),fpUserNama()],function(d){
      fpCacheSet(todayKey,d);
    });
  }
  fpGoHariIni(); 
}

function fpShowListInline(list, myGen){
  if(myGen!==undefined && myGen!==fpGEN) return;
  fpShow("fp-view-tanggal");
  fpEl("fp-crumb").textContent="DATA PRODUKSI "+fpMESIN; fpHideTotalBadge();
  fpRenderTanggal(list||[]);
}
function fpGoTanggal(){
  var myGen=++fpGEN;
  var ck="tgl:"+fpMESIN;
  var c=fpCacheGet(ck);
  if(c){ fpShowListInline(c, myGen); }
  else { fpShow("fp-view-tanggal"); fpEl("fp-crumb").textContent="DATA PRODUKSI "+fpMESIN; fpHideTotalBadge(); fpEl("fp-tgl-list").innerHTML=""; }
  fpRun("getListTanggal",[fpMESIN, fpUserNama()],function(list){
    fpCacheSet(ck,list);
    if(myGen===fpGEN) fpShowListInline(list, myGen);
  });
}
function fpRenderTanggal(list){
  var html="", bl="";
  (list||[]).forEach(function(x){
    if(x.bulan!==bl){ bl=x.bulan; html+='<div class="fp-bulan">'+bl+'</div>'; }
    html+='<div class="fp-tgl-row" onclick="fpOpenDetail(\''+x.key+'\')"><span class="t">'+x.tgl+
          '</span><span class="tot">Total: '+fpFmt(x.total)+'</span><span class="chev">&#10095;</span></div>';
  });
  fpEl("fp-tgl-list").innerHTML=html||'<div class="fp-card">Belum ada data produksi.</div>';
  (list||[]).forEach(function(x){
    var ck="det:"+fpMESIN+":"+x.key;
    if(!fpCacheGet(ck)){
      fpRun("getDetail",[fpMESIN,x.key,fpUserNama()],function(d){
        fpCacheSet(ck,d);
      });
    }
  });
}

function fpGoHariIni(){
  var myGen=++fpGEN;
  var today=fpToday();
  var ckDet="det:"+fpMESIN+":"+today;
  fpKEY=today;
  fpShow("fp-view-detail");
  fpCrumbDetail(today, null);
  var cached=fpCACHE[ckDet];
  if(cached && cached.v){
    if(((cached.v.cards||[]).length>0)) fpRenderDetail(cached.v); else fpRenderEmptyToday();
    if(fpCacheIsFresh(ckDet, 60000)) return;
  } else {
    fpRenderLoading();
  }
  fpRun("getDetail",[fpMESIN,today,fpUserNama()],function(d){
    fpCacheSet(ckDet,d);
    if(myGen!==fpGEN) return;
    var cards=(d&&d.cards)||[];
    if(cards.length===0){ fpRenderEmptyToday(); } else { fpRenderDetail(d); }
  });
}
function fpRenderEmptyToday(){
  fpKEY=fpToday(); fpCARDS=[];
  fpShow("fp-view-detail");
  fpCrumbDetail(fpKEY, 0);
  fpEl("fp-detail-box").innerHTML='<div class="fp-card" style="text-align:center;color:#888;padding:30px">BELUM ADA DATA</div>';
}
function fpRenderLoading(){
  var h="";
  for(var i=0;i<2;i++){
    h+='<div class="fp-skel"><div style="display:flex;gap:12px;align-items:center"><div class="fp-skel-qr"></div><div style="flex:1"><div class="fp-skel-line w40"></div><div class="fp-skel-line w60"></div></div></div><div class="fp-skel-line w80"></div><div class="fp-skel-line w60"></div><div class="fp-skel-line w40"></div></div>';
  }
  fpEl("fp-detail-box").innerHTML=h;
}

function fpCalClick(e){
  var el=e.target;
  try{ if(el && typeof el.showPicker==="function"){ el.showPicker(); } }catch(err){}
}
function fpCalPick(v){
  if(!v) return;
  fpOpenDetail(v);
}

function fpProdTipe(){ return (fpMESIN && String(fpMESIN).indexOf("RENG")>=0) ? "RENG" : "TRUSS"; }
function fpRenderProduk(list, sel){
  var el=fpEl("fp-produk"); if(!el) return;
  var h='<option value="">Pilih Produk</option>';
  (list||[]).forEach(function(p){
    h+='<option'+(sel && String(p)===String(sel)?' selected':'')+'>'+fpEsc(p)+'</option>';
  });
  el.innerHTML=h;
}
function fpLoadProduk(sel){
  var t=fpProdTipe(), ck="prod:"+t;
  var c=fpCacheGet(ck);
  if(c) fpRenderProduk(c, sel);
  fpRun("getProduk",[t],function(list){ fpCacheSet(ck,list); fpRenderProduk(list, sel); });
}

function fpOpenForm(){
  fpEDIT=null;
  var _b=fpEl("fp-sbm"); if(_b){ _b.disabled=false; _b.textContent="SIMPAN"; }
  fpEl("fp-crumb").textContent="DATA PRODUKSI "+fpMESIN; fpHideTotalBadge(); fpShow("fp-view-form");
  fpResetForm();
  fpEl("fp-op").value = fpUserNama();
  fpEl("fp-mesin").value = fpMESIN;
  fpLoadProduk();
}
function fpRefreshNo(){
  fpRun("getNextNo",[fpMESIN,fpEl("fp-tgl").value],function(n){ fpEl("fp-no").value=n; });

var fpIKOLS=[{k:"inputan",l:"INPUTAN"},{k:"prime",l:"PRIME"},{k:"rijekCoil",l:"RIJEK COIL"},{k:"rijekMesin",l:"RIJEK MESIN"},{k:"scrap",l:"SCRAP"},{k:"nonPrime",l:"NON PRIME"}];
function fpTotals(rows){
  var t=0,tm=0,tp=0;
  rows.forEach(function(r){
    var i=Number(r.inputan)||0, np=Number(r.nonPrime)||0;
    t+=i; tm+=i+np; tp+=(Number(r.prime)||0)+(Number(r.rijekCoil)||0)+(Number(r.rijekMesin)||0)+(Number(r.scrap)||0);
  });
  return {t:t,tm:tm,tp:tp};
}

function fpMergedTable(rows, editable){
  var tot=fpTotals(rows);
  var vis=fpIKOLS.filter(function(c){ return rows.some(function(r){ return Number(r[c.k])||0; }); });
  var sessions=[];
  rows.forEach(function(r,ri){
    if(Number(r.inputan)>0 || sessions.length===0){ sessions.push([{ri:ri,r:r}]); }
    else { sessions[sessions.length-1].push({ri:ri,r:r}); }
  });
  var phys=[];
  sessions.forEach(function(sess,si){
    sess.forEach(function(item,i){
      if(i>0){
        var adaIsi=vis.some(function(c){ return Number(item.r[c.k])||0; });
        if(!adaIsi) return;
      }
      phys.push({ no:(i===0)? (si+1) : "", ri:item.ri, row:item.r });
    });
  });
  var head='<tr><th class="fp-th">NO</th>'+vis.map(function(c){ return '<th class="fp-th">'+c.l+'</th>'; }).join("")+
           '<th class="fp-th">TOTAL</th><th class="fp-th">TOTAL MAX</th><th class="fp-th">TOTAL POTONGAN</th>';
  if(editable) head += '<th class="fp-th" style="width:40px;"></th>';
  head += '</tr>';
  var body="";
  phys.forEach(function(p,idx){
    body+='<tr><td class="fp-td">'+p.no+'</td>';
    body+=vis.map(function(c){
      var v=Number(p.row[c.k])||0;
      if(editable){ return '<td class="fp-td fp-edit" onclick="fpEditCell(this,'+p.ri+',\''+c.k+'\')">'+(v? fpFmt(v) : '')+'</td>'; }
      return '<td class="fp-td">'+(v? fpFmt(v) : '')+'</td>';
    }).join("");
    if(idx===0){
      body+='<td class="fp-merge" rowspan="'+phys.length+'">'+fpFmt(tot.t)+'</td>'+
            '<td class="fp-merge" rowspan="'+phys.length+'">'+fpFmt(tot.tm)+'</td>'+
            '<td class="fp-merge" rowspan="'+phys.length+'">'+fpFmt(tot.tp)+'</td>';
    }
    if(editable){
      body+='<td class="fp-td" style="text-align:center;"><button class="fp-delbtn" onclick="fpDelRow('+p.ri+')" title="Hapus Baris Ini"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button></td>';
    }
    body+='</tr>';
  });
  if(!phys.length){
    var colspan = vis.length + 4 + (editable ? 1 : 0);
    body='<tr><td class="fp-td" colspan="'+colspan+'">Belum ada inputan</td></tr>';
  }
  return '<table class="fp-table">'+head+body+'</table>';
}

var fpScanStream=null, fpScanTimer=null, fpScanSent=false, fpTorchOn=false, fpScanCv=null;
var fpScanListenerAdded=false;
function fpLoadJsQR(cb){
  if(typeof jsQR!=="undefined"){ cb(); return; }
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
  s.onload=cb;
  s.onerror=function(){ alert("Gagal memuat mesin QR. Cek internet."); };
  document.head.appendChild(s);
}
function fpStopStream(){
  if(fpScanTimer){ clearInterval(fpScanTimer); fpScanTimer=null; }
  if(fpScanStream){ fpScanStream.getTracks().forEach(function(t){ t.stop(); }); fpScanStream=null; }
  var v=fpEl("fp-scan-video"); if(v){ v.srcObject=null; }
  fpTorchOn=false;
}
function fpAddScanListener(){
  if(fpScanListenerAdded) return;
  fpScanListenerAdded=true;
  window.addEventListener("DMS_KPC_SCAN", function(ev){
    if(ev && ev.detail && ev.detail.text){ fpApplyKpc(ev.detail.text); }
  });
}
function fpOpenScan(){
  if(window.__SCANNER__ && window.__SCANNER__.start){ fpAddScanListener(); window.__SCANNER__.start(); return; }
  fpEl("fp-scan-modal").classList.remove("hidden");
  fpLoadJsQR(function(){ fpStartLive(); });
}
function fpCloseScan(){ fpStopStream(); fpEl("fp-scan-modal").classList.add("hidden"); }
function fpStartLive(deviceId){
  fpStopStream(); fpScanSent=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Kamera tidak didukung."); return; }
  var vid={width:{ideal:1920},height:{ideal:1080}};
  if(deviceId){ vid.deviceId={exact:deviceId}; } else { vid.facingMode="environment"; }
  navigator.mediaDevices.getUserMedia({video:vid,audio:false})
    .then(function(stream){
      fpScanStream=stream;
      var v=fpEl("fp-scan-video"); v.srcObject=stream; v.play();
      fpScanCv=document.createElement("canvas");
      fpListCams(deviceId||null);
      fpScanTimer=setInterval(fpScanTick,350);
    })
    .catch(function(e){ alert("Kamera tidak bisa dibuka: "+e.message); fpCloseScan(); });
}
function fpScanTick(){
  if(fpScanSent||!fpScanStream||typeof jsQR==="undefined") return;
  var v=fpEl("fp-scan-video");
  if(!v||!v.videoWidth||v.readyState!==4) return;
  fpScanCv.width=v.videoWidth; fpScanCv.height=v.videoHeight;
  var cx=fpScanCv.getContext("2d"); cx.drawImage(v,0,0);
  var img=cx.getImageData(0,0,fpScanCv.width,fpScanCv.height);
  var code=null;
  try{ code=jsQR(img.data,fpScanCv.width,fpScanCv.height,{inversionAttempts:"attemptBoth"}); }catch(e){}
  if(code&&code.data){ fpScanSent=true; var txt=code.data; setTimeout(function(){ fpApplyKpc(txt); },120); }
}
function fpListCams(activeId){
  if(!navigator.mediaDevices.enumerateDevices) return;
  navigator.mediaDevices.enumerateDevices().then(function(devs){
    var cams=devs.filter(function(d){ return d.kind==="videoinput"; });
    var sel=fpEl("fp-scan-cams"), cnt=fpEl("fp-scan-camcount");
    if(cnt) cnt.textContent=cams.length;
    sel.innerHTML="";
    cams.forEach(function(c,i){
      var o=document.createElement("option"); o.value=c.deviceId;
      o.textContent=(c.label||("camera "+(i+1)));
      if(activeId&&c.deviceId===activeId) o.selected=true;
      sel.appendChild(o);
    });
  }).catch(function(){});
}
function fpCamChange(){ fpStartLive(fpEl("fp-scan-cams").value); }
function fpZoomChange(el){
  var lbl=fpEl("fp-scan-zoomlbl");
  if(lbl) lbl.textContent=Number(el.value).toFixed(1).replace(/\.0$/,"")+"x zoom";
  if(!fpScanStream) return;
  var t=fpScanStream.getVideoTracks()[0];
  if(!t||!t.getCapabilities) return;
  var cap=t.getCapabilities();
  if(cap&&cap.zoom){
    var z=Math.min(Math.max(Number(el.value),cap.zoom.min||1),cap.zoom.max||1);
    try{ t.applyConstraints({advanced:[{zoom:z}]}); }catch(e){}
  }
}
function fpToggleTorch(){
  if(!fpScanStream) return;
  var t=fpScanStream.getVideoTracks()[0];
  if(!t||!t.getCapabilities) return;
  var cap=t.getCapabilities();
  if(!cap||!cap.torch){ alert("Lampu senter tidak didukung perangkat ini."); return; }
  fpTorchOn=!fpTorchOn;
  try{ t.applyConstraints({advanced:[{torch:fpTorchOn}]}); }catch(e){}
}

function fpDrawCanvas(c, cols, useTotal, phys, qr, foto){
  var F=24; var S=2;
  var names=["NOR"].concat(cols.map(function(z){ return z.l; })).concat(useTotal?["TOTAL"]:[]);
  var nc=names.length;
  var M=50; var W=1200; var CW=W-M*2;
  var yTitle=50; var yLineBlue=75; var yNo=110; var yQrTop=140; var qrSize=160;
  var yInfoStart=yQrTop+qrSize+40; var lineH=F+14; var infoLines=4;
  var yTableHead=yInfoStart+(infoLines*lineH)+25; var headH=F+20; var rowH=F+20;
  var tableBodyH = (phys.length * rowH); var tableTotalH = headH + tableBodyH;
  var yTableBottom = yTableHead + tableTotalH;
  var dw=0, dh=0;
  if(foto){ dw=CW; dh=Math.round(CW*2/5); }
  var H = yTableBottom + 30 + (foto ? (30+dh+30) : 0);
  var cv=document.createElement("canvas"); cv.width=W*S; cv.height=H*S;
  var x=cv.getContext("2d"); x.scale(S,S);
  x.fillStyle="#f7fafc"; x.fillRect(0,0,W,H); x.textBaseline="middle";
  x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif"; x.textAlign="center";
  x.fillText("DATA PRODUKSI EUP GUDANG TAIPA 2026", W/2, yTitle);
  x.fillStyle="#1155cc"; x.fillRect(M, yLineBlue, CW, 8);
  x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif"; x.textAlign="center";
  x.fillText("[NO "+c.no+"]", W/2, yNo);
  if(qr){ try{ x.drawImage(qr, M, yQrTop, qrSize, qrSize); }catch(e){} }
  x.textAlign="left"; x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif";
  x.fillText(c.kpc||"-", M+qrSize+25, yQrTop+qrSize/2);
  var inf=[["Tanggal", c.tanggal],["Operator", c.operator],["Mesin", c.mesin],["Produk", c.produk]];
  x.textAlign="left";
  inf.forEach(function(row,i){
    var yPos = yInfoStart + i*lineH + lineH/2;
    x.fillStyle="#334455"; x.font="bold "+F+"px Arial, sans-serif"; x.fillText(row[0], M, yPos);
    x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif"; x.fillText(": "+row[1], M+250, yPos);
  });
  var rejTotal=0;
  phys.forEach(function(p){ rejTotal += Number(p.row.rijekCoil)||0; });
  var rejCx=W-M-250, rejCy=yQrTop+qrSize/2+20;
  x.save();
  x.translate(rejCx, rejCy);
  x.rotate(-25*Math.PI/180);
  x.font="bold 44px Arial, sans-serif";
  x.textAlign="center"; x.textBaseline="middle";
  x.shadowColor="rgba(0,0,0,0.6)"; x.shadowOffsetX=5; x.shadowOffsetY=5;
  x.fillStyle="#e53935";
  x.fillText("RIJECTED COIL", 0, -26);
  x.fillText(fpFmt(rejTotal), 0, 26);
  x.restore();
  x.fillStyle="#1155cc"; x.fillRect(M, yTableHead, CW, headH);
  x.fillStyle="#fff"; x.font="bold "+F+"px Arial, sans-serif"; x.textAlign="center";
  var colW=CW/nc;
  names.forEach(function(nm,i){ x.fillText(nm, M+colW*i+colW/2, yTableHead+headH/2); });
  x.fillStyle="#fff"; x.fillRect(M, yTableHead+headH, CW, tableBodyH);
  x.strokeStyle="#cfd6e0"; x.lineWidth=1;
  var totalLeftX = M + colW*(nc-1);
  for(var r=0;r<=phys.length;r++){
    var yy=yTableHead+headH+(r*rowH);
    var endX = (useTotal && r>0 && r<phys.length) ? totalLeftX : (M+CW);
    x.beginPath(); x.moveTo(M, yy); x.lineTo(endX, yy); x.stroke();
  }
  for(var i2=0;i2<=nc;i2++){ var xx=M+colW*i2; x.beginPath(); x.moveTo(xx, yTableHead); x.lineTo(xx, yTableHead+headH+tableBodyH); x.stroke(); }
  x.strokeRect(M, yTableHead, CW, tableTotalH);
  x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif"; x.textAlign="center";
  phys.forEach(function(p,ri){
    var cy = yTableHead + headH + (ri*rowH) + rowH/2;
    x.fillText(String(p.no), M+colW/2, cy);
    cols.forEach(function(z,ci){ var v=Number(p.row[z.k])||0; x.fillText(v? fpFmt(v) : "", M+colW*(ci+1)+colW/2, cy); });
  });
  if(useTotal){
    var totalX = M+colW*(nc-1);
    x.fillStyle="#1155cc"; x.font="bold "+(F+2)+"px Arial, sans-serif";
    x.fillText(fpFmt(c.total), totalX+colW/2, yTableHead+headH+tableBodyH/2);
  }
  if(foto && dw>0 && dh>0){
    var py=yTableBottom+30; var px=(W-dw)/2;
    var fw=foto.naturalWidth||foto.width, fh=foto.naturalHeight||foto.height;
    if(fw>0 && fh>0){
      var rt=dw/dh, sx=0, sy=0, sw=fw, sh=fh;
      if(fw/fh > rt){ sw=fh*rt; sx=(fw-sw)/2; } else { sh=fw/rt; sy=(fh-sh)/2; }
      try{ x.drawImage(foto, sx, sy, sw, sh, px, py, dw, dh); x.strokeStyle="#cfd6e0"; x.strokeRect(px, py, dw, dh); }catch(e){}
    }
  }
  return cv;
}
function fpBuildPrintPNG(cb){
  var c=fpPRINTCARD; if(!c){ alert("Tidak ada data untuk dicetak"); return; }
  var cols=fpIKOLS.filter(function(z){ return fpPRINTCOLS[z.k] && z.k!=="nonPrime"; });
  var useTotal=!!fpPRINTCOLS["total"];
  var sessions=[];
  (c.inputs||[]).forEach(function(r){
    if(Number(r.inputan)>0 || sessions.length===0){ sessions.push([r]); }
    else { sessions[sessions.length-1].push(r); }
  });
  var phys=[];
  sessions.forEach(function(ss2,si){ ss2.forEach(function(r,i){ phys.push({ no:(i===0)?(si+1):"", row:r }); }); });
  if(!phys.length){ phys=[{no:1,row:{}}]; }
  var foto=(c._fotoImg && c._fotoImg.complete && c._fotoImg.naturalWidth>0)? c._fotoImg : null;
  if(c.kpc){ fpQrDrawable(c, 240, function(qr){ cb(fpDrawCanvas(c, cols, useTotal, phys, qr, foto)); }); }
  else { cb(fpDrawCanvas(c, cols, useTotal, phys, null, foto)); }
}
function fpNamaFile(){ var c=fpPRINTCARD; return (fpMESIN||"DATA")+" ("+(c? c.no : "")+").png"; }
function fpPrintSig(){
  var c=fpPRINTCARD; if(!c) return "";
  var cols=fpIKOLS.filter(function(z){ return fpPRINTCOLS[z.k] && z.k!=="nonPrime"; }).map(function(z){ return z.k; }).join(",");
  var ut=fpPRINTCOLS["total"]?"T":"";
  var foto=(c._fotoImg && c._fotoImg.complete && c._fotoImg.naturalWidth>0)?"F":"-";
  return cols+"|"+ut+"|"+foto;
}
function fpTriggerDl(url,name){
  try{
    var a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener"; a.style.display="none";
    document.body.appendChild(a);
    setTimeout(function(){ try{ a.click(); }catch(e){} setTimeout(function(){ try{ a.remove(); }catch(e){} },2000); },60);
  }catch(e){}
}
function fpDoDownload(){
  var c=fpPRINTCARD; if(!c){ alert("Tidak ada data untuk dicetak"); return; }
  var btn=fpEl("fp-dlbtn"); var orig=btn?btn.innerHTML:"";
  var sig=fpPrintSig(); var key=fpMESIN+"|"+fpKEY+"|"+c.no+"|"+sig;
  var cached=fpDLCACHE[key];
  if(cached){
    fpTriggerDl(cached, fpNamaFile());
    document.body.classList.remove("fp-nofab");
    if(btn){ btn.textContent="\u2713 TERSIMPAN"; setTimeout(function(){ if(btn){ btn.innerHTML=orig; } },1200); }
    return;
  }
  if(fpDLBusy) return;
  fpDLBusy=true;
  if(btn){ btn.disabled=true; btn.textContent="MEMBUAT..."; }
  fpBuildPrintPNG(function(cv){
    var url; try{ url=cv.toDataURL("image/png"); }catch(e){ url=null; }
    fpDLBusy=false;
    if(!url){ if(btn){ btn.disabled=false; btn.innerHTML=orig; } alert("Gagal membuat gambar."); return; }
    fpDLCACHE[key]=url; fpTriggerDl(url, fpNamaFile());
    document.body.classList.remove("fp-nofab");
    if(btn){ btn.textContent="\u2713 TERSIMPAN"; setTimeout(function(){ if(btn){ btn.disabled=false; btn.innerHTML=orig; } },1500); }
  });
}

function fpOpenDetail(key){
  var myGen=++fpGEN;
  fpKEY=key; fpShow("fp-view-detail");
  fpCrumbDetail(key, null);
  var ck="det:"+fpMESIN+":"+key;
  var cached=fpCACHE[ck];
  if(cached && cached.v){
    var cards0=(cached.v.cards)||[];
    if(cards0.length===0 && key===fpToday()){ fpRenderEmptyToday(); }
    else { fpRenderDetail(cached.v); }
    if(fpCacheIsFresh(ck, 60000)) return;
  } else {
    fpRenderLoading();
  }
  fpRun("getDetail",[fpMESIN,key,fpUserNama()],function(d){
    fpCacheSet(ck,d);
    if(myGen!==fpGEN) return;
    if(!fpEl("fp-view-detail").classList.contains("hidden")){
      var cards=(d&&d.cards)||[];
      if(cards.length===0 && key===fpToday()){ fpRenderEmptyToday(); }
      else { fpRenderDetail(d); }
    }
  });
}
function fpRenderDetail(d){
  fpSTRUCT=d.struct; fpCARDS=d.cards;
  var sumTot=0; (d.cards||[]).forEach(function(c){ sumTot+=Number(c.total)||0; });
  fpCrumbDetail(fpKEY, sumTot);
  var html=(d.cards||[]).map(function(c, idx){
    var qr=c.kpc? '<img class="fp-qr" width="86" height="86" data-qr="'+encodeURIComponent(c.kpc)+'" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">' : '<div class="fp-qr" style="width:86px;height:86px"></div>';
    return '<div class="fp-card" data-fp-card="'+idx+'"><div class="fp-det-head"><span class="fp-det-no">NO '+c.no+'</span>'+
      '<button class="fp-icobtn" title="Edit" onclick="fpEditCard('+idx+')">&#9998;</button>'+
      '<button class="fp-icobtn" title="Download" onclick="fpOpenPrint('+idx+')"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></button>'+
      '<button class="fp-icobtn" title="Full Screen" onclick="fpFullScreen('+idx+')"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button></div>'+
      '<div class="fp-det-body"><div class="fp-det-left">'+
      '<div class="fp-qrrow">'+qr+'<div class="fp-kpc">'+(c.kpc||"-")+'</div></div>'+
      '<div class="fp-inf"><b>TANGGAL</b> '+c.tanggal+'</div><div class="fp-inf"><b>OPERATOR</b> '+c.operator+'</div>'+
      '<div class="fp-inf"><b>MESIN</b> '+c.mesin+'</div><div class="fp-inf"><b>PRODUK</b> '+c.produk+'</div>'+
      '<div class="fp-inf"><b>PANJANG COIL</b> '+fpFmt(c.panjangCoil)+'</div></div></div>'+
      '<div style="height:12px"></div>'+fpMergedTable(c.inputs)+'</div>';
  }).join("") || '<div class="fp-card">Tidak ada data.</div>';
  fpEl("fp-detail-box").innerHTML=html;
  var imgs=fpEl("fp-detail-box").querySelectorAll("img[data-qr]");
  for(var i=0;i<imgs.length;i++){
    (function(im){
      var text=decodeURIComponent(im.getAttribute("data-qr"));
      var cv=fpMakeQr(text, 172);
      if(cv){ im.src=cv.toDataURL(); }
      else{ im.src="https://api.qrserver.com/v1/create-qr-code/?size=86x86&data="+encodeURIComponent(text); }
    })(imgs[i]);
  }
}
function fpFullScreen(idx){
  var card=document.querySelector('[data-fp-card="'+idx+'"]');
  if(!card){ return; }
  var clone=card.cloneNode(true); clone.removeAttribute("data-fp-card");
  var inner=fpEl("fp-fs-inner"); inner.innerHTML=""; inner.appendChild(clone);
  fpEl("fp-fs-modal").classList.add("show"); document.body.style.overflow="hidden";
}
function fpCloseFS(){
  fpEl("fp-fs-modal").classList.remove("show");
  fpEl("fp-fs-inner").innerHTML="";
  document.body.style.overflow="";
}
</script>
<!-- FP-CAM-FILE-END -->

if(window.__RP_AUTO_START){ fpStartMenu(); }
