<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan KPC</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
#v{width:100%;height:100vh;object-fit:cover;display:block}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.box{position:relative;width:64%;max-width:300px;aspect-ratio:1/1;background:rgba(255,255,255,.06);box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.box .c{position:absolute;width:34px;height:34px;border:0 solid #fff}
.tl{top:0;left:0;border-top-width:5px;border-left-width:5px}
.tr{top:0;right:0;border-top-width:5px;border-right-width:5px}
.bl{bottom:0;left:0;border-bottom-width:5px;border-left-width:5px}
.br{bottom:0;right:0;border-bottom-width:5px;border-right-width:5px}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#fff;font:bold 14px Arial;text-shadow:0 1px 4px #000}
.done{position:fixed;inset:0;background:#16A34A;color:#fff;display:flex;align-items:center;justify-content:center;font:bold 20px Arial}
</style>
</head>
<body>
<video id="v" playsinline autoplay muted></video>
<div class="ov"><div class="box"><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span></div></div>
<div class="hint">Arahkan QR KPC ke kotak</div>
<script>
var stream=null, timer=null, sent=false;
function start(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}})
    .then(function(s){
      stream=s;
      var v=document.getElementById("v");
      v.srcObject=s; v.play();
      var cv=document.createElement("canvas"), cx=cv.getContext("2d");
      timer=setInterval(function(){
        if(sent) return;
        if(!v.videoWidth||v.readyState!==4) return;
        cv.width=v.videoWidth; cv.height=v.videoHeight;
        cx.drawImage(v,0,0);
        var img=cx.getImageData(0,0,cv.width,cv.height);
        var code=null;
        try{ code=jsQR(img.data,cv.width,cv.height,{inversionAttempts:"attemptBoth"}); }catch(e){}
        if(code&&code.data){
          sent=true;
          clearInterval(timer);
          try{ window.parent.postMessage({type:"DMS_KPC_SCAN",text:code.data},"*"); }catch(e){}
          document.body.innerHTML='<div class="done">&#10004; QR TERBACA</div>';
          setTimeout(function(){ try{ window.parent.postMessage({type:"DMS_KPC_SCAN",text:code.data},"*"); }catch(e){} },300);
        }
      },400);
    })
    .catch(function(e){
      document.querySelector(".hint").textContent="Kamera tidak bisa dibuka: "+e.message;
    });
}
start();
</script>
</body>
</html>
