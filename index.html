<script>
var API_URL="https://script.google.com/macros/s/AKfycbwzk6T_YFrgmHOp2N2JGG-s9YL0_Fkhf7z8zkwNU9HwSsLT0V_nM3paaAP1PRfn1LIlnw/exec";
var USER=null;

function $id(x){ return document.getElementById(x); }

function api(params, cb, fail){
  fetch(API_URL,{method:"POST",body:JSON.stringify(params)})
    .then(r=>r.json()).then(cb).catch(e=>{ if(fail) fail(e); });
}

/* === FUNGSI UTAMA: LOAD SHELL DARI APPS SCRIPT (PERBAIKAN BUG KLIK) === */
function loadShell(callback){
  // 1. Ambil Sidebar
  api({action:"getShellPart", name:"Sidebar"}, function(resS){
    var htmlS = (resS && resS.html) ? resS.html : "";
    
    // Masukkan HTML Sidebar ke container
    var sbContainer = $id("sidebar-container");
    if(sbContainer) sbContainer.innerHTML = htmlS;

    // 2. Ambil Header
    api({action:"getShellPart", name:"Header"}, function(resH){
      var htmlH = (resH && resH.html) ? resH.html : "";
      
      if(htmlH){
        // Timpa header statis dengan header dinamis dari App
        var hdrContainer = $id("header-container");
        if(hdrContainer) hdrContainer.outerHTML = htmlH;
      }

      // 3. PENTING: Setelah HTML masuk, pasang ulang Event Listener Manual
      rebindEvents(); 

      if(callback) callback();
    });
  });
}

/* === REBIND EVENTS: MEMASTIKAN TOMBOL GARIS 3 & MENU BERFUNGSI === */
function rebindEvents(){
  // Cari tombol menu (garis 3) di header baru
  var btnMenu = document.querySelector('#btn-menu') || document.querySelector('.menu-btn');
  if(btnMenu){
    btnMenu.onclick = toggleSidebar; // Pasang fungsi toggle langsung
  }

  // Cari overlay di sidebar baru
  var ov = document.querySelector('#sidebar-overlay');
  if(ov){
    ov.onclick = toggleSidebar;
  }

  // Pastikan semua link di sidebar punya aksi loadPage yang benar
  var links = document.querySelectorAll('#app-sidebar a');
  links.forEach(function(link){
    var href = link.getAttribute('href');
    if(href && href.indexOf("#") !== -1){
       // Jika href="#" berarti onclick internal, biarkan browser handle via attribute onclick="..."
       // Tapi jika kosong, kita paksa panggil loadPage berdasarkan textContent (opsional)
    }
  });
}

function doLogin(){
  var u=$id("lg-user").value.trim();
  var p=$id("lg-pass").value;
  var msg=$id("lg-msg");
  var btn=$id("lg-btn");
  if(!u||!p){ msg.textContent="Isi username & password."; return; }
  msg.textContent="Memproses..."; btn.disabled=true;
  
  api({action:"login",user:u,pass:p}, function(res){
    btn.disabled=false;
    if(res && res.ok){ 
       USER = { nama: res.nama || (res.data && res.data.nama) };
       sessionStorage.setItem("EUP_USER", JSON.stringify(USER));
       enterApp();
    } else { 
       msg.textContent=(res&&res.msg)||"Login gagal."; 
    }
  }, function(e){ btn.disabled=false; msg.textContent="Error koneksi."; });
}

function enterApp(){
  $id("login-area").classList.add("hidden");
  $id("app").classList.remove("hidden");
  
  // Load Shell dulu
  loadShell(function(){
    // SETELAH shell termuat, BARU isi nama user ke span #user-nama
    var userSpan = $id("user-nama");
    if(userSpan) userSpan.textContent = USER.nama;
    
    // Baru load halaman dashboard
    loadPage("Dashboard");
  });
}

function logout(){
  USER=null;
  sessionStorage.clear();
  location.reload();
}

function toggleSidebar(){
  // Cari sidebar terbaru di DOM
  var sb = document.querySelector('#app-sidebar');
  var ov = document.querySelector('#sidebar-overlay');
  
  if(sb && ov){
    sb.classList.toggle("open");
    ov.classList.toggle("show", sb.classList.contains("open"));
  } else {
    console.error("Sidebar/Overlay tidak ditemukan di DOM!");
  }
}

// ... (Sisa kode inject, loadPage, scanner logic tetap sama seperti versi stabil Anda sebelumnya) ...
// COPY-PASTE BAGIAN INJECT, LOADPAGE, DAN SCANNER LOGIC DARI VERSI SEBELUMNYA KE SINI
</script>
