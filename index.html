<script>
var API_URL="https://script.google.com/macros/s/AKfycbwzk6T_YFrgmHOp2N2JGG-s9YL0_Fkhf7z8zkwNU9HwSsLT0V_nM3paaAP1PRfn1LIlnw/exec";
var USER=null;

function $id(x){ return document.getElementById(x); }

function api(params, cb, fail){
  fetch(API_URL,{method:"POST",body:JSON.stringify(params)})
    .then(r=>r.json()).then(cb).catch(e=>{ if(fail) fail(e); });
}

/* === FUNGSI UTAMA: LOAD SHELL DARI APPS SCRIPT (HEADER & SIDEBAR) === */
function loadShell(callback){
  // 1. Ambil Sidebar HTML dari Apps Script
  api({action:"getShellPart", name:"Sidebar"}, function(resS){
    var htmlS = (resS && resS.html) ? resS.html : "";
    
    // Masukkan ke container placeholder di GitHub
    var sbContainer = $id("sidebar-container");
    if(sbContainer) sbContainer.innerHTML = htmlS;

    // 2. Ambil Header HTML dari Apps Script
    api({action:"getShellPart", name:"Header"}, function(resH){
      var htmlH = (resH && resH.html) ? resH.html : "";
      
      if(htmlH){
        // Timpa header statis dengan header dinamis dari App
        var hdrContainer = $id("header-container");
        if(hdrContainer) {
           // Gunakan outerHTML agar tag <style> di dalam Header.html juga ikut terbaca oleh browser
           hdrContainer.outerHTML = htmlH; 
        }
      }

      // 3. PENTING: Setelah DOM berubah total, pasang ulang Event Listener Manual
      rebindEvents(); 

      if(callback) callback();
    });
  });
}

/* === REBIND EVENTS: MEMASTIKAN TOMBOL GARIS 3 & MENU BERFUNGSI === */
function rebindEvents(){
  // Cari tombol menu (garis 3) di header baru
  var btnMenu = document.querySelector('#btn-menu') || document.querySelector('.menu-btn');
  if(btnMenu){
    btnMenu.onclick = toggleSidebar; // Pasang fungsi toggle langsung
  }

  // Cari overlay di sidebar baru
  var ov = document.querySelector('#sidebar-overlay');
  if(ov){
    ov.onclick = toggleSidebar;
  }
  
  // Opsional: Pastikan link di sidebar punya handler yang benar jika onclick internal gagal
  // Tapi karena kita pakai onclick="loadPage(...)" di Sidebar.html, ini biasanya sudah cukup.
}

function doLogin(){
  var u=$id("lg-user").value.trim();
  var p=$id("lg-pass").value;
  var msg=$id("lg-msg");
  var btn=$id("lg-btn");
  if(!u||!p){ msg.textContent="Isi username & password."; return; }
  msg.textContent="Memproses..."; btn.disabled=true;
  
  api({action:"login",user:u,pass:p}, function(res){
    btn.disabled=false;
    if(res && res.ok){ 
       USER = { nama: res.nama || (res.data && res.data.nama) };
       sessionStorage.setItem("EUP_USER", JSON.stringify(USER));
       enterApp();
    } else { 
       msg.textContent=(res&&res.msg)||"Login gagal."; 
    }
  }, function(e){ btn.disabled=false; msg.textContent="Error koneksi."; });
}

function enterApp(){
  $id("login-area").classList.add("hidden");
  $id("app").classList.remove("hidden");
  
  // Load Shell dulu (Ambil Header/Sidebar dari App)
  loadShell(function(){
    // SETELAH shell termuat, BARU isi nama user ke span #user-nama
    // Ini memperbaiki bug "titik-titik" karena sebelumnya elemen belum ada atau tertimpa
    var userSpan = document.getElementById("user-nama");
    if(userSpan) userSpan.textContent = USER.nama;
    
    // Baru load halaman dashboard
    loadPage("Dashboard");
  });
}

function logout(){
  USER=null;
  sessionStorage.clear();
  location.reload();
}

function toggleSidebar(){
  // Cari sidebar terbaru di DOM (karena sudah di-inject ulang)
  var sb = document.querySelector('#app-sidebar');
  var ov = document.querySelector('#sidebar-overlay');
  
  if(sb && ov){
    sb.classList.toggle("open");
    ov.classList.toggle("show", sb.classList.contains("open"));
  } else {
    console.error("Sidebar/Overlay tidak ditemukan di DOM!");
  }
}

/* === INJEKSI HALAMAN CHILD (DASHBOARD/FORM/DIMENSI) === */
function inject(html, el){
  el.innerHTML=html;
  var scripts=el.querySelectorAll("script");
  for(var i=scripts.length-1;i>=0;i--){
    var old=scripts[i], nw=document.createElement("script");
    if(old.src) nw.src=old.src; else nw.text=old.textContent;
    document.body.appendChild(nw);
    if(old.parentNode) old.parentNode.removeChild(old);
  }
  // Fix tombol + (FAB) agar besar meski ada aturan global 14px
  setTimeout(function(){
    var fabs = document.querySelectorAll('.fp-fab, .dm-fab');
    for(var j=0;j<fabs.length;j++){
      fabs[j].style.cssText += "font-size:32px !important; line-height:58px !important; text-align:center !important;";
    }
  }, 200);
}

var PAGE_TTL=300000; // Cache 5 menit
function loadPage(name){
  toggleSidebar(); // Tutup sidebar saat pindah halaman
  $id("content").innerHTML='<div class="boot-msg">Memuat '+name+'...</div>';
  
  var key="EUP_HTML_"+name;
  try{
    var raw=sessionStorage.getItem(key);
    if(raw){ var c=JSON.parse(raw); if(c.html && (Date.now()-c.t)<PAGE_TTL){ inject(c.html, $id("content")); runInit(name); return; } }
  }catch(e){}

  api({action:"getPage",name:name}, function(res){
    var html=(res&&res.html)||(res&&res.data&&res.data.html);
    if(html){
      try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(),html:html})); }catch(e){}
      inject(html, $id("content"));
      runInit(name);
    }
  });
}

function runInit(name){
  setTimeout(function(){
    var fn=window["init_"+name]||window["init_"+name.toLowerCase()]||window["init_"+name.toUpperCase()];
    if(fn){ try{ fn(); }catch(e){ console.error(e); } }
  },200);
}

/* === SCANNER LOGIC (STANDAR - JANGAN UBAH) === */
var scanStream=null, scanTimer=null, scanSent=false, torchOn=false, scanCv=null;
var SCAN_OUT=700, SCAN_CROP=0.74, SCAN_MS=250;

function startScanner(deviceId){
  stopScanner(true); scanSent=false;
  if(!navigator.mediaDevices){ alert("Kamera tidak didukung."); return; }
  var vid={width:{ideal:1280},height:{ideal:720}};
  if(deviceId) vid.deviceId={exact:deviceId}; else vid.facingMode="environment";
  
  navigator.mediaDevices.getUserMedia({video:vid,audio:false}).then(function(stream){
    scanStream=stream;
    var v=$id("sc-video"); v.srcObject=stream; v.play();
    if(!scanCv) scanCv=document.createElement("canvas");
    listCams(deviceId);
    $id("sc-modal").classList.add("show");
    scanTimer=setInterval(scanTick,SCAN_MS);
  }).catch(function(e){ alert("Gagal buka kamera: "+e.message); });
}

function stopScanner(keepModal){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  if(scanStream){ scanStream.getTracks().forEach(function(t){ t.stop(); }); scanStream=null; }
  var v=$id("sc-video"); if(v) v.srcObject=null;
  torchOn=false;
  if(!keepModal) $id("sc-modal").classList.remove("show");
}

function scanTick(){
  if(scanSent||!scanStream||typeof jsQR==="undefined") return;
  var v=$id("sc-video");
  if(!v.videoWidth||v.readyState<2) return;
  var side=Math.floor(Math.min(v.videoWidth,v.videoHeight)*SCAN_CROP);
  var ox=Math.floor((v.videoWidth-side)/2), oy=Math.floor((v.videoHeight-side)/2);
  scanCv.width=SCAN_OUT; scanCv.height=SCAN_OUT;
  var cx=scanCv.getContext("2d",{willReadFrequently:true});
  cx.drawImage(v, ox,oy,side,side, 0,0,SCAN_OUT,SCAN_OUT);
  var code=jsQR(cx.getImageData(0,0,SCAN_OUT,SCAN_OUT).data,SCAN_OUT,SCAN_OUT);
  if(code&&code.data){
    scanSent=true;
    window.dispatchEvent(new CustomEvent("DMS_KPC_SCAN",{detail:{text:code.data}}));
    setTimeout(stopScanner, 300);
  }
}

function listCams(activeId){
  navigator.mediaDevices.enumerateDevices().then(function(devs){
    var sel=$id("sc-cams"); sel.innerHTML="";
    devs.filter(function(d){return d.kind=="videoinput"}).forEach(function(c,i){
      var o=document.createElement("option"); o.value=c.deviceId; o.textContent=c.label||("Cam "+(i+1));
      if(activeId==c.deviceId) o.selected=true;
      sel.appendChild(o);
    });
  });
}
function onCamChange(){ startScanner($id("sc-cams").value); }
function onZoom(el){
  if(!scanStream) return;
  var t=scanStream.getVideoTracks()[0];
  if(t.getCapabilities().zoom){
    t.applyConstraints({advanced:[{zoom:Math.min(Math.max(Number(el.value),1),3)}]});
  }
}
function toggleTorch(){
  if(!scanStream) return;
  var t=scanStream.getVideoTracks()[0];
  if(t.getCapabilities().torch){
    torchOn=!torchOn; t.applyConstraints({advanced:[{torch:torchOn}]});
  }
}
window.__SCANNER__ = { start: startScanner, stop: stopScanner };

/* AUTO LOGIN CHECK */
(function(){
  try{
    var s=sessionStorage.getItem("EUP_USER");
    if(s){ USER=JSON.parse(s); if(USER.nama) enterApp(); }
  }catch(e){}
})();
</script>
