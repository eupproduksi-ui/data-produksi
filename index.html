<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUP GUDANG TAIPA</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap');

/* Global Font untuk Konten */
body, #content, #content * { font-family: 'Merriweather', serif !important; font-size: 11px !important; }
body { background:#f4f6f9; margin:0; padding:0; min-height:100vh; }
.hidden { display:none!important }

/* Login Styles (Tetap di sini biar cepat muncul) */
#login-area{position:fixed;inset:0;background:linear-gradient(160deg,#bdbdbd,#7d7d7d);display:flex;align-items:center;justify-content:center;z-index:9999; font-family:Arial !important;}
.lg-card{width:90%;max-width:400px;background:rgba(255,255,255,0.9);padding:30px;border-radius:15px;text-align:center;}
.lg-input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px;font-size:16px !important;}
.lg-btn{width:100%;padding:12px;background:#333;color:#fff;border:none;border-radius:5px;font-size:16px !important;cursor:pointer;}

/* Container Utama */
#main-wrapper{ padding-top:60px; min-height:100vh; }
#content{ padding:15px; max-width:1200px; margin:0 auto; }

/* Scanner Styles (Tetap di sini) */
#sc-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10000;display:none;align-items:center;justify-content:center; font-family:Arial !important;}
#sc-modal.show{display:flex}
.sc-box{background:#fff;width:90%;max-width:500px;border-radius:10px;overflow:hidden;}
.sc-video{width:100%;display:block;background:#000;}
.sc-controls{padding:15px;}
.sc-btn{background:#1155cc;color:#fff;border:none;padding:10px;border-radius:5px;width:100%;margin-top:10px;font-size:16px !important;}
</style>
</head>
<body>

<!-- LOGIN (Static) -->
<div id="login-area">
  <div class="lg-card">
    <h2>EUP GUDANG TAIPA</h2>
    <input id="lg-user" class="lg-input" placeholder="Username">
    <input id="lg-pass" class="lg-input" type="password" placeholder="Password">
    <button class="lg-btn" onclick="doLogin()">LOGIN</button>
    <div id="lg-msg" style="color:red;margin-top:10px;font-size:12px !important;"></div>
  </div>
</div>

<!-- APP SHELL (Akan diisi oleh Server) -->
<div id="app-shell" class="hidden">
  <div id="header-container"></div> <!-- Header masuk sini -->
  <div id="sidebar-container"></div> <!-- Sidebar masuk sini -->
  
  <div id="main-wrapper">
    <main id="content"></main>
  </div>
</div>

<!-- SCANNER (Static) -->
<div id="sc-modal">
  <div class="sc-box">
    <div style="padding:10px;display:flex;justify-content:space-between;background:#eee;">
      <b>Scan QR</b> <span onclick="stopScanner()" style="cursor:pointer;">✕</span>
    </div>
    <video id="sc-video" playsinline autoplay muted class="sc-video"></video>
    <div class="sc-controls">
      <button class="sc-btn" onclick="stopScanner()">Tutup</button>
    </div>
  </div>
</div>

<script>
var API_URL="https://script.google.com/macros/s/AKfycbwzk6T_YFrgmHOp2N2JGG-s9YL0_Fkhf7z8zkwNU9HwSsLT0V_nM3paaAP1PRfn1LIlnw/exec";
var USER=null;

function $id(x){ return document.getElementById(x); }

function api(params, cb, fail){
  fetch(API_URL,{method:"POST",body:JSON.stringify(params)})
    .then(r=>r.json()).then(cb).catch(e=>{ if(fail) fail(e); });
}

/* === FUNGSI LOAD HEADER & SIDEBAR DARI SERVER === */
function loadShell(callback){
  // Ambil Header
  api({action:"getShellPart", name:"Header"}, function(resH){
    var htmlH = (resH&&resH.html) || "";
    $id("header-container").innerHTML = htmlH;
    
    // Ambil Sidebar
    api({action:"getShellPart", name:"Sidebar"}, function(resS){
      var htmlS = (resS&&resS.html) || "";
      $id("sidebar-container").innerHTML = htmlS;
      
      // Setelah keduanya loaded, jalankan callback
      if(callback) callback();
    });
  });
}

function doLogin(){
  var u=$id("lg-user").value, p=$id("lg-pass").value;
  if(!u||!p) return;
  api({action:"login",user:u,pass:p}, function(res){
    if(res && res.ok && res.data){ // Sesuaikan dengan format response login Anda
       // Asumsi response: {ok:true, data:{nama:"..."}} atau {ok:true, nama:"..."}
       var userData = res.data || res; 
       if(userData.nama){
         USER = userData;
         sessionStorage.setItem("EUP_USER", JSON.stringify(USER));
         enterApp();
       } else { $id("lg-msg").textContent="Login gagal"; }
    } else { $id("lg-msg").textContent="Login gagal"; }
  });
}

function enterApp(){
  $id("login-area").classList.add("hidden");
  $id("app-shell").classList.remove("hidden");
  
  // Load Header & Sidebar dari Apps Script dulu
  loadShell(function(){
    // Setelah header/sidebar muncul, baru set nama user & load dashboard
    if($id("user-nama")) $id("user-nama").textContent = USER.nama;
    loadPage("Dashboard");
  });
}

function logout(){
  sessionStorage.clear();
  location.reload();
}

/* === NAVIGASI === */
// Fungsi ini harus ada di global scope karena dipanggil oleh onclick di Sidebar.html
window.toggleSidebar = function(){
  var sb=$id("app-sidebar"), ov=$id("sidebar-overlay");
  if(sb.classList.contains("open")){ sb.classList.remove("open"); ov.classList.remove("show"); }
  else { sb.classList.add("open"); ov.classList.add("show"); }
};

window.loadPage = function(name){
  toggleSidebar(); // Tutup sidebar
  $id("content").innerHTML='<div style="padding:20px;text-align:center;">Memuat...</div>';
  
  // Cache logic (sama seperti sebelumnya)
  var key="EUP_HTML_"+name;
  try{
    var raw=sessionStorage.getItem(key);
    if(raw){ var c=JSON.parse(raw); if(c.html && (Date.now()-c.t)<300000){ injectPage(c.html, name); return; } }
  }catch(e){}

  api({action:"getPage",name:name}, function(res){
    var html=(res&&res.html)||(res&&res.data&&res.data.html);
    if(html){
      try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(),html:html})); }catch(e){}
      injectPage(html, name);
    }
  });
};

function injectPage(html, name){
  $id("content").innerHTML=html;
  var scripts=$id("content").querySelectorAll("script");
  for(var i=0;i<scripts.length;i++){
    var s=document.createElement("script");
    if(scripts[i].src) s.src=scripts[i].src; else s.text=scripts[i].textContent;
    document.body.appendChild(s);
  }
  setTimeout(function(){
    var fn=window["init_"+name]||window["init_"+name.toLowerCase()];
    if(fn) fn();
    
    // Fix tombol + (FAB)
    var fabs=document.querySelectorAll('.fp-fab,.dm-fab');
    for(var j=0;j<fabs.length;j++) fabs[j].style.cssText+="font-size:32px!important;font-family:Arial!important;";
  },200);
}

/* === SCANNER (Singkat) === */
var scanStream=null, scanTimer=null;
window.__SCANNER__ = {
  start: function(){
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
      scanStream=s; $id("sc-video").srcObject=s; $id("sc-modal").classList.add("show");
      scanTimer=setInterval(function(){
        // Logic scan sederhana (placeholder)
        // Di sini Anda butuh jsQR logic lengkap seperti sebelumnya
      }, 500);
    });
  },
  stop: function(){
    if(scanStream) scanStream.getTracks().forEach(t=>t.stop());
    clearInterval(scanTimer); $id("sc-modal").classList.remove("show");
  }
};
// Note: Saya ringkas scanner di sini biar kode tidak kepanjangan. 
// Pastikan logic jsQR lengkap tetap ada kalau mau scan beneran.
// Tapi untuk struktur Header/Sidebar terpisah, ini sudah cukup.

(function(){
  var s=sessionStorage.getItem("EUP_USER");
  if(s){ USER=JSON.parse(s); if(USER.nama) enterApp(); }
})();
</script>
</body>
</html>
