<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUP GUDANG TAIPA</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap');

/* === GLOBAL FONT: 11px MERRIWEATHER (Kecuali elemen yang dikecualikan) === */
*:not(.menu-btn):not(.fp-fab):not(.dm-fab):not(.sc-torch-btn):not(.lg-line svg) {
  font-family: 'Merriweather', serif !important;
  font-size: 11px !important;
}

body{background:#f4f6f9;min-height:100vh}
.hidden{display:none!important}
button{cursor:pointer;border:none;background:none}

/* LOGIN */
.lg-bg{position:fixed;inset:0;background:linear-gradient(160deg,#bdbdbd 0%,#969696 55%,#7d7d7d 100%);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.lg-card{width:400px;max-width:94%;background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.45) 100%);border:1px solid rgba(255,255,255,.65);border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.28);padding:34px 30px 24px;text-align:center;position:relative;overflow:hidden}
.lg-title{margin-bottom:28px; font-weight:bold;}
.lg-line{display:flex;align-items:center;gap:10px;border-bottom:1px solid #6f6f6f;margin-bottom:22px;padding:6px 2px}
.lg-line svg{width:14px;height:14px;fill:#4c4c4c;flex:0 0 auto}
.lg-line input{flex:1;border:none;outline:none;background:transparent!important;color:#2f2f2f;padding:6px 0;font-weight:bold}
.lg-btn{width:72%;margin:0 auto;background:#565656;color:#fff;border:none;border-radius:8px;padding:13px 0;font-weight:bold;letter-spacing:2px;cursor:pointer;display:block}
.lg-msg{color:#b00020;min-height:14px;margin-top:8px;font-weight:bold}
.lg-foot{margin-top:0;color:#4a4a4a;letter-spacing:1px;font-style:italic;font-weight:bold}

/* APP FRAME */
.app-header{position:sticky;top:0;z-index:50;background:#1155cc;color:#fff;display:flex;align-items:center;gap:14px;padding:12px 16px;height:50px}
/* === FIX 1: ICON MENU (GARIS 3) DIBESARKAN === */
.menu-btn{font-size:28px !important; line-height:1; color:#fff; padding:0 8px; font-family:Arial !important;} 
.header-title{font-weight:bold;letter-spacing:1px;flex:1;}
.user-badge{background:#0d3f92;border:1px solid #ffffff55;border-radius:20px;padding:6px 16px;font-weight:bold;}

/* === FIX 2: SIDEBAR Z-INDEX NAIK AGAR TIDAK DITUTUP HEADER === */
.sidebar{position:fixed;left:-260px;top:0;bottom:0;width:250px;background:#0d3f92;z-index:60;transition:.25s;overflow-y:auto; padding-top:60px;} 
.sidebar.open{left:0}
.sidebar a{display:block;color:#fff;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:none} /* Overlay di bawah sidebar(60) tapi di atas header(50) */
.overlay.show{display:block}
.main-content{flex:1;padding:16px;max-width:1200px;margin:auto;width:100%}
.boot-msg{padding:20px;color:#888;text-align:center}
.err-box{padding:20px;color:#c00;background:#ffebee;border:2px solid #c00;border-radius:8px;margin:20px}

/* SCANNER */
.sc-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.sc-modal.show{display:flex}
.sc-box{background:#fff;border-radius:10px;width:520px;max-width:100%;max-height:90vh;overflow:auto}
.sc-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #e3e7ee}
.sc-title{font-weight:bold;color:#112233;letter-spacing:.5px}
.sc-close{background:#eee;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer}
.sc-body{padding:12px}
.sc-video-wrap{position:relative;background:#000;border-radius:8px;overflow:hidden}
.sc-video{width:100%;max-height:66vh;display:block;object-fit:cover}
.sc-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sc-box-inner{position:relative;width:76%;max-width:380px;aspect-ratio:1/1;background:rgba(255,255,255,.06);box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.sc-corner{position:absolute;width:42px;height:42px;border:0 solid #fff}
.sc-tl{top:0;left:0;border-top-width:6px;border-left-width:6px}
.sc-tr{top:0;right:0;border-top-width:6px;border-right-width:6px}
.sc-bl{bottom:0;left:0;border-bottom-width:6px;border-left-width:6px}
.sc-br{bottom:0;right:0;border-bottom-width:6px;border-right-width:6px}
.sc-zoom{display:flex;align-items:center;gap:10px;margin-top:12px}
.sc-zoom input{flex:1}
.sc-zoom-lbl{font-weight:bold;color:#333;white-space:nowrap}
.sc-cam{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.sc-cam-lbl{font-weight:bold;color:#333;white-space:nowrap}
.sc-cam-sel{flex:1;min-width:140px;padding:8px;border:1px solid #cfd6e0;border-radius:6px;font-weight:bold}
.sc-cam-stop{background:none;border:none;color:#1155cc;font-weight:bold;cursor:pointer;white-space:nowrap}
.sc-torch{display:flex;justify-content:flex-end;margin-top:10px}
.sc-torch-btn{width:44px;height:44px;border-radius:10px;background:#2196f3;color:#fff;cursor:pointer; font-size:20px !important;}
</style>
</head>
<body>

<div id="login-area" class="lg-bg">
  <div class="lg-card">
    <div class="lg-title">EUP GUDANG TAIPA</div>
    <div class="lg-line">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.2 4.8-4.8S14.7 2.4 12 2.4 7.2 4.6 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      <input id="lg-user" placeholder="Username" autocomplete="username">
    </div>
    <div class="lg-line">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input id="lg-pass" type="password" placeholder="Password" autocomplete="current-password">
    </div>
    <button id="lg-btn" class="lg-btn" onclick="doLogin()">LOGIN</button>
    <div id="lg-msg" class="lg-msg"></div>
    <div class="lg-foot">&copy; EUP GUDANG TAIPA 2026</div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
    <div class="header-title">EUP GUDANG TAIPA</div>
    <div class="user-badge">&#128100; <span id="user-nama"></span></div>
  </header>
  <div style="position:relative;">
    <nav id="sidebar" class="sidebar">
      <a onclick="loadPage('Dashboard')">Dashboard</a>
      <a onclick="loadPage('FormProduksi')">Buku Produksi</a>
      <a onclick="loadPage('Dimensi')">Data Dimensi</a>
      <a onclick="logout()">Keluar</a>
    </nav>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
    <main id="content" class="main-content"></main>
  </div>
</div>

<!-- SCANNER -->
<div id="sc-modal" class="sc-modal">
  <div class="sc-box">
    <div class="sc-header">
      <div class="sc-title">Add KPC</div>
      <button class="sc-close" onclick="stopScanner()">&#10005;</button>
    </div>
    <div class="sc-body">
      <div class="sc-video-wrap">
        <video id="sc-video" playsinline autoplay muted class="sc-video"></video>
        <div class="sc-ov">
          <div class="sc-box-inner">
            <span class="sc-corner sc-tl"></span>
            <span class="sc-corner sc-tr"></span>
            <span class="sc-corner sc-bl"></span>
            <span class="sc-corner sc-br"></span>
          </div>
        </div>
      </div>
      <div class="sc-zoom">
        <input id="sc-zoom" type="range" min="1" max="3" step="0.1" value="1" oninput="onZoom(this)">
        <span id="sc-zoom-lbl" class="sc-zoom-lbl">1x zoom</span>
      </div>
      <div class="sc-cam">
        <span class="sc-cam-lbl">Select Camera (<span id="sc-cam-count">0</span>)</span>
        <select id="sc-cams" class="sc-cam-sel" onchange="onCamChange()"></select>
        <button class="sc-cam-stop" onclick="stopScanner()">Stop Scanning</button>
      </div>
      <div class="sc-torch">
        <button class="sc-torch-btn" onclick="toggleTorch()" title="Lampu senter">&#128294;</button>
      </div>
    </div>
  </div>
</div>

<script>
var API_URL="https://script.google.com/macros/s/AKfycbwzk6T_YFrgmHOp2N2JGG-s9YL0_Fkhf7z8zkwNU9HwSsLT0V_nM3paaAP1PRfn1LIlnw/exec";
var USER=null;
function $id(x){ return document.getElementById(x); }

function api(params, cb, fail){
  fetch(API_URL,{method:"POST",body:JSON.stringify(params)})
    .then(function(r){ return r.json(); })
    .then(cb)
    .catch(function(e){ if(fail) fail(e); });
}

function extractUser(res){
  if(!res) return null;
  if(res.ok===false) return null;
  var u=res.data||res.user||res;
  if(u && (u.nama||u.name)) return {nama:u.nama||u.name, role:u.role||u.level||""};
  return null;
}

function doLogin(){
  var u=$id("lg-user").value.trim();
  var p=$id("lg-pass").value;
  var msg=$id("lg-msg");
  var btn=$id("lg-btn");
  if(!u||!p){ msg.textContent="Username dan password wajib diisi."; return; }
  msg.textContent="Memproses...";
  btn.disabled=true;
  api({action:"login",user:u,pass:p}, function(res){
    btn.disabled=false;
    if(!res || res.ok===false){
      msg.textContent=(res && res.msg)? res.msg : "Login gagal. Periksa user/password.";
      return;
    }
    var user=extractUser(res);
    if(!user){ msg.textContent="Login gagal (data tidak valid)."; return; }
    USER=user;
    try{ sessionStorage.setItem("EUP_USER", JSON.stringify(user)); }catch(e){}
    enterApp();
  }, function(e){
    btn.disabled=false;
    msg.textContent="Error: "+(e && e.message ? e.message : "sambungan terputus.");
  });
}

function enterApp(){
  $id("user-nama").textContent=USER.nama;
  $id("login-area").classList.add("hidden");
  $id("app").classList.remove("hidden");
  loadPage("Dashboard");
}

function logout(){
  USER=null;
  try{
    sessionStorage.removeItem("EUP_USER");
    var ks=[]; for(var i=0;i<sessionStorage.length;i++){ var k=sessionStorage.key(i); if(k && k.indexOf("EUP_HTML_")===0) ks.push(k); }
    ks.forEach(function(k){ sessionStorage.removeItem(k); });
  }catch(e){}
  $id("app").classList.add("hidden");
  $id("login-area").classList.remove("hidden");
  $id("lg-pass").value="";
  $id("lg-msg").textContent="";
}

function toggleSidebar(){
  var sb=$id("sidebar"), ov=$id("overlay");
  sb.classList.toggle("open");
  ov.classList.toggle("show", sb.classList.contains("open"));
}

function inject(html, el){
  el.innerHTML=html;
  var scripts=el.querySelectorAll("script");
  for(var i=scripts.length-1;i>=0;i--){
    var old=scripts[i], nw=document.createElement("script");
    if(old.src) nw.src=old.src; else nw.text=old.textContent||old.innerText;
    document.body.appendChild(nw);
    if(old.parentNode) old.parentNode.removeChild(old);
  }
  
  // === FIX 3: PASTIKAN TOMBOL FAB (+) UKURANNYA KEMBALI NORMAL SETELAH INJEKSI ===
  setTimeout(function(){
    var fabs = document.querySelectorAll('.fp-fab, .dm-fab');
    for(var j=0; j<fabs.length; j++){
      fabs[j].style.fontSize = '32px';
      fabs[j].style.fontFamily = 'Arial';
      fabs[j].style.lineHeight = '1';
    }
  }, 200);
}

var PAGE_TTL=300000;
function pageCacheKey(n){ return "EUP_HTML_"+n; }
function clearPageCache(name){ try{ sessionStorage.removeItem(pageCacheKey(name)); }catch(e){} }
function getPageHtml(name, cb, fail){
  var key=pageCacheKey(name);
  try{
    var raw=sessionStorage.getItem(key);
    if(raw){ var c=JSON.parse(raw); if(c && c.html && (Date.now()-c.t)<PAGE_TTL){ cb(c.html); return; } }
  }catch(e){}
  api({action:"getPage",name:name}, function(res){
    var html=(res&&res.html)||(res&&res.data&&res.data.html)||null;
    if(!html){ fail("Apps Script tidak mengirim halaman — kemungkinan deployment belum di-New version."); return; }
    try{ sessionStorage.setItem(key, JSON.stringify({t:Date.now(),html:html})); }catch(e){}
    cb(html);
  }, function(e){ fail(e && e.message ? e.message : "sambungan terputus."); });
}
function loadPage(name){
  $id("sidebar").classList.remove("open");
  $id("overlay").classList.remove("show");
  $id("content").innerHTML='<div class="boot-msg">Memuat '+name+'...</div>';
  getPageHtml(name, function(html){
    inject(html, $id("content"));
    setTimeout(function(){
      var fn=window["init_"+name]||window["init_"+name.toLowerCase()]||window["init_"+name.toUpperCase()];
      if(fn){ try{ fn(); }catch(e){ alert("Init "+name+" error:\n"+e.message); } }
    },150);
  }, function(msg){
    $id("content").innerHTML='<div class="err-box"><b>GAGAL MEMUAT: '+name+'</b><br>'+msg+
      '<br><button onclick="clearPageCache(\''+name+'\');loadPage(\''+name+'\')">COBA LAGI</button></div>';
  });
}

var scanStream=null, scanTimer=null, scanSent=false, torchOn=false, scanCv=null;
var SCAN_OUT=700;
var SCAN_CROP=0.74;
var SCAN_MS=250;

function startScanner(deviceId){
  stopScanner(true);
  scanSent=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Browser tidak mendukung kamera."); return; }
  var vid={width:{ideal:1280},height:{ideal:720}};
  if(deviceId){ vid.deviceId={exact:deviceId}; } else { vid.facingMode="environment"; }
  navigator.mediaDevices.getUserMedia({video:vid,audio:false})
    .then(function(stream){
      scanStream=stream;
      var v=$id("sc-video");
      v.srcObject=stream; v.play();
      if(!scanCv) scanCv=document.createElement("canvas");
      listCams(deviceId||null);
      $id("sc-modal").classList.add("show");
      scanTimer=setInterval(scanTick,SCAN_MS);
    })
    .catch(function(e){ alert("Kamera tidak bisa dibuka: "+e.message); });
}

function stopScanner(keepModal){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  if(scanStream){ scanStream.getTracks().forEach(function(t){ t.stop(); }); scanStream=null; }
  var v=$id("sc-video"); if(v){ v.srcObject=null; }
  torchOn=false;
  if(!keepModal) $id("sc-modal").classList.remove("show");
}

function scanTick(){
  if(scanSent||!scanStream||typeof jsQR==="undefined") return;
  var v=$id("sc-video");
  if(!v||!v.videoWidth||v.readyState<2) return;
  var vw=v.videoWidth, vh=v.videoHeight;
  var side=Math.floor(Math.min(vw,vh)*SCAN_CROP);
  var ox=Math.floor((vw-side)/2), oy=Math.floor((vh-side)/2);
  scanCv.width=SCAN_OUT; scanCv.height=SCAN_OUT;
  var cx=scanCv.getContext("2d",{willReadFrequently:true});
  cx.drawImage(v, ox,oy,side,side, 0,0,SCAN_OUT,SCAN_OUT);
  var img=cx.getImageData(0,0,SCAN_OUT,SCAN_OUT);
  var code=null;
  try{ code=jsQR(img.data,SCAN_OUT,SCAN_OUT); }catch(e){}
  if(code&&code.data){
    scanSent=true;
    var txt=code.data;
    window.dispatchEvent(new CustomEvent("DMS_KPC_SCAN",{detail:{text:txt}}));
    setTimeout(function(){ stopScanner(); },350);
  }
}

function listCams(activeId){
  if(!navigator.mediaDevices.enumerateDevices) return;
  navigator.mediaDevices.enumerateDevices().then(function(devs){
    var cams=devs.filter(function(d){ return d.kind==="videoinput"; });
    var sel=$id("sc-cams"), cnt=$id("sc-cam-count");
    if(cnt) cnt.textContent=cams.length;
    sel.innerHTML="";
    cams.forEach(function(c,i){
      var o=document.createElement("option");
      o.value=c.deviceId;
      o.textContent=(c.label||("camera "+(i+1)));
      if(activeId&&c.deviceId===activeId) o.selected=true;
      sel.appendChild(o);
    });
  }).catch(function(){});
}

function onCamChange(){ startScanner($id("sc-cams").value); }

function onZoom(el){
  var lbl=$id("sc-zoom-lbl");
  if(lbl) lbl.textContent=Number(el.value).toFixed(1).replace(/\.0$/,"")+"x zoom";
  if(!scanStream) return;
  var t=scanStream.getVideoTracks()[0];
  if(!t||!t.getCapabilities) return;
  var cap=t.getCapabilities();
  if(cap&&cap.zoom){
    var z=Math.min(Math.max(Number(el.value),cap.zoom.min||1),cap.zoom.max||1);
    try{ t.applyConstraints({advanced:[{zoom:z}]}); }catch(e){}
  }
}

function toggleTorch(){
  if(!scanStream) return;
  var t=scanStream.getVideoTracks()[0];
  if(!t||!t.getCapabilities) return;
  var cap=t.getCapabilities();
  if(!cap||!cap.torch){ alert("Lampu senter tidak didukung perangkat ini."); return; }
  torchOn=!torchOn;
  try{ t.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){}
}

window.__SCANNER__ = { start: startScanner, stop: stopScanner };

(function(){
  try{
    var s=sessionStorage.getItem("EUP_USER");
    if(s){ USER=JSON.parse(s); if(USER&&USER.nama){ enterApp(); return; } }
  }catch(e){}
  USER=null;
})();
</script>
</body>
</html>
