<style>
.fp-card,.fp-crumb button,.fp-frow label,.fp-frow input,.fp-frow select,.fp-th,.fp-td,.fp-merge,.fp-primary,.fp-outline,.fp-green,.fp-gray,.fp-addbtn,.fp-fab,.fp-det-no,.fp-kpc,.fp-inf,.fp-inf b,.fp-mesin-card,.fp-bulan,.fp-tgl-row .t,.fp-tgl-row .tot,.fp-ckrow,.fp-note,.fp-modal-box h3,.fp-modal-box p,.fp-cellin,.fp-crumb span{font-weight:bold;}

.fp-crumb{display:flex;align-items:center;gap:12px;margin-bottom:14px}

.fp-cellin{width:90px;padding:4px 6px;border:1px solid #1155cc;border-radius:4px;font-size:14px;text-align:center;background:#fff}

.fp-icobtn{flex:0 0 auto;width:46px;height:42px;background:#fff;border:1px solid #dfe4ec;border-radius:8px;font-size:19px;color:#1155cc;cursor:pointer;font-weight:bold;line-height:1}

.fp-qrrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}

.fp-kpc{font-weight:bold;font-size:16px;margin:0}
.fp-inf{font-size:14px;margin-bottom:6px}
.fp-inf b{display:inline-block;width:110px;color:#555;font-weight:bold}
.fp-modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.fp-modal-box{background:#fff;border-radius:10px;width:760px;max-width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative}
.fp-modal-box h3{color:#1155cc;font-size:20px;margin:0 0 4px}
.fp-modal-box p{color:#666;font-size:13px;margin:0 0 12px}
.fp-x{position:absolute;top:14px;right:14px;background:#eee;border:none;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;z-index:5}
.fp-ckrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e3e7ee;border-radius:6px;padding:12px 14px;margin-bottom:8px;font-weight:bold;cursor:pointer}
.fp-ckrow input{width:22px;height:22px;accent-color:#1155cc}

.fp-print-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.fp-errbar{position:fixed;left:0;right:0;bottom:0;background:#c00;color:#fff;padding:10px 14px;z-index:130;display:flex;gap:8px;align-items:center;font-weight:bold}
.fp-errbar span{flex:1;font-size:13px}
.fp-errbar button{background:#fff;color:#c00;border:none;border-radius:6px;padding:8px 12px;font-weight:bold;cursor:pointer}
@media (max-width:700px){
  .fp-frow{flex-wrap:wrap;gap:8px}

}
</style>

<script>
var fpMESIN=null, fpKEY=null, fpROWS=[], fpSTRUCT=null, fpDATA={}, fpCOIL="";
var fpCARDS=[], fpEDIT=null, fpPRINTCARD=null, fpPRINTCOLS={};
var fpCACHE={}, fpLAST=null;
function fpFmt(n){ return Number(n||0).toLocaleString("id-ID"); }
function fpEl(id){ return document.getElementById(id); }

/* ===== CACHE 5 MENIT ===== */
function fpCacheGet(k){ var c=fpCACHE[k]; if(!c) return null; if(Date.now()-c.t>300000){ delete fpCACHE[k]; return null; } return c.v; }
function fpCacheSet(k,v){ fpCACHE[k]={t:Date.now(),v:v}; }
function fpCacheClearMachine(m){
  for(var k in fpCACHE){ if(k.indexOf("tgl:"+m)===0 || k.indexOf("det:"+m)===0){ delete fpCACHE[k]; } }
}

/* ===== ERROR BAR + COBA LAGI + CADANGAN ===== */
function fpShowErr(msg){
  fpEl("fp-errtxt").textContent=msg;
  fpEl("fp-errbar").classList.remove("hidden");
}
function fpHideErr(){ fpEl("fp-errbar").classList.add("hidden"); }
function fpRetry(){ fpHideErr(); if(fpLAST){ fpRun(fpLAST.fn, fpLAST.arg, fpLAST.cb); } }
function fpBackup(){ window.open(API_URL, "_blank"); }

/* ===== PEMANGGIL API ===== */
function fpRun(fn, arg, cb){
  fpLAST={fn:fn,arg:arg,cb:cb};
  var params={action:fn};
  if(fn==="getProduk"){ params.tipe=arg[0]; }
  if(fn==="getNextNo"){ params.mesin=arg[0]; params.iso=arg[1]; }
  if(fn==="getListTanggal"){ params.mesin=arg[0]; }
  if(fn==="getDetail"){ params.mesin=arg[0]; params.key=arg[1]; }
  if(fn==="simpanPaket"){ params.p=arg[0]; }
  if(fn==="updatePaket"){ params.p=arg[0]; params.key=arg[1]; params.no=arg[2]; }
  if(fn==="hapusPaket"){ params.mesin=arg[0]; params.key=arg[1]; params.no=arg[2]; }
  fetch(API_URL,{method:"POST",body:JSON.stringify(params)})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok===false){ fpShowErr(res.msg||"Gagal memproses."); return; }
      if(res && res.ok===true && res.data!==undefined){ cb(res.data); return; }
      cb(res);
    })
    .catch(function(e){ fpShowErr("Sambungan data terputus. Coba lagi atau buka cadangan."); });
}

/* ===== QR LOKAL (CEPAT, TANPA SERVER LUAR) ===== */
function fpMakeQr(text, px){
  if(typeof qrcode==="undefined") return null;
  try{
    var qr=qrcode(0,"M");
    qr.addData(text); qr.make();
    var n=qr.getModuleCount(), quiet=2, total=n+quiet*2;
    var scale=Math.max(1, Math.floor(px/total));
    var cv=document.createElement("canvas");
    cv.width=total*scale; cv.height=total*scale;
    var x=cv.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,cv.width,cv.height);
    x.fillStyle="#000";
    for(var r=0;r<n;r++){ for(var c=0;c<n;c++){ if(qr.isDark(r,c)) x.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale); } }
    return cv;
  }catch(e){ return null; }
}
function fpQrDrawable(c, px, cb){
  if(c._qrcv){ cb(c._qrcv); return; }
  var cv=fpMakeQr(c.kpc, px);
  if(cv){ c._qrcv=cv; cb(cv); return; }
  var im=new Image();
  im.crossOrigin="anonymous";
  im.onload=function(){ cb(im); };
  im.onerror=function(){ cb(null); };
  im.src="https://api.qrserver.com/v1/create-qr-code/?size="+px+"x"+px+"&data="+encodeURIComponent(c.kpc);
}

function fpShow(v){
  ["fp-view-mesin","fp-view-tanggal","fp-view-form","fp-view-detail"].forEach(function(x){ fpEl(x).classList.add("hidden"); });
  fpEl(v).classList.remove("hidden");
}
function fpBack(){
  if(!fpEl("fp-view-mesin").classList.contains("hidden")) return;
  if(!fpEl("fp-view-detail").classList.contains("hidden")) fpGoTanggal();
  else if(!fpEl("fp-view-form").classList.contains("hidden")) fpGoTanggal();
  else fpGoMesin();
}
window.init_formproduksi=function(){ fpGoMesin(); };
window.init_FormProduksi=function(){ fpGoMesin(); };

function fpSetNum(el,col,i){ el.value=el.value.replace(/[^0-9]/g,""); fpDATA[col][i]=el.value; }
function fpSetNum1(el,k){ el.value=el.value.replace(/[^0-9]/g,""); if(k==="coil"){ fpCOIL=el.value; } else { fpDATA[k]=el.value; } }

function fpGoMesin(){
  fpMESIN=null; fpEl("fp-crumb").textContent="BUKU PRODUKSI"; fpShow("fp-view-mesin");
  var c=fpCacheGet("mesin");
  if(c){ fpRenderMesin(c); return; }
  fpRun("getMesin",[],function(list){ fpCacheSet("mesin",list); fpRenderMesin(list); });
}
function fpRenderMesin(list){
  if(!list || !list.length){ fpEl("fp-mesin-grid").innerHTML='<div class="fp-card">Master mesin kosong - isi sheet MASTER_MESIN.</div>'; return; }
  fpEl("fp-mesin-grid").innerHTML=list.map(function(m){
    return '<div class="fp-mesin-card" onclick="fpOpenMesin(\''+m+'\')">'+m+'</div>';
  }).join("");
}
function fpOpenMesin(m){ fpMESIN=m; fpGoTanggal(); }

function fpGoTanggal(){
  fpEl("fp-crumb").textContent=fpMESIN; fpShow("fp-view-tanggal");
  var ck="tgl:"+fpMESIN;
  var c=fpCacheGet(ck);
  if(c){ fpRenderTanggal(c); return; }
  fpRun("getListTanggal",[fpMESIN],function(list){ fpCacheSet(ck,list); fpRenderTanggal(list); });
}
function fpRenderTanggal(list){
  var html="", bl="";
  list.forEach(function(x){
    if(x.bulan!==bl){ bl=x.bulan; html+='<div class="fp-bulan">'+bl+'</div>'; }
    html+='<div class="fp-tgl-row" onclick="fpOpenDetail(\''+x.key+'\')"><span class="t">'+x.tgl+
          '</span><span class="tot">Total: '+fpFmt(x.total)+'</span><span class="chev">&#10095;</span></div>';
  });
  fpEl("fp-tgl-list").innerHTML=html||'<div class="fp-card">Belum ada data produksi.</div>';
}

function fpOpenForm(){
  fpEDIT=null;
  fpEl("fp-crumb").textContent=fpMESIN; fpShow("fp-view-form");
  fpResetForm();
  fpEl("fp-op").value = USER ? USER.nama : "-";
  fpEl("fp-mesin").value = fpMESIN;
  fpRun("getProduk",[(fpMESIN.indexOf("RENG")>=0?"RENG":"TRUSS")],function(list){
    fpEl("fp-produk").innerHTML='<option value="">Pilih Produk</option>';
    list.forEach(function(p){ fpEl("fp-produk").innerHTML+='<option>'+p+'</option>'; });
  });
}
function fpRefreshNo(){ fpRun("getNextNo",[fpMESIN,fpEl("fp-tgl").value],function(n){ fpEl("fp-no").value=n; }); }

function fpResetData(){
  fpDATA={ inputan:"", nonPrime:"", prime:[""], rijekCoil:[""], rijekMesin:[""], scrap:[""] };
  fpCOIL="";
}
function fpResetForm(){
  fpROWS=[];
  fpEDIT=null;
  fpResetData();
  fpEl("fp-summary").innerHTML="";
  fpEl("fp-produk").innerHTML='<option value="">Pilih Produk</option>';
  fpEl("fp-kpc").value="";
  fpEl("fp-coil").value="";
  fpEl("fp-tgl").value=new Date().toISOString().slice(0,10);
  fpRefreshNo();
}

function fpRenderModal(){
  var multi=[["prime","PRIME"],["rijekCoil","RIJEK COIL"],["rijekMesin","RIJEK MESIN"],["scrap","SCRAP"]];
  var h="";
  h+='<div class="fp-frow"><label>INPUTAN</label><input type="text" inputmode="numeric" value="'+fpDATA.inputan+'" oninput="fpSetNum1(this,\'inputan\')" onchange="fpSetNum1(this,\'inputan\')"><span class="fp-gap"></span></div>';
  multi.forEach(function(m){
    var col=m[0];
    fpDATA[col].forEach(function(v,i){
      if(i===0){
        h+='<div class="fp-frow"><label>'+m[1]+'</label><input type="text" inputmode="numeric" value="'+v+'" oninput="fpSetNum(this,\''+col+'\','+i+')" onchange="fpSetNum(this,\''+col+'\','+i+')"><button type="button" class="fp-addbtn" onclick="fpAddVal(\''+col+'\')">+</button></div>';
      } else {
        h+='<div class="fp-frow"><label></label><input type="text" inputmode="numeric" value="'+v+'" oninput="fpSetNum(this,\''+col+'\','+i+')" onchange="fpSetNum(this,\''+col+'\','+i+')"><span class="fp-gap"></span></div>';
      }
    });
  });
  h+='<div class="fp-frow"><label>NON PRIME</label><input type="text" inputmode="numeric" value="'+fpDATA.nonPrime+'" oninput="fpSetNum1(this,\'nonPrime\')" onchange="fpSetNum1(this,\'nonPrime\')"><span class="fp-gap"></span></div>';
  fpEl("fp-modal-rows").innerHTML=h;
}
function fpAddVal(col){ fpDATA[col].push(""); fpRenderModal(); }
function fpOpenModal(){ fpResetData(); fpEl("fp-modal").classList.remove("hidden"); fpRenderModal(); }
function fpCloseModal(){ fpEl("fp-modal").classList.add("hidden"); }
function fpSimpanInputan(){
  var inp=Number(fpDATA.inputan)||0;
  if(inp<=0){ alert("INPUTAN harus lebih dari 0"); return; }
  var maxLen=Math.max(fpDATA.prime.length, fpDATA.rijekCoil.length, fpDATA.rijekMesin.length, fpDATA.scrap.length, 1);
  var rows=[];
  for(var i=0;i<maxLen;i++){
    rows.push({
      inputan:  (i===0)? inp : 0,
      prime:    Number(fpDATA.prime[i])||0,
      rijekCoil:Number(fpDATA.rijekCoil[i])||0,
      rijekMesin:Number(fpDATA.rijekMesin[i])||0,
      scrap:    Number(fpDATA.scrap[i])||0,
      nonPrime: (i===0)? (Number(fpDATA.nonPrime)||0) : 0
    });
  }
  fpROWS = fpROWS.concat(rows);
  fpCloseModal(); fpRenderSummary();
}

var fpIKOLS=[{k:"inputan",l:"INPUTAN"},{k:"prime",l:"PRIME"},{k:"rijekCoil",l:"RIJEK COIL"},{k:"rijekMesin",l:"RIJEK MESIN"},{k:"scrap",l:"SCRAP"},{k:"nonPrime",l:"NON PRIME"}];
function fpTotals(rows){
  var t=0,tm=0,tp=0;
  rows.forEach(function(r){
    var i=Number(r.inputan)||0, np=Number(r.nonPrime)||0;
    t+=i;
    tm+=i+np;
    tp+=(Number(r.prime)||0)+(Number(r.rijekCoil)||0)+(Number(r.rijekMesin)||0)+(Number(r.scrap)||0);
  });
  return {t:t,tm:tm,tp:tp};
}

function fpMergedTable(rows, editable){
  var tot=fpTotals(rows);
  var vis=fpIKOLS.filter(function(c){ return rows.some(function(r){ return Number(r[c.k])||0; }); });
  var sessions=[];
  rows.forEach(function(r,ri){
    if(Number(r.inputan)>0 || sessions.length===0){ sessions.push([{ri:ri,r:r}]); }
    else { sessions[sessions.length-1].push({ri:ri,r:r}); }
  });
  var phys=[];
  sessions.forEach(function(sess,si){
    sess.forEach(function(item,i){
      if(i>0){
        var adaIsi=vis.some(function(c){ return Number(item.r[c.k])||0; });
        if(!adaIsi) return;
      }
      phys.push({ no:(i===0)? (si+1) : "", ri:item.ri, row:item.r });
    });
  });
  var head='<tr><th class="fp-th">NO</th>'+vis.map(function(c){ return '<th class="fp-th">'+c.l+'</th>'; }).join("")+
           '<th class="fp-th">TOTAL</th><th class="fp-th">TOTAL MAX</th><th class="fp-th">TOTAL POTONGAN</th></tr>';
  var body="";
  phys.forEach(function(p,idx){
    body+='<tr><td class="fp-td">'+p.no+'</td>';
    body+=vis.map(function(c){
      var v=Number(p.row[c.k])||0;
      if(editable){
        return '<td class="fp-td fp-edit" onclick="fpEditCell(this,'+p.ri+',\''+c.k+'\')">'+(v? fpFmt(v) : '')+'</td>';
      }
      return '<td class="fp-td">'+(v? fpFmt(v) : '')+'</td>';
    }).join("");
    if(idx===0){
      body+='<td class="fp-merge" rowspan="'+phys.length+'">'+fpFmt(tot.t)+'</td>'+
            '<td class="fp-merge" rowspan="'+phys.length+'">'+fpFmt(tot.tm)+'</td>'+
            '<td class="fp-merge" rowspan="'+phys.length+'">'+fpFmt(tot.tp)+'</td>';
    }
    body+='</tr>';
  });
  if(!phys.length){
    body='<tr><td class="fp-td" colspan="'+(vis.length+4)+'">Belum ada inputan</td></tr>';
  }
  return '<table class="fp-table">'+head+body+'</table>';
}
function fpRenderSummary(){ fpEl("fp-summary").innerHTML=fpMergedTable(fpROWS, true); }

function fpEditCell(td, ri, col){
  if(td.getElementsByTagName("input").length) return;
  var cur=Number(fpROWS[ri][col])||0;
  td.innerHTML='<input class="fp-cellin" type="text" inputmode="numeric" value="'+(cur? cur : "")+'">';
  var inp=td.getElementsByTagName("input")[0];
  inp.focus();
  inp.select();
  var selesai=function(){
    var val=Number(inp.value.replace(/[^0-9]/g,""))||0;
    fpROWS[ri][col]=val;
    fpRenderSummary();
  };
  inp.onblur=selesai;
  inp.onkeydown=function(ev){ if(ev.key==="Enter"){ inp.blur(); } };
  inp.onclick=function(ev){ ev.stopPropagation(); };
}

function fpSimpan(){
  if(!fpEl("fp-produk").value){ alert("Pilih produk dulu"); return; }
  if(!fpROWS.length){ alert("Klik + TAMBAH untuk isi inputan"); return; }
  fpCOIL=(fpEl("fp-coil").value||"").replace(/[^0-9]/g,"");
  var p={ mesin:fpMESIN, tanggal:fpEl("fp-tgl").value, operator:(USER?USER.nama:"-"),
          produk:fpEl("fp-produk").value, kpc:fpEl("fp-kpc").value,
          panjangCoil:fpCOIL, rows:fpROWS };
  if(fpEDIT){
    var keyEd=fpEDIT.key, noEd=fpEDIT.no;
    fpRun("updatePaket",[p,keyEd,noEd],function(r){
      if(!r.ok){ alert(r.msg); return; }
      fpCacheClearMachine(fpMESIN);
      alert("DATA DIPERBARUI");
      fpResetForm();
      fpOpenDetail(keyEd);
    });
    return;
  }
  fpRun("simpanPaket",[p],function(r){
    if(!r.ok){ alert(r.msg); return; }
    fpCacheClearMachine(fpMESIN);
    alert("DATA TERSIMPAN");
    fpResetForm();
    fpGoTanggal();
  });
}

function fpEditCard(idx){
  var c=fpCARDS[idx]; if(!c) return;
  fpEDIT={ key: fpKEY, no: c.no };
  fpShow("fp-view-form");
  fpEl("fp-crumb").textContent=fpMESIN;
  fpEl("fp-op").value = USER ? USER.nama : "-";
  fpEl("fp-mesin").value = fpMESIN;
  fpEl("fp-tgl").value = fpKEY;
  fpEl("fp-no").value = c.no;
  fpEl("fp-kpc").value = c.kpc||"";
  fpEl("fp-coil").value = c.panjangCoil||"";
  fpCOIL = String(c.panjangCoil||"");
  fpROWS = (c.inputs||[]).map(function(r){
    return { inputan:r.inputan, prime:r.prime, rijekCoil:r.rijekCoil, rijekMesin:r.rijekMesin, scrap:r.scrap, nonPrime:r.nonPrime };
  });
  fpRun("getProduk",[(fpMESIN.indexOf("RENG")>=0?"RENG":"TRUSS")],function(list){
    fpEl("fp-produk").innerHTML='<option value="">Pilih Produk</option>';
    list.forEach(function(p){ fpEl("fp-produk").innerHTML+='<option'+(p===c.produk?' selected':'')+'>'+p+'</option>'; });
  });
  fpRenderSummary();
}

function fpGaleri(){ fpEl("fp-file").click(); }
function fpOnFile(inp){
  var f=inp.files && inp.files[0];
  inp.value="";
  if(!f || !fpPRINTCARD) return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      fpPRINTCARD._fotoImg=img;
      fpPRINTCARD._fotoSrc=rd.result;
      fpEl("fp-foto-info").innerHTML=
        '<img src="'+rd.result+'" style="width:64px;height:64px;object-fit:cover;border:1px solid #cfd6e0;border-radius:6px;vertical-align:middle;margin-right:10px">'+
        '<span>Foto terpilih - akan dicetak HORIZONTAL di bawah footer.</span>';
      fpEl("fp-foto-info").classList.remove("hidden");
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}

/* ===== CANVAS PNG: SEMUA TEKS UTAMA = UKURAN JUDUL (32px) ===== */
function fpDrawCanvas(c, cols, useTotal, phys, qr, foto){
  var F=32;
  var names=["NOR"].concat(cols.map(function(z){ return z.l; })).concat(useTotal?["TOTAL"]:[]);
  var nc=names.length;
  var M=40;
  var W=Math.max(1000, nc*240+M*2);
  var CW=W-M*2, colW=CW/nc;
  var rowH=56, headH=56, lineH=44, infoLines=4;
  var qrSize=120;
  var yTop=80;
  var infoStart=yTop+qrSize+20;
  var tableY=infoStart+infoLines*lineH+14;
  var bt=tableY+headH, bh=phys.length*rowH;
  var yLine=bt+bh+22;
  var dw=0, dh=0;
  if(foto){ dw=CW; dh=Math.round(CW*2/5); }
  var H=yLine + (foto && dh>0 ? (34+dh+20) : 46);
  var cv=document.createElement("canvas");
  cv.width=W; cv.height=H;
  var x=cv.getContext("2d");
  x.fillStyle="#f7fafc"; x.fillRect(0,0,W,H);
  x.textBaseline="middle";
  x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif"; x.textAlign="center";
  x.fillText("DATA PRODUKSI EUP GUDANG TAIPA 2026", W/2, 40);
  x.fillStyle="#1155cc"; x.fillRect(M, 62, CW, 5);
  if(qr){ try{ x.drawImage(qr, M, yTop, qrSize, qrSize); }catch(e){} }
  x.fillStyle="#112233"; x.font="bold 30px Arial, sans-serif"; x.textAlign="left";
  x.fillText(c.kpc||"-", M+qrSize+24, yTop+qrSize/2);
  x.fillStyle="#1155cc"; x.font="bold 22px Arial, sans-serif"; x.textAlign="right";
  x.fillText("[NO "+c.no+"]", W-M, yTop+20);
  var inf=[["Tanggal",c.tanggal],["Operator",c.operator],["Mesin",c.mesin],["Produk",c.produk]];
  x.textAlign="left";
  inf.forEach(function(row,i){
    x.fillStyle="#334455"; x.font="bold "+F+"px Arial, sans-serif";
    x.fillText(row[0], M, infoStart+i*lineH+lineH/2);
    x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif";
    x.fillText(": "+(row[1]||""), M+230, infoStart+i*lineH+lineH/2);
  });
  x.fillStyle="#1155cc"; x.fillRect(M, tableY, CW, headH);
  x.fillStyle="#fff"; x.font="bold "+F+"px Arial, sans-serif"; x.textAlign="center";
  names.forEach(function(nm,i){ x.fillText(nm, M+colW*i+colW/2, tableY+headH/2); });
  x.fillStyle="#fff"; x.fillRect(M, bt, CW, bh);
  var totalX = useTotal ? M+colW*(nc-1) : null;
  x.strokeStyle="#cfd6e0"; x.lineWidth=1;
  for(var r=0;r<=phys.length;r++){
    var yy=bt+r*rowH;
    x.beginPath(); x.moveTo(M, yy); x.lineTo(useTotal? totalX : M+CW, yy); x.stroke();
  }
  for(var i2=0;i2<=nc;i2++){
    var xx=M+colW*i2;
    x.beginPath(); x.moveTo(xx, bt); x.lineTo(xx, bt+bh); x.stroke();
  }
  x.strokeRect(M, tableY, CW, headH+bh);
  x.fillStyle="#112233"; x.font="bold "+F+"px Arial, sans-serif"; x.textAlign="center";
  phys.forEach(function(p,ri){
    var cy=bt+ri*rowH+rowH/2;
    x.fillText(String(p.no), M+colW/2, cy);
    cols.forEach(function(z,ci){
      var v=Number(p.row[z.k])||0;
      x.fillText(v? fpFmt(v) : "", M+colW*(ci+1)+colW/2, cy);
    });
  });
  if(useTotal){
    x.fillStyle="#1155cc"; x.font="bold "+F+"px Arial, sans-serif";
    x.fillText(fpFmt(c.total), totalX+colW/2, bt+bh/2);
  }
  x.strokeStyle="#99aabb"; x.beginPath(); x.moveTo(M, yLine); x.lineTo(W-M, yLine); x.stroke();
  x.fillStyle="#334455"; x.font="italic bold 20px Arial, sans-serif"; x.textAlign="center";
  x.fillText("\u00A9 EUP GUDANG TAIPA 2026", W/2, yLine+20);
  if(foto && dw>0 && dh>0){
    var py=yLine+34;
    var px=(W-dw)/2;
    var fw=foto.naturalWidth||foto.width, fh=foto.naturalHeight||foto.height;
    if(fw>0 && fh>0){
      var rt=dw/dh, sx=0, sy=0, sw=fw, sh=fh;
      if(fw/fh > rt){ sw=fh*rt; sx=(fw-sw)/2; }
      else { sh=fw/rt; sy=(fh-sh)/2; }
      try{
        x.drawImage(foto, sx, sy, sw, sh, px, py, dw, dh);
        x.strokeStyle="#cfd6e0"; x.strokeRect(px, py, dw, dh);
      }catch(e){}
    }
  }
  return cv;
}

function fpBuildPrintPNG(cb){
  var c=fpPRINTCARD; if(!c){ alert("Tidak ada data untuk dicetak"); return; }
  var cols=fpIKOLS.filter(function(z){ return fpPRINTCOLS[z.k] && z.k!=="nonPrime"; });
  var useTotal=!!fpPRINTCOLS["total"];
  var sessions=[];
  (c.inputs||[]).forEach(function(r){
    if(Number(r.inputan)>0 || sessions.length===0){ sessions.push([r]); }
    else { sessions[sessions.length-1].push(r); }
  });
  var phys=[];
  sessions.forEach(function(ss2,si){
    ss2.forEach(function(r,i){ phys.push({ no:(i===0)?(si+1):"", row:r }); });
  });
  if(!phys.length){ phys=[{no:1,row:{}}]; }
  var foto=(c._fotoImg && c._fotoImg.complete && c._fotoImg.naturalWidth>0)? c._fotoImg : null;
  if(c.kpc){
    fpQrDrawable(c, 240, function(qr){ cb(fpDrawCanvas(c, cols, useTotal, phys, qr, foto)); });
  } else {
    cb(fpDrawCanvas(c, cols, useTotal, phys, null, foto));
  }
}

function fpNamaFile(){
  var c=fpPRINTCARD;
  return (fpMESIN||"DATA")+" ("+(c? c.no : "")+").png";
}
function fpSaveBlob(blob, name){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },5000);
}
function fpDoDownload(){
  fpBuildPrintPNG(function(cv){
    cv.toBlob(function(b){
      if(b){ fpSaveBlob(b, fpNamaFile()); fpClosePrint(); }
      else{ alert("Gagal membuat gambar."); }
    }, "image/png");
  });
}

function fpOpenDetail(key){
  fpKEY=key; fpShow("fp-view-detail");
  fpEl("fp-crumb").textContent=fpMESIN;
  var ck="det:"+fpMESIN+":"+key;
  var c=fpCacheGet(ck);
  if(c){ fpRenderDetail(c); return; }
  fpRun("getDetail",[fpMESIN,key],function(d){ fpCacheSet(ck,d); fpRenderDetail(d); });
}
function fpRenderDetail(d){
  fpSTRUCT=d.struct;
  fpCARDS=d.cards;
  var html=d.cards.map(function(c, idx){
    var qr=c.kpc? '<img class="fp-qr" width="86" height="86" data-qr="'+encodeURIComponent(c.kpc)+'" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">' : '<div class="fp-qr" style="width:86px;height:86px"></div>';
    return '<div class="fp-card"><div class="fp-det-head"><span class="fp-det-no">NO '+c.no+'</span>'+
      '<button class="fp-icobtn" title="Edit" onclick="fpEditCard('+idx+')">&#9998;</button>'+
      '<button class="fp-icobtn" title="Download" onclick="fpOpenPrint('+idx+')">&#11123;</button></div>'+
      '<div class="fp-det-body"><div class="fp-det-left">'+
      '<div class="fp-qrrow">'+qr+'<div class="fp-kpc">'+(c.kpc||"-")+'</div></div>'+
      '<div class="fp-inf"><b>TANGGAL</b> '+c.tanggal+'</div><div class="fp-inf"><b>OPERATOR</b> '+c.operator+'</div>'+
      '<div class="fp-inf"><b>MESIN</b> '+c.mesin+'</div><div class="fp-inf"><b>PRODUK</b> '+c.produk+'</div>'+
      '<div class="fp-inf"><b>PANJANG COIL</b> '+fpFmt(c.panjangCoil)+'</div></div></div>'+
      '<div style="height:12px"></div>'+fpMergedTable(c.inputs)+'</div>';
  }).join("") || '<div class="fp-card">Tidak ada data.</div>';
  fpEl("fp-detail-box").innerHTML=html;
  var imgs=fpEl("fp-detail-box").querySelectorAll("img[data-qr]");
  for(var i=0;i<imgs.length;i++){
    (function(im){
      var text=decodeURIComponent(im.getAttribute("data-qr"));
      var cv=fpMakeQr(text, 172);
      if(cv){ im.src=cv.toDataURL(); }
      else{ im.src="https://api.qrserver.com/v1/create-qr-code/?size=86x86&data="+encodeURIComponent(text); }
    })(imgs[i]);
  }
}
</script>
